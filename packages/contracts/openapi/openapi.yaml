        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeliveryZoneRequest'
      responses:
        '200':
          description: Zona actualizada (o sin cambios)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDeliveryZone'
        '400':
          description: Forma inválida o campos no permitidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token ausente, inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Falta `branches.manage_delivery_zones` o la sesión no es aal2
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No existe o fuera de alcance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '`DELIVERY_ZONE_VERSION_CONFLICT` o `DELIVERY_ZONE_DUPLICATE`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/admin/delivery-zones/{id}/status:
    patch:
      operationId: updateAdminDeliveryZoneStatus
      summary: Activa o desactiva una zona (no hay borrado físico)
      description: |
        F09. Exige `branches.manage_delivery_zones` en la sucursal de la zona (404 fuera de alcance). Establece `active`
        con valor explícito (idempotente: si ya tiene ese valor responde 200 sin escribir ni auditar; no usa
        `expectedVersion`, el último valor gana). Un cambio real sube `version` y audita `delivery_zone.status_changed`.
        Desactivar NO borra la zona ni afecta pedidos ya creados; solo deja de contar para nuevas comprobaciones. `reason`
        opcional (máx. 200; sin PII). Respuesta `no-store`.
      tags: [delivery-zones]
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/DeliveryZoneId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeliveryZoneStatusRequest'
      responses:
        '200':
          description: Zona con su estado actual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDeliveryZone'
        '400':
          description: Forma inválida
          content:
            application/json:
