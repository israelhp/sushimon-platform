      description: |
        F08. Exige `branches.read` en esa sucursal (404 si no existe o fuera de alcance; una sucursal inactiva SÍ se
        puede consultar). Devuelve `version` (SHA-256 hex del horario canónico) que el PUT debe reenviar como
        `expectedVersion`. Respuesta `Cache-Control: no-store`.
      tags: [branch-schedule]
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/BranchId'
      responses:
        '200':
          description: Horario con versión
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchHours'
        '400':
          description: El identificador no es un UUID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token ausente, inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: No es personal activo, falta `branches.read` o la sesión no es aal2
