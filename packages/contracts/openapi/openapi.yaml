        - unit
        - clipped
        - minDate
        - groups
        - byBranch
        - topProducts
        - orders
        - cancelled
        - sales
        - averageTicket
        - deliveryOrders
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        branchId: { type: string, nullable: true }
        unit: { type: string, enum: [hour, day] }
        clipped: { type: boolean, description: El rango pedido se recortó a los datos disponibles. }
        minDate: { type: string, format: date }
        groups:
          type: array
          items: { $ref: '#/components/schemas/ReportGroup' }
        byBranch:
          type: array
