      description: |
        F09. Exige `branches.read` en la sucursal de la zona. 404 si no existe o está fuera de alcance (no se distingue).
        Una zona inactiva SÍ se puede consultar. Respuesta `no-store`.
      tags: [delivery-zones]
      security:
