        specs/008-delivery-zones-coverage D9). `departmentId` con formato inválido o ausente => 400; UUID válido que no existe
        => 404 `DEPARTMENT_NOT_FOUND`. Caché pública larga solo en 2xx; los errores llevan `no-store`.
