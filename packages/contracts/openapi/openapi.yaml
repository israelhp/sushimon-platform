  /v1/store/promotions:
    get:
      operationId: listStorePromotions
      summary: Promociones y Happy Hour vigentes o próximas de una sucursal (público, solo informativo)
      description: |
        F15. Sin autenticación. `branchId` obligatorio (sucursal ACTIVA; inexistente o inactiva => 404 `BRANCH_NOT_FOUND`, sin distinguir). `state`: `live` (por defecto; vigente AHORA: `active`,
        `validFrom <= ahora < validUntil` y, si hay `schedule`, el instante local de `America/Guatemala` cae en algún tramo `[startsAt, endsAt)` de su día ISO) o `upcoming` (activa, NO vigente
        ahora y con un próximo inicio dentro de los próximos 14 días, sea por `validFrom` futuro o por el siguiente tramo semanal; las vigentes ahora se excluyen aunque tengan otro tramo futuro). Solo promociones que aplican a esa sucursal (las de «todas las sucursales» incluidas).
        El horario de apertura de la sucursal (F08) NO interviene: una promoción puede estar `live` con la sucursal cerrada; F19 valida ambos.
        Datos públicos únicamente: NUNCA se devuelve el código de un cupón; una promoción con código sale con `requiresCode=true` y SIN `kind`, `value`, `productIds` ni `items` (no se revela el
        descuento de un cupón por esta vía). `isHappyHour` = promoción automática con `schedule` no vacío (derivado; no hay columna). `items` (solo promociones automáticas con productos
        seleccionados, máx. 50): precio regular y precio promocional INDICATIVO calculados en el servidor con el mismo evaluador que usará F19 (cantidad 1, precio de la sucursal de F13,
        solo productos visibles y disponibles, esa promoción por sí sola, sin cupón ni otras promociones); NO es una cotización: el total definitivo lo fija F19/F20 en el servidor y puede diferir.
        `dineInOnly=true` significa «solo consumo en el local»: nunca aplica a pedidos de recojo o entrega. Máx. 100 promociones (primero `live`, luego por `validFrom`, `id`); `truncated`
        indica si se recortó. Caché compartida acotada por el próximo cambio de estado: `Cache-Control: public, max-age=min(N,5), s-maxage=N` con `N = clamp(segundos enteros hasta nextChangeAt, 1, 30)` (el navegador cachea como máximo 5 s; la caché compartida hasta N)
        (`no-store` si `nextChangeAt` ya pasó), sin `stale-while-revalidate` ni `ETag` (la respuesta no lleva cabecera `ETag`); una edición del backoffice puede tardar hasta 30 s en verse en público (F19 revalida al cotizar); `Vary` solo `Accept-Encoding` (la respuesta no depende de cookies ni de `Authorization`). Los errores llevan
        `no-store`. Límite de tasa propio (60/min por IP).
      tags: [promotions]
      security: []
      parameters:
        - name: branchId
          in: query
          required: true
          description: UUID de una sucursal activa.
          schema: { type: string, format: uuid }
        - name: state
          in: query
          description: '`live` (por defecto) o `upcoming`.'
          schema: { type: string, enum: [live, upcoming], default: live }
        - name: compact
          in: query
          required: false
          description: 'F17 (aditivo). `true` = sin `items` ni `productIds` (no lee productos): para banners como el de Happy Hour del menú. Sin valor o `false` = respuesta completa de F15.'
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Promociones de la sucursal
          headers:
            Cache-Control:
              description: public, max-age=min(N,5), s-maxage=N con 1 <= N <= 30 (o no-store)
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorePromotionList'
        '400':
          description: '`branchId` ausente o mal formado, o `state` desconocido'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`BRANCH_NOT_FOUND`: no existe o está inactiva'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`RATE_LIMITED`: límite por IP (60 por minuto). `Cache-Control: no-store` y `Retry-After`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/admin/promotions:
    get:
      operationId: listAdminPromotions
      summary: Promociones del backoffice (paginado, con filtros)
      description: |
        F15. Exige `promotions.read` y `aal2`. Alcance por sucursal: con alcance global ve todas; con alcance acotado solo las que aplican a alguna de sus sucursales (incluidas las de «todas las
        sucursales»), con `branchIds` recortado a su alcance y `editable=false` si no cubre todas las sucursales de la promoción. Filtros: `branchId` (promociones que aplican a esa sucursal;
        fuera de alcance o inexistente => 404 `BRANCH_NOT_FOUND`), `status` (`active` = `active=true`; `inactive`; `scheduled` = activa y aún no empieza; `running` = activa y dentro de
        `[startsAt, endsAt)` (sin mirar el horario semanal; ver `liveNow`); `expired` = activa y ya terminó; el ciclo de vida usa precedencia inactive > expired > scheduled > running), `kind`,
        `from`/`to` (instantes; promociones cuyo `[startsAt, endsAt)` se solapa con `[from, to)`), `q` (nombre o código; contiene, sin distinguir mayúsculas ni acentos; comodines literales; máx. 80).
        Orden por defecto `startsAt` descendente, `id`; `id` desempata siempre. Una consulta para la página + una para sus sucursales (sin N+1). Respuesta `Cache-Control: no-store`.
      tags: [promotions]
      security:
        - bearer: []
      parameters:
        - name: branchId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, enum: [active, inactive, scheduled, running, expired] }
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/PromotionKind' }
        - name: from
          in: query
          description: Instante ISO 8601 con zona (`Z` u offset). Sin zona => 400.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Instante ISO 8601 con zona; debe ser mayor que `from` (si no, 400).
          schema: { type: string, format: date-time }
        - name: q
          in: query
          schema: { type: string, maxLength: 80 }
        - name: sort
          in: query
          schema: { type: string, enum: [startsAt, endsAt, name, createdAt], default: startsAt }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Página de promociones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPromotionPage'
        '400':
          description: Parámetros de consulta inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token ausente, inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: No es personal activo, falta `promotions.read` o la sesión no es aal2
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`BRANCH_NOT_FOUND` (filtro `branchId` inexistente o fuera de alcance)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createAdminPromotion
      summary: Crea una promoción o cupón
      description: |
        F15. Exige `promotions.create` y `aal2`. Alcance: `branchScope=ALL` exige alcance GLOBAL del permiso (si no, 403 `PROMOTION_SCOPE_FORBIDDEN`); `SELECTED` exige que TODAS las `branchIds`
        estén dentro del alcance (una sucursal inexistente o fuera de alcance => 404 `BRANCH_NOT_FOUND`, sin distinguir). `productScope` es explícito: `ALL` (todos los productos; `productIds`
        debe omitirse o venir vacío; si no, 400) o `SELECTED` (1..200 productos existentes; si no, 422 `PROMOTION_SCOPE_INVALID` con `violations` por `productIds[i]`). `code` (opcional; `null` u omitido
        = promoción AUTOMÁTICA; con valor = CUPÓN) se normaliza (recorta espacios y pasa a mayúsculas); único sin distinguir mayúsculas => 409 `PROMOTION_CODE_TAKEN`. `kind` `PERCENT`
        (`0 < value <= 100`) o `FIXED_AMOUNT` (monto en GTQ POR UNIDAD, `0 < value <= 999999.99`); otro `value` bien formado pero fuera de rango => 422 `PROMOTION_VALUE_INVALID`.
        `startsAt`/`endsAt` son instantes con zona; `endsAt > startsAt` (si no, 422 `PROMOTION_PERIOD_INVALID`). `schedule` (opcional; vacío u omitido = todos los días y todo el día dentro de la
        vigencia): tramos semanales `[startsAt, endsAt)` en hora local de `America/Guatemala`, `weekday` ISO 1..7, sin cruzar la medianoche (se parten en dos días; `endsAt` puede ser `24:00`),
        sin solaparse en el mismo día y <= 6 por día; más de 42 tramos en total => 400 (`maxItems`); reglas de negocio (`SLOT_ENDS_BEFORE_START`, `SLOT_OVERLAP`, `SLOT_LIMIT` por día) => 422 `PROMOTION_SCHEDULE_INVALID` con `violations`. `dineInOnly` por defecto `false`; `active` por defecto
        `true`. Nace con `version=1`. Se audita `promotion.created` en la misma transacción (sin PII). Respuesta `no-store`.
      tags: [promotions]
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePromotionRequest'
      responses:
        '201':
          description: Promoción creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPromotion'
        '400':
          description: Forma inválida, campos desconocidos o faltantes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token ausente, inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Falta `promotions.create`, la sesión no es aal2 o `PROMOTION_SCOPE_FORBIDDEN`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`BRANCH_NOT_FOUND` (alguna sucursal no existe o está fuera de alcance)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '`PROMOTION_CODE_TAKEN`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`PROMOTION_VALUE_INVALID`, `PROMOTION_PERIOD_INVALID`, `PROMOTION_SCHEDULE_INVALID` o `PROMOTION_SCOPE_INVALID` (ver `code` y `violations`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`RATE_LIMITED`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: '`PROMOTIONS_BUSY`: la transacción agotó su tiempo; reintentable'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/admin/promotions/{id}:
    get:
      operationId: getAdminPromotion
      summary: Detalle administrativo de una promoción
      description: |
        F15. Exige `promotions.read` y `aal2`. Inexistente o que no aplica a ninguna sucursal del alcance del actor => 404 `PROMOTION_NOT_FOUND` (no se distingue). Incluye el código del cupón
        (solo el personal con permiso lo ve), productos con nombre, tramos y `version`. Respuesta `Cache-Control: no-store`.
      tags: [promotions]
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/PromotionId'
      responses:
        '200':
          description: Promoción
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPromotion'
        '400':
          description: UUID inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token ausente, inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: No es personal activo, falta `promotions.read` o la sesión no es aal2
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`PROMOTION_NOT_FOUND`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      operationId: updateAdminPromotion
      summary: Edita una promoción (parcial, con concurrencia optimista)
      description: |
        F15. Exige `promotions.update` y `aal2`. `expectedVersion` es OBLIGATORIO y debe coincidir con `version`; si no, 409 `PROMOTION_VERSION_CONFLICT` sin guardar. Parcial: además de
        `expectedVersion` al menos un campo entre `name`, `description`, `code` (`null` la convierte en automática), `kind`, `value`, `startsAt`, `endsAt`, `dineInOnly`, `branchScope`/`branchIds`,
        `productScope`/`productIds`, `schedule` (reemplaza TODOS los tramos; `[]` = sin restricción semanal); `active` NO se acepta (usa `PATCH .../status`). Las reglas de `POST` se
        validan sobre el estado RESULTANTE (p. ej. cambiar `kind` a `PERCENT` revalida `value`). Alcance: el actor debe cubrir TODAS las sucursales de la promoción, tanto las actuales como las
        nuevas (`ALL` exige alcance global); una promoción que no toca su alcance => 404 `PROMOTION_NOT_FOUND`; que la toca pero no la cubre entera => 403 `PROMOTION_SCOPE_FORBIDDEN`. Si
        ningún valor cambia responde 200 sin escribir, sin subir `version` y sin auditar. Un cambio real sube `version` en 1 y audita `promotion.updated` (old/new solo de lo cambiado) en la misma
        transacción. Editar una promoción en curso rige de inmediato en el servidor (la caché pública puede tardar hasta 30 s). Respuesta `no-store`.
      tags: [promotions]
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/PromotionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePromotionRequest'
      responses:
        '200':
          description: Promoción actualizada (o sin cambios)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPromotion'
        '400':
          description: Forma inválida, `expectedVersion` ausente, cuerpo sin campos o campos no permitidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token ausente, inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Falta `promotions.update`, la sesión no es aal2 o `PROMOTION_SCOPE_FORBIDDEN`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`PROMOTION_NOT_FOUND` o `BRANCH_NOT_FOUND` (sucursal nueva inexistente o fuera de alcance)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '`PROMOTION_VERSION_CONFLICT` o `PROMOTION_CODE_TAKEN`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`PROMOTION_VALUE_INVALID`, `PROMOTION_PERIOD_INVALID`, `PROMOTION_SCHEDULE_INVALID` o `PROMOTION_SCOPE_INVALID`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`RATE_LIMITED`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: '`PROMOTIONS_BUSY`: la transacción agotó su tiempo; reintentable'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/admin/promotions/{id}/status:
    patch:
      operationId: updateAdminPromotionStatus
      summary: Activa o desactiva una promoción (no hay borrado físico)
      description: |
        F15. Exige `promotions.update` con las mismas reglas de alcance que `PATCH /v1/admin/promotions/{id}` (404 `PROMOTION_NOT_FOUND` si no la toca; 403 `PROMOTION_SCOPE_FORBIDDEN` si no la
        cubre entera). Establece `active` con valor explícito: idempotente (si ya tiene ese valor => 200 sin escribir ni auditar); no usa `expectedVersion` (el último valor gana). Un cambio real
        sube `version` y audita `promotion.status_changed` (`oldActive`/`newActive`, `reason` opcional <= 200 sin PII) en la misma transacción. Desactivar NO borra la promoción ni afecta a pedidos ya creados:
        solo deja de ofrecerse y de evaluarse. Reactivar una ya vencida es válido (sigue vencida). Respuesta `no-store`.
      tags: [promotions]
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/PromotionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePromotionStatusRequest'
      responses:
        '200':
          description: Promoción con su estado actual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPromotion'
        '400':
          description: Forma inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token ausente, inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Falta `promotions.update`, la sesión no es aal2 o `PROMOTION_SCOPE_FORBIDDEN`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`PROMOTION_NOT_FOUND`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`RATE_LIMITED`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: '`PROMOTIONS_BUSY`: la transacción agotó su tiempo; reintentable'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/store/banners:
    get:
      operationId: listStoreBanners
      summary: Banners publicados del Inicio de la tienda (público, solo lectura)
      description: |
        F16. Sin autenticación. Devuelve SOLO los banners elegibles AHORA, ya ordenados (`sortOrder`, `createdAt`, `id`) y recortados a un máximo de 10, sin datos administrativos (sin `code`, versión, auditoría ni ids de
        promoción). `branchId` es opcional: sin él solo salen los banners de `branchScope=ALL`; con él, los `ALL` más los `SELECTED` que incluyen esa sucursal (inexistente o inactiva => 404 `BRANCH_NOT_FOUND`). `locale`
        (`es` por defecto | `en`) elige el idioma de los textos con respaldo POR CAMPO a `es` (`fallbackFields` lista los campos que vinieron en español para que la web marque `lang="es"`); una cadena vacía cuenta como ausente.
        Un banner es elegible si: `active`; `startsAt <= ahora < endsAt` (cada extremo puede faltar; instantes, `America/Guatemala` solo para mostrar); su imagen es un asset READY de tipo `BANNER_IMAGE` con URL pública
        disponible; tiene traducción válida (título e imagen alt en `es`); si apunta a producto o categoría, ese destino está activo; y, si está vinculado a una promoción de F15, la promoción está VIGENTE ahora (`active`,
        vigencia y horario semanal) y aplica a la sucursal consultada (si no, el banner se oculta; no hay error). Un banner vinculado a un cupón NO revela el código ni el descuento: la respuesta nunca incluye datos de la
        promoción. F16 no calcula precios ni descuentos. Una lista vacía es una respuesta válida (200). `nextChangeAt` = próximo instante (<= 14 días) en que puede cambiar el conjunto publicado por tiempo (inicio/fin de
        banner o cambio de vigencia de una promoción vinculada); `null` si no hay. Caché compartida acotada igual que `listStorePromotions`: `public, max-age=min(N,5), s-maxage=N` con `N = clamp(segundos enteros hasta
        nextChangeAt, 1, 30)`, `no-store` si ya pasó; sin `stale-while-revalidate` ni `ETag`; `Vary: Accept-Encoding` (el idioma va en la URL). Una edición del backoffice puede tardar hasta 30 s en verse. Imágenes: URL pública
        permanente (nunca firmada). Límite de tasa 60/min por IP.
      tags: [banners]
      security: []
      parameters:
        - name: branchId
          in: query
          required: false
          description: UUID de una sucursal ACTIVA. Sin él, solo banners de todas las sucursales.
          schema: { type: string, format: uuid }
        - name: locale
          in: query
          required: false
          schema: { $ref: '#/components/schemas/BannerLocale' }
      responses:
        '200':
          description: Banners publicados (puede ser una lista vacía)
          headers:
            Cache-Control:
              description: public, max-age=min(N,5), s-maxage=N con 1 <= N <= 30 (o no-store)
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreBannerList'
        '400':
          description: '`branchId` mal formado o `locale` fuera de `es|en`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`BRANCH_NOT_FOUND`: se envió `branchId` y no existe o está inactiva'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`RATE_LIMITED` (por actor en escrituras; por IP en la ruta pública). `Retry-After`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: '`BANNERS_BUSY`: la transacción agotó su tiempo; reintentable'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/admin/banners:
    get:
      operationId: listAdminBanners
      summary: Banners del backoffice (paginado, con filtros)
      description: |
        F16. Exige `banners.read` y `aal2`. Alcance por sucursal (patrón F15): con alcance global ve todos; con alcance acotado solo los que aplican a alguna de sus sucursales (incluidos los de «todas»), con `branches` recortado
        a su alcance y `editable=false` si no cubre todas las de cada banner. Filtros: `branchId` (banners que aplican a esa sucursal; fuera de alcance o inexistente => 404 `BRANCH_NOT_FOUND`), `lifecycle` (estado derivado:
        `INACTIVE` = `active=false`; `EXPIRED` = activo con `endsAt <= ahora` (para el tope de 100 y el reordenado «vencido» es `endsAt <= ahora` por fecha, independiente de `active`); `SCHEDULED` = activo con `startsAt > ahora`; `PUBLISHED` = activo y dentro de la vigencia; precedencia INACTIVE > EXPIRED > SCHEDULED > PUBLISHED),
        `q` (título en cualquier idioma o código; contiene, sin distinguir mayúsculas ni acentos; comodines literales; máx. 80). Orden por defecto `priority` (`sortOrder`, `createdAt`, `id`: es el orden de la tienda); `id` desempata
        siempre. Una consulta para la página + una para sus sucursales y traducciones (sin N+1). `visibleNow` y `hiddenReason` se calculan con el reloj del servidor. Respuesta `Cache-Control: no-store`.
      tags: [banners]
      security:
        - bearer: []
      parameters:
        - name: branchId
          in: query
          schema: { type: string, format: uuid }
        - name: lifecycle
          in: query
          schema: { $ref: '#/components/schemas/BannerLifecycle' }
        - name: q
          in: query
          schema: { type: string, maxLength: 80 }
        - name: sort
          in: query
          schema: { type: string, enum: [priority, startsAt, endsAt, createdAt], default: priority }
        - name: order
          in: query
          description: 'Por defecto `asc`, también con `sort=startsAt|endsAt|createdAt` (los nulos van al final).'
          schema: { type: string, enum: [asc, desc], default: asc }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Página de banners
          headers:
            Cache-Control:
              description: no-store
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBannerPage'
        '400':
          description: 'Parámetros de consulta inválidos'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 'Token ausente, inválido o expirado'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'No es personal activo, falta `banners.read` o la sesión no es aal2'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`BRANCH_NOT_FOUND` (filtro `branchId` inexistente o fuera de alcance)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createAdminBanner
      summary: Crea un banner
      description: |
        F16. Exige `banners.create` y `aal2`. Alcance: `branchScope=ALL` exige alcance GLOBAL del permiso (si no, 403 `BANNER_SCOPE_FORBIDDEN`); `SELECTED` exige que TODAS las `branchIds` estén en el alcance (sucursal
        inexistente o fuera de alcance => 404 `BRANCH_NOT_FOUND`); `SELECTED` vacío o `ALL` con `branchIds` => 422 `BANNER_SCOPE_INVALID`. `code` (obligatorio, minúsculas `^[a-z0-9][a-z0-9-]{2,63}$`, se normaliza recortando y
        pasando a minúsculas; INMUTABLE después) único => 409 `BANNER_CODE_TAKEN`. `imageAssetId`: asset existente, `READY` y de tipo `BANNER_IMAGE`; si no => 422 `BANNER_IMAGE_INVALID` (violations `ASSET_UNKNOWN`,
        `ASSET_NOT_READY`, `ASSET_KIND_MISMATCH`). `translations.es` es obligatoria (`title` 1..80 y `imageAlt` 1..200 tras recortar; si no => 422 `BANNER_TRANSLATION_INVALID`); `translations.en` es opcional y, vacía, se
        ignora; un campo en blanco se guarda como ausente. `cta` (destino estructurado; sin rutas ni URL de texto libre): `NONE`, `MENU`, `PROMOTIONS`, `CATEGORY` (`categoryId` activo), `PRODUCT` (`productId` activo) o `PAGE`
        (`page` de la lista blanca); datos incoherentes con el tipo o destino inexistente/inactivo => 422 `BANNER_CTA_INVALID`. Los enlaces externos NO se permiten en v1. `startsAt`/`endsAt` son instantes con zona, ambos
        opcionales (sin `endsAt` = sin fin); `endsAt > startsAt` (si no, 422 `BANNER_PERIOD_INVALID`). `promotionId` (opcional): promoción existente cuyo alcance de sucursales cubre el del banner (si no, 422
        `BANNER_PROMOTION_INVALID`); el banner solo se publica mientras esa promoción esté vigente. `sortOrder` (opcional, 0..9999; por defecto = último + 1). `active` por defecto `true`. Más de 100 banners no vencidos => 422
        `BANNER_LIMIT_REACHED`. Nace con `version=1`. Audita `banner.created` en la misma transacción (sin PII). Respuesta `no-store`.
      tags: [banners]
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBannerRequest'
      responses:
        '201':
          description: Banner creado
          headers:
            Cache-Control:
              description: no-store
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBanner'
        '400':
          description: 'Forma inválida, campos desconocidos o faltantes (incluye `ALL` con `branchIds` mal formados)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 'Token ausente, inválido o expirado'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Falta `banners.create`, la sesión no es aal2 o `BANNER_SCOPE_FORBIDDEN`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`BRANCH_NOT_FOUND` (alguna sucursal no existe o está fuera de alcance)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '`BANNER_CODE_TAKEN`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`BANNER_IMAGE_INVALID`, `BANNER_TRANSLATION_INVALID`, `BANNER_CTA_INVALID`, `BANNER_PERIOD_INVALID`, `BANNER_SCOPE_INVALID`, `BANNER_PROMOTION_INVALID` o `BANNER_LIMIT_REACHED` (ver `code` y `violations`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`RATE_LIMITED` (por actor en escrituras; por IP en la ruta pública). `Retry-After`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: '`BANNERS_BUSY`: la transacción agotó su tiempo; reintentable'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/admin/banners/order:
    put:
      operationId: reorderAdminBanners
      summary: Reordena los banners no vencidos (prioridad atómica)
      description: |
        F16. Exige `banners.update` con alcance GLOBAL (el orden es único para toda la cadena) y `aal2`; un alcance acotado => 403 `BANNER_SCOPE_FORBIDDEN`. `orderedIds` debe contener EXACTAMENTE los banners NO vencidos
        (activos o no, programados o publicados; los vencidos quedan fuera), sin duplicados ni ajenos; si no => 422 `BANNER_REORDER_MISMATCH` sin escribir (recarga la lista y reintenta). Asigna `sortOrder` 0..n-1 en una
        transacción bajo bloqueo (el resultado concurrente es uno de los órdenes enviados, nunca mezclado) y sube `version` solo de los banners cuyo `sortOrder` cambia. Idempotente: repetir el mismo orden responde 200 sin
        escribir ni auditar. Un cambio real audita `banner.reordered`. Respuesta `no-store`. Para mover UN banner basta `PATCH` de `sortOrder` (la prioridad no es única: el empate se resuelve por `createdAt` e `id`).
      tags: [banners]
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderBannersRequest'
      responses:
        '200':
          description: Orden resultante de los banners reordenados
          headers:
            Cache-Control:
              description: no-store
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBannerOrder'
        '400':
          description: 'Forma inválida (UUID mal formado, más de 100 elementos, propiedades desconocidas)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 'Token ausente, inválido o expirado'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Falta `banners.update` con alcance global, la sesión no es aal2 o `BANNER_SCOPE_FORBIDDEN`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`BANNER_REORDER_MISMATCH`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`RATE_LIMITED` (por actor en escrituras; por IP en la ruta pública). `Retry-After`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: '`BANNERS_BUSY`: la transacción agotó su tiempo; reintentable'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/admin/banners/{id}:
    get:
      operationId: getAdminBanner
      summary: Detalle administrativo de un banner
      description: |
        F16. Exige `banners.read` y `aal2`. Inexistente o que no aplica a ninguna sucursal del alcance del actor => 404 `BANNER_NOT_FOUND` (no se distingue). Incluye ambas traducciones tal como se guardaron (sin respaldo) y
        el estado derivado. `Cache-Control: no-store`.
      tags: [banners]
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/BannerId'
      responses:
        '200':
          description: Banner
          headers:
            Cache-Control:
              description: no-store
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBanner'
        '400':
          description: 'UUID mal formado'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 'Token ausente, inválido o expirado'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'No es personal activo, falta `banners.read` o la sesión no es aal2'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`BANNER_NOT_FOUND`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      operationId: updateAdminBanner
      summary: Edita un banner (parcial, con concurrencia optimista)
      description: |
        F16. Exige `banners.update` y `aal2`. `expectedVersion` es OBLIGATORIO y debe coincidir con `version`; si no, 409 `BANNER_VERSION_CONFLICT` sin guardar. Parcial: los campos omitidos NO se tocan (no se reemplazan).
        Admite `imageAssetId`, `translations` (por idioma y por campo: omitir = sin cambio; `null` en un campo opcional lo borra; `translations.en: null` elimina la traducción al inglés; `es.title` y `es.imageAlt` no pueden
        quedar vacíos), `cta`, `startsAt`/`endsAt` (`null` = sin extremo), `branchScope`/`branchIds` (reemplaza TODAS las sucursales), `promotionId` (`null` lo desvincula) y `sortOrder`; `code` e `active` NO se aceptan
        (`active` usa `PATCH .../status`). Las reglas de `POST` se validan sobre el estado RESULTANTE. Alcance: el actor debe cubrir TODAS las sucursales del banner, las actuales y las nuevas (`ALL` exige alcance global);
        un banner que no toca su alcance => 404 `BANNER_NOT_FOUND`; que lo toca pero no lo cubre entero => 403 `BANNER_SCOPE_FORBIDDEN`. Reemplazar la imagen NO borra el asset anterior (queda en la biblioteca de medios de F14).
        Si ningún valor cambia responde 200 sin escribir, sin subir `version` y sin auditar. Un cambio real sube `version` en 1 y audita `banner.updated` (old/new solo de lo cambiado: ids de asset, CTA, fechas, ids de sucursal,
        prioridad y claves de texto cambiadas; sin PII) en la misma transacción. Respuesta `no-store`.
      tags: [banners]
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/BannerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBannerRequest'
      responses:
        '200':
          description: Banner actualizado (o sin cambios)
          headers:
            Cache-Control:
              description: no-store
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBanner'
        '400':
          description: 'Forma inválida, campos desconocidos (`code`, `active`) o `expectedVersion` ausente'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 'Token ausente, inválido o expirado'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Falta `banners.update`, la sesión no es aal2 o `BANNER_SCOPE_FORBIDDEN`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`BANNER_NOT_FOUND` o `BRANCH_NOT_FOUND`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '`BANNER_VERSION_CONFLICT`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`BANNER_IMAGE_INVALID`, `BANNER_TRANSLATION_INVALID`, `BANNER_CTA_INVALID`, `BANNER_PERIOD_INVALID`, `BANNER_SCOPE_INVALID` o `BANNER_PROMOTION_INVALID`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`RATE_LIMITED` (por actor en escrituras; por IP en la ruta pública). `Retry-After`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: '`BANNERS_BUSY`: la transacción agotó su tiempo; reintentable'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/admin/banners/{id}/status:
    patch:
      operationId: updateAdminBannerStatus
      summary: Activa o desactiva un banner (idempotente, sin versión)
      description: |
        F16. Exige `banners.update` con las mismas reglas de alcance que `PATCH /v1/admin/banners/{id}` (404 `BANNER_NOT_FOUND` si no lo toca; 403 `BANNER_SCOPE_FORBIDDEN` si no lo cubre entero). Idempotente: sin
        `expectedVersion` (el último valor gana); si `active` ya tiene ese valor responde 200 sin escribir ni auditar. Un cambio real sube `version` en 1 y audita `banner.status_changed` (`oldActive`, `newActive`, `reason`).
        Desactivar NO borra el banner ni su imagen. Respuesta `no-store`.
      tags: [banners]
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/BannerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBannerStatusRequest'
      responses:
        '200':
          description: Banner con su estado
          headers:
            Cache-Control:
              description: no-store
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBanner'
        '400':
          description: 'Forma inválida'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 'Token ausente, inválido o expirado'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Falta `banners.update`, la sesión no es aal2 o `BANNER_SCOPE_FORBIDDEN`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`BANNER_NOT_FOUND`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`RATE_LIMITED` (por actor en escrituras; por IP en la ruta pública). `Retry-After`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: '`BANNERS_BUSY`: la transacción agotó su tiempo; reintentable'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  parameters:
    PromotionId:
      name: id
      in: path
      required: true
      description: UUID de la promoción (`promotions.id`).
      schema: { type: string, format: uuid }
    BannerId:
      name: id
      in: path
      required: true
      description: UUID del banner (`banners.id`).
      schema: { type: string, format: uuid }
    StaffId:
      name: id
      in: path
      required: true
      description: UUID del empleado (`staff_users.id`).
      schema: { type: string, format: uuid }
    RoleId:
      name: id
      in: path
      required: true
      description: UUID del rol.
      schema: { type: string, format: uuid }
    BranchId:
      name: id
      in: path
      required: true
      description: UUID de la sucursal.
      schema: { type: string, format: uuid }
    ClosureId:
      name: closureId
      in: path
      required: true
      description: UUID del cierre extraordinario (`branch_closures.id`).
      schema: { type: string, format: uuid }
    DeliveryZoneId:
      name: id
      in: path
      required: true
      description: UUID de la zona de entrega (`delivery_zones.id`).
      schema: { type: string, format: uuid }
    FavoriteProductId:
      name: productId
      in: path
      required: true
      description: UUID del producto (`products.id`, catálogo F11).
      schema: { type: string, format: uuid }
    CategoryId:
      name: id
      in: path
      required: true
      description: UUID de la categoría (`categories.id`).
      schema: { type: string, format: uuid }
    ProductId:
      name: id
      in: path
      required: true
      description: UUID del producto (`products.id`).
      schema: { type: string, format: uuid }
    ProductSlug:
      name: slug
      in: path
      required: true
      description: Slug público del producto (`products.slug`).
      schema: { type: string, maxLength: 80, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
    ModifierGroupId:
      name: id
      in: path
      required: true
      description: UUID del grupo de modificadores (`modifier_groups.id`).
      schema: { type: string, format: uuid }
    ModifierId:
      name: id
      in: path
      required: true
      description: UUID de la opción (`modifiers.id`).
      schema: { type: string, format: uuid }
    MediaAssetId:
      name: id
      in: path
      required: true
      description: UUID del asset de medios (`media_assets.id`, F14).
      schema: { type: string, format: uuid }
    ProductMediaId:
      name: mediaId
      in: path
      required: true
      description: UUID de la fila de imagen del producto (`product_media.id`, F14).
      schema: { type: string, format: uuid }
    BranchProductId:
      name: productId
      in: path
      required: true
      description: UUID del producto (`products.id`) cuyo precio de sucursal se gestiona (F13).
      schema: { type: string, format: uuid }
    AdminOrderId:
      name: id
      in: path
      required: true
      description: UUID del pedido (`orders.id`).
      schema: { type: string, format: uuid }
  schemas:
    PublicBranch:
      type: object
      description: Campos públicos de una sucursal activa (nada administrativo).
      required: [id, code, name, address, phone, latitude, longitude]
      properties:
        id: { type: string, format: uuid }
        code:
          { type: string, description: 'Identificador de negocio estable (slug en minúsculas).' }
        name: { type: string }
        address: { type: string }
        phone: { type: string, nullable: true }
        latitude: { type: number, nullable: true, minimum: -90, maximum: 90 }
        longitude: { type: number, nullable: true, minimum: -180, maximum: 180 }
    PublicBranchListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PublicBranch' }
    AdminBranch:
      type: object
      required: [id, code, name, address, phone, latitude, longitude, active, createdAt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        address: { type: string }
        phone: { type: string, nullable: true }
        latitude: { type: number, nullable: true, minimum: -90, maximum: 90 }
        longitude: { type: number, nullable: true, minimum: -180, maximum: 180 }
        active:
          type: boolean
          description: Estado ADMINISTRATIVO. No es "abierta ahora" (F08) ni "acepta pedidos".
        createdAt: { type: string, format: date-time }
    AdminBranchPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminBranch' }
        page: { type: integer }
        pageSize: { type: integer }
        total:
          { type: integer, description: 'Total de sucursales que cumplen el filtro y el alcance.' }
    CreateBranchRequest:
      type: object
      required: [code, name, address]
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 2
          maxLength: 40
          description: 'Se recorta y pasa a minúsculas; luego debe cumplir ^[a-z0-9]+(-[a-z0-9]+)*$.'
        name: { type: string, minLength: 1, maxLength: 100 }
        address: { type: string, minLength: 1, maxLength: 300 }
        phone:
          type: string
          nullable: true
          maxLength: 25
          description: 'Opcional. Dígitos con +, espacios, guiones y paréntesis; 7 a 15 dígitos.'
        latitude: { type: number, nullable: true, minimum: -90, maximum: 90 }
        longitude: { type: number, nullable: true, minimum: -180, maximum: 180 }
        active:
          type: boolean
          default: true
          description: Estado inicial (por defecto activa).
    UpdateBranchRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        address: { type: string, minLength: 1, maxLength: 300 }
        phone: { type: string, nullable: true, maxLength: 25 }
        latitude: { type: number, nullable: true, minimum: -90, maximum: 90 }
        longitude: { type: number, nullable: true, minimum: -180, maximum: 180 }
    UpdateBranchStatusRequest:
      type: object
      required: [active]
      additionalProperties: false
      properties:
        active: { type: boolean }
        reason:
          type: string
          maxLength: 200
          description: Obligatorio al desactivar; opcional al activar.
    BranchRef:
      type: object
      required: [id, name, code]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
    GrantScope:
      type: object
      description: |
        Alcance de UN permiso: `allBranches` (asignación global) o las sucursales ACTIVAS donde lo posee.
        Solo cuentan asignaciones activas de personal activo hacia sucursales activas.
      required: [allBranches, branchIds]
      properties:
        allBranches: { type: boolean }
        branchIds:
          type: array
          items: { type: string, format: uuid }
    StaffIdentityStatus:
      type: string
      description: |
        Derivado de `staff_users.auth_user_id`: PENDING_LINK = preautorizado, aún sin iniciar sesión con Google;
        LINKED = identidad vinculada. Independiente de `active`.
      enum: [PENDING_LINK, LINKED]
    RoleRef:
      type: object
      required: [id, code, name]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
    StaffAssignmentView:
      type: object
      required: [role, branch, effective]
      properties:
        role: { $ref: '#/components/schemas/RoleRef' }
        branch:
          allOf:
            - $ref: '#/components/schemas/BranchRef'
          nullable: true
          description: null = alcance GLOBAL (todas las sucursales; solo el rol admin).
        effective:
          type: boolean
          description: false si la asignación está inactiva o su sucursal está inactiva (no concede acceso operativo).
    StaffRef:
      type: object
      required: [id, fullName]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
    AdminStaff:
      type: object
      description: Nunca incluye `authUserId`.
      required:
        [
          id,
          fullName,
          email,
          active,
          identityStatus,
          linkedAt,
          createdAt,
          createdBy,
          assignments,
          manageable,
        ]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        email: { type: string, description: Minúsculas. }
        active: { type: boolean }
        identityStatus: { $ref: '#/components/schemas/StaffIdentityStatus' }
        linkedAt:
          {
            type: string,
            format: date-time,
            nullable: true,
            description: 'null si PENDING_LINK o vinculado antes de F03.',
          }
        createdAt: { type: string, format: date-time }
        createdBy:
          allOf:
            - $ref: '#/components/schemas/StaffRef'
          nullable: true
          description: null = proceso manual (bootstrap) o anterior a F03.
        assignments:
          type: array
          items: { $ref: '#/components/schemas/StaffAssignmentView' }
        manageable:
          type: boolean
          description: El solicitante puede modificar a este empleado (alcance completo y roles otorgables). Solo orienta la UI.
    AdminStaffPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminStaff' }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer, description: Total que cumple filtros y alcance. }
    StaffAssignmentInput:
      type: object
      required: [roleId, branchId]
      additionalProperties: false
      properties:
        roleId: { type: string, format: uuid }
        branchId:
          type: string
          format: uuid
          nullable: true
          description: null = global (solo con el rol admin y solo otorgable con alcance global).
    CreateStaffRequest:
      type: object
      required: [fullName, email, assignments]
      additionalProperties: false
      properties:
        fullName: { type: string, minLength: 1, maxLength: 120 }
        email:
          { type: string, format: email, maxLength: 254, description: Se normaliza a minúsculas. }
        assignments:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/StaffAssignmentInput' }
    UpdateStaffRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        fullName: { type: string, minLength: 1, maxLength: 120 }
        email:
          { type: string, format: email, maxLength: 254, description: Solo mientras PENDING_LINK. }
    UpdateStaffStatusRequest:
      type: object
      required: [active]
      additionalProperties: false
      properties:
        active: { type: boolean }
        reason: { type: string, maxLength: 200, description: Obligatorio al desactivar. }
    ReplaceStaffAssignmentsRequest:
      type: object
      required: [assignments]
      additionalProperties: false
      properties:
        assignments:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/StaffAssignmentInput' }
    PermissionRef:
      type: object
      required: [code, description, module]
      properties:
        code: { type: string, example: orders.accept }
        description: { type: string }
        module: { type: string, description: 'Prefijo del código (orders, staff...).' }
    AdminRole:
      type: object
      required: [id, code, name, isSystem, permissions, assignedStaffCount]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        isSystem: { type: boolean, description: Solo lectura (no editable por API). }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/PermissionRef' }
        assignedStaffCount:
          { type: integer, description: Empleados activos con una asignación activa de este rol. }
    AdminRoleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminRole' }
    ReplaceRolePermissionsRequest:
      type: object
      required: [permissions]
      additionalProperties: false
      properties:
        permissions:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: string, pattern: '^[a-z_]+\.[a-z_]+$' }
    AdminPermissionModule:
      type: object
      required: [module, permissions]
      properties:
        module: { type: string }
        permissions:
          type: array
          items:
            type: object
            required: [code, description]
            properties:
              code: { type: string }
              description: { type: string }
    AdminPermissionCatalog:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminPermissionModule' }
    AuthStaffAssignment:
      type: object
      required: [role, branchId]
      properties:
        role: { $ref: '#/components/schemas/StaffRole' }
        branchId:
          type: string
          format: uuid
          nullable: true
          description: null = todas las sucursales.
    AuthStaffContext:
      type: object
      required:
        [staffId, fullName, assignments, permissions, allBranches, branchIds, grants, branches]
      properties:
        staffId: { type: string, format: uuid }
        fullName: { type: string }
        assignments:
          type: array
          items: { $ref: '#/components/schemas/AuthStaffAssignment' }
        permissions:
          type: array
          description: Unión de permisos de los roles con asignación activa.
          items: { $ref: '#/components/schemas/StaffPermission' }
        allBranches:
          type: boolean
          deprecated: true
          description: |
            Unión plana de todos los roles (solo orienta la UI; NUNCA autoriza). Usa `grants` para saber dónde aplica
            cada permiso.
        branchIds:
          type: array
          deprecated: true
          items: { type: string, format: uuid }
        grants:
          type: object
          description: |
            F03. Permiso -> alcance (`GrantScope`), calculado en el servidor solo con asignaciones activas de personal
            activo hacia sucursales activas. Sin caché entre solicitudes: la revocación es inmediata.
          additionalProperties:
            $ref: '#/components/schemas/GrantScope'
        branches:
          type: array
          description: Sucursales ACTIVAS sobre las que el empleado tiene algún permiso (todas las activas si tiene alcance global).
          items: { $ref: '#/components/schemas/BranchRef' }
    AuthContextResponse:
      type: object
      required:
        [
          authUserId,
          email,
          provider,
          isCustomer,
          aal,
          staffAuthorized,
          mfaRequired,
          access,
          staff,
          backofficeAccess,
        ]
      properties:
        authUserId: { type: string, format: uuid, description: 'auth.users.id (claim sub).' }
        email: { type: string, nullable: true }
        provider:
          { type: string, nullable: true, description: 'Proveedor de identidad (p. ej. google).' }
        isCustomer:
          type: boolean
          description: Existe un perfil de cliente para esta identidad.
        aal:
          type: string
          enum: [aal1, aal2]
          description: Nivel de aseguramiento de ESTA sesión, leído del JWT verificado (aal2 = TOTP verificado).
        staffAuthorized:
          type: boolean
          description: Personal activo con asignación activa (independiente del nivel MFA).
        mfaRequired:
          type: boolean
          description: Personal autorizado cuya sesión aún no es aal2 (debe configurar o verificar TOTP).
        access:
          type: string
          enum: [NOT_STAFF, MFA_REQUIRED, GRANTED]
          description: |
            NOT_STAFF = sin autorización administrativa; MFA_REQUIRED = personal activo en aal1;
            GRANTED = personal activo en aal2.
        staff:
          allOf:
            - $ref: '#/components/schemas/AuthStaffContext'
          nullable: true
          description: Solo con `access = GRANTED`; null en cualquier otro caso (nada administrativo antes de aal2).
        backofficeAccess:
          type: boolean
          description: Igual a `access = GRANTED`. Indicador para la UI; el acceso real lo decide cada endpoint.
    AdminContextResponse:
      type: object
      required: [authUserId, email, aal, staff]
      properties:
        authUserId: { type: string, format: uuid }
        email: { type: string, nullable: true }
        aal: { type: string, enum: [aal2] }
        staff: { $ref: '#/components/schemas/AuthStaffContext' }
    CustomerProfile:
      type: object
      required: [id, fullName, email, phone, createdAt]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    MeResponse:
      type: object
      required: [authUserId, email, customer, isStaff]
      properties:
        authUserId: { type: string, format: uuid }
        email:
          {
            type: string,
            nullable: true,
            description: 'Correo de la identidad de Supabase Auth (solo lectura).',
          }
        customer: { $ref: '#/components/schemas/CustomerProfile' }
        isStaff: { type: boolean }
    UpdateCustomerProfileRequest:
      type: object
      additionalProperties: false
      description: |
        Campos editables del perfil comercial. Omitido = sin cambios. `phone: null` o cadena vacía borra el teléfono.
        Cualquier otra propiedad (identidad, correo, roles, permisos, `customerId`…) responde 400.
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 120
          description: |
            Se recortan espacios y se colapsan los internos. Solo letras (incluidas tildes y ñ), espacios,
            apóstrofos, guiones y puntos; debe contener al menos una letra. Sin `null`.
        phone:
          type: string
          nullable: true
          maxLength: 20
          description: |
            Guatemala: 8 dígitos locales, con o sin `+502`/`502`; se guarda como `+502XXXXXXXX`.
            Otros países: `+` seguido de 8 a 15 dígitos (E.164), sin prefijo de país asumido.
    CustomerStorefrontContext:
      type: object
      required: [authUserId, email, provider, avatarUrl, customer, isStaff, pendingSections]
      properties:
        authUserId: { type: string, format: uuid }
        email:
          {
            type: string,
            nullable: true,
            description: 'Correo de la identidad (Auth), no editable.',
          }
        provider:
          { type: string, nullable: true, description: 'Proveedor de identidad (p. ej. google).' }
        avatarUrl:
          type: string
          format: uri
          nullable: true
          description: Imagen de la identidad de Google (https, dominio permitido). Null si no existe. No se copia a almacenamiento propio.
        customer: { $ref: '#/components/schemas/CustomerProfile' }
        isStaff: { type: boolean }
        pendingSections:
          type: array
          description: Secciones de Mi cuenta sin contrato implementado todavía. No tienen contadores.
          items:
            type: string
            enum: [favorites, orders]
    FavoriteProductStatus:
      type: string
      description: |
        Estado del producto favorito según el catálogo (enum abierto: tolerar valores futuros). `ACTIVE` = publicado y
        pedible; `UNAVAILABLE` = publicado pero no pedible ahora; `INACTIVE` = despublicado; `REMOVED` = ya no existe;
        `UNKNOWN` = no se pudo consultar el catálogo. Solo `ACTIVE` y `UNAVAILABLE` traen `product`.
      enum: [ACTIVE, INACTIVE, UNAVAILABLE, REMOVED, UNKNOWN]
    FavoriteProductSummary:
      type: object
      description: |
        Resumen público MÍNIMO que entrega el catálogo. Sin precios, sin disponibilidad por sucursal y sin datos internos
        (costos, notas, banderas administrativas). El precio vigente lo resuelve el catálogo de la sucursal elegida.
      required: [id, name, nameEn, imageUrl, categoryId]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        nameEn: { type: string, nullable: true }
        imageUrl: { type: string, format: uri, nullable: true }
        categoryId: { type: string, format: uuid, nullable: true }
    FavoriteItem:
      type: object
      required: [productId, addedAt, status, product]
      properties:
        productId: { type: string, format: uuid }
        addedAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/FavoriteProductStatus' }
        product:
          allOf:
            - $ref: '#/components/schemas/FavoriteProductSummary'
          nullable: true
          description: null cuando `status` no es `ACTIVE`/`UNAVAILABLE` (retirado, despublicado o catálogo no consultable).
    CustomerFavorites:
      type: object
      required: [items, page, pageSize, total, favoriteProductIds, limit, catalogStatus]
      properties:
        items:
          type: array
          description: Página pedida (vacía con `pageSize=0`).
          items: { $ref: '#/components/schemas/FavoriteItem' }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer, description: Cantidad total de favoritos del cliente (≤ `limit`). }
        favoriteProductIds:
          type: array
          description: TODOS los ids favoritos (≤ `limit`), más recientes primero. Fuente del estado `isFavorite` de las tarjetas.
          items: { type: string, format: uuid }
        limit: { type: integer, description: Tope de favoritos por cliente (200). }
        catalogStatus:
          type: string
          description: '`UNAVAILABLE` = el catálogo no pudo consultarse; los items vienen con `status = UNKNOWN` y `product = null`.'
          enum: [AVAILABLE, UNAVAILABLE]
    ReadyResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok]
        checks:
          type: object
          required: [database, schemaApp]
          properties:
            database:
              type: string
              enum: [up]
            schemaApp:
              type: string
              enum: [present]
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    ErrorResponse:
      type: object
      required: [statusCode, error, message]
      properties:
        statusCode: { type: integer }
        error: { type: string }
        message: { type: string }
        requestId:
          type: string
          description: Identificador de la solicitud (igual a la cabecera X-Request-Id).
        details:
          type: array
          description: Mensajes de validación por campo (solo en 400).
          items: { type: string }
        code:
          type: string
          description: |
            Código de negocio estable y legible por máquina (opcional; p. ej. `HOURS_VERSION_CONFLICT`, `CLOSURE_OVERLAP`,
            `SCHEDULE_INVALID`, `BRANCH_SCHEDULE_BUSY`, `CLOSURE_LIMIT_REACHED`; F09: `DELIVERY_ZONE_DUPLICATE`, `DELIVERY_ZONE_VERSION_CONFLICT`, `MUNICIPALITY_NOT_FOUND`, `DEPARTMENT_NOT_FOUND`, `BRANCH_NOT_AVAILABLE`; F10: `CATEGORY_SLUG_TAKEN`, `CATEGORY_CYCLE`, `CATEGORY_DEPTH_EXCEEDED`, `CATEGORY_PARENT_INVALID`, `CATEGORY_REORDER_MISMATCH`, `CATEGORY_LIMIT_REACHED`; F11: `PRODUCT_NOT_FOUND`, `PRODUCT_SLUG_TAKEN`, `PRODUCT_SKU_TAKEN`, `PRODUCT_CATEGORY_INVALID`, `PRODUCT_MEDIA_INVALID`; F12: `MODIFIER_GROUP_NOT_FOUND`, `MODIFIER_NOT_FOUND`, `MODIFIER_GROUP_NAME_TAKEN`, `MODIFIER_NAME_TAKEN`, `MODIFIER_LIMITS_INVALID`, `MODIFIER_GROUP_UNSATISFIABLE`, `MODIFIER_LIMIT_REACHED`, `MODIFIER_REORDER_MISMATCH`, `MODIFIER_GROUP_INVALID`; F13: `BRANCH_NOT_FOUND`, `BRANCH_PRICE_INVALID`, `PRODUCT_NOT_AVAILABLE` (solo servicio, F19), `BRANCH_NOT_AVAILABLE`; 503 reintentable: `CATEGORIES_BUSY`, `PRODUCTS_BUSY`, `MODIFIERS_BUSY`, `BRANCH_PRODUCTS_BUSY`; F14: `MEDIA_NOT_FOUND`, `MEDIA_TYPE_NOT_ALLOWED`, `MEDIA_TOO_LARGE`, `MEDIA_PENDING_LIMIT_REACHED`, `MEDIA_UPLOAD_EXPIRED` (410), `MEDIA_OBJECT_MISSING`, `MEDIA_CONTENT_MISMATCH`, `MEDIA_IN_USE`, `MEDIA_ALREADY_ATTACHED`, `MEDIA_ASSET_NOT_READY`, `MEDIA_REORDER_MISMATCH`, `PRODUCT_MEDIA_NOT_FOUND`, `MEDIA_STORAGE_UNAVAILABLE` (503), `MEDIA_BUSY` (503 reintentable); F15: `PROMOTION_NOT_FOUND`, `PROMOTION_CODE_TAKEN`, `PROMOTION_VERSION_CONFLICT`, `PROMOTION_VALUE_INVALID`, `PROMOTION_PERIOD_INVALID`, `PROMOTION_SCHEDULE_INVALID`, `PROMOTION_SCOPE_INVALID`, `PROMOTION_SCOPE_FORBIDDEN` (403), `PROMOTIONS_BUSY` (503 reintentable); F16: `BANNER_NOT_FOUND`, `BANNER_CODE_TAKEN`, `BANNER_VERSION_CONFLICT`, `BANNER_IMAGE_INVALID`, `BANNER_TRANSLATION_INVALID`, `BANNER_CTA_INVALID`, `BANNER_PERIOD_INVALID`, `BANNER_SCOPE_INVALID`, `BANNER_PROMOTION_INVALID`, `BANNER_REORDER_MISMATCH`, `BANNER_LIMIT_REACHED`, `BANNER_SCOPE_FORBIDDEN` (403), `BANNERS_BUSY` (503 reintentable); F19: `QUOTE_LIMITS_EXCEEDED` (400), `CHECKOUT_BUSY` (503 reintentable); F20: `IDEMPOTENCY_KEY_INVALID` (400), `QUOTE_CHANGED` (409), `QUOTE_EXPIRED` (409), `IDEMPOTENCY_KEY_REUSED` (409), `IDEMPOTENCY_IN_PROGRESS` (409), `QUOTE_INVALID` (422), `CHECKOUT_BLOCKED` (422), `DELIVERY_PROVIDER_NOT_SELECTABLE` (422), `CONTACT_INCOMPLETE` (422), `PAYMENT_METHOD_UNAVAILABLE` (422), `PENDING_ORDERS_LIMIT` (429), `ORDERS_BUSY` (503 reintentable), `ORDERS_UNAVAILABLE` (503); 404 de dirección ajena sin código; F22: `ORDER_NOT_FOUND` (404), `ORDER_REASON_REQUIRED` (400), `ORDER_CURSOR_INVALID` (400), `ORDER_ACTION_FORBIDDEN` (403), `ORDER_STATE_CONFLICT` (409), `ORDER_TRANSITION_INVALID` (422; `violations[].code`: `ORDER_TERMINAL`, `ORDER_FULFILLMENT_MISMATCH`, `ORDER_SOURCE_INVALID`, `ORDER_DISPATCH_NOT_AVAILABLE`, `ORDER_PROVIDER_BLOCKED_EXTERNAL`, `ORDER_CANCEL_NOT_ALLOWED`); 503 reintentable: `ORDERS_BUSY`). Los clientes deben ramificar por `code`, nunca por `message`.
        violations:
          type: array
          description: Violaciones estructuradas de reglas de negocio (422/409 de F08 y F09).
          items: { $ref: '#/components/schemas/ErrorViolation' }
    ErrorViolation:
      type: object
      description: Violación estructurada de una regla de negocio (F08). `path` localiza el elemento; `code` es estable.
      required: [path, code, message]
      properties:
        path:
          type: string
          example: 'days[4].intervals[1]'
          description: 'Ruta en la solicitud (p. ej. `days[4].intervals[1]`, `startsAt`) o, en CLOSURE_OVERLAP, `closures/<id>` del cierre en conflicto.'
        code:
          type: string
          example: INTERVAL_OVERLAP
        message: { type: string }
    BranchHoursInterval:
      type: object
      description: |
        Intervalo semiabierto `[opensAt, closesAt)` en hora LOCAL del restaurante. `opensAt < closesAt` estricto; no
        existe cruce de medianoche (un turno nocturno se divide en dos días). `closesAt` admite `24:00` (fin del día).
      required: [opensAt, closesAt]
      additionalProperties: false
      properties:
        opensAt:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: '11:00'
        closesAt:
          type: string
          pattern: '^(([01][0-9]|2[0-3]):[0-5][0-9]|24:00)$'
          example: '24:00'
    BranchHoursDay:
      type: object
      required: [weekday, intervals]
      additionalProperties: false
      properties:
        weekday:
          type: integer
          enum: [1, 2, 3, 4, 5, 6, 7]
          description: 'ISO 8601: 1 = lunes … 7 = domingo. NO es `Date.getDay()` (0 = domingo).'
        intervals:
          type: array
          maxItems: 6
          description: Ordenados por `opensAt` en las respuestas. Vacío = sin atención ese día.
          items: { $ref: '#/components/schemas/BranchHoursInterval' }
    BranchHours:
      type: object
      description: Horario semanal administrativo con su versión de concurrencia optimista.
      required: [branchId, timezone, version, days]
      properties:
        branchId: { type: string, format: uuid }
        timezone: { type: string, example: America/Guatemala }
        version:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 (hex minúsculas) del horario canónico. Reenviar como `expectedVersion`.
        days:
          type: array
          minItems: 7
          maxItems: 7
          description: Siempre 7 días, `weekday` 1..7 ascendente.
          items: { $ref: '#/components/schemas/BranchHoursDay' }
    PublicClosureWindow:
      type: object
      description: Ventana de cierre sin motivo (el motivo nunca es público).
      required: [startsAt, endsAt]
      properties:
        startsAt: { type: string, format: date-time, description: 'Instante UTC (`...Z`).' }
        endsAt: { type: string, format: date-time, description: 'Instante UTC (`...Z`).' }
    PublicBranchHours:
      type: object
      required: [branchId, timezone, days, upcomingClosures]
      properties:
        branchId: { type: string, format: uuid }
        timezone: { type: string, example: America/Guatemala }
        days:
          type: array
          minItems: 7
          maxItems: 7
          items: { $ref: '#/components/schemas/BranchHoursDay' }
        upcomingClosures:
          type: array
          maxItems: 10
          description: Cierres en curso o que empiezan en los próximos 30 días, por `startsAt`. Sin motivo.
          items: { $ref: '#/components/schemas/PublicClosureWindow' }
    ReplaceBranchHoursRequest:
      type: object
      required: [expectedVersion, days]
      additionalProperties: false
      properties:
        expectedVersion:
          type: string
          pattern: '^[0-9a-f]{64}$'
        days:
          type: array
          minItems: 7
          maxItems: 7
          description: Exactamente los 7 `weekday` 1..7, cada uno una vez, en cualquier orden.
          items: { $ref: '#/components/schemas/BranchHoursDay' }
    BranchClosure:
      type: object
      required: [id, branchId, startsAt, endsAt, reason, status]
      properties:
        id: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        startsAt: { type: string, format: date-time, description: 'Instante UTC (`...Z`).' }
        endsAt:
          { type: string, format: date-time, description: 'Instante UTC (`...Z`), exclusivo.' }
        reason: { type: string, nullable: true, maxLength: 200 }
        status:
          type: string
          enum: [upcoming, active, past]
          description: Calculado con el reloj del servidor al responder.
    CreateBranchClosureRequest:
      type: object
      required: [startsAt, endsAt]
      additionalProperties: false
      properties:
        startsAt:
          type: string
          format: date-time
          description: ISO 8601 CON zona (`Z` u offset como `-06:00`). Sin zona => 400. Se normaliza a UTC, truncado al segundo.
        endsAt:
          type: string
          format: date-time
          description: Igual que `startsAt`; debe ser posterior.
        reason: { type: string, nullable: true, maxLength: 200 }
    UpdateBranchClosureRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        reason: { type: string, nullable: true, maxLength: 200 }
    BranchClosureList:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/BranchClosure' }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    BranchAvailabilityReason:
      type: string
      enum: [OPEN, INACTIVE, OUTSIDE_BUSINESS_HOURS, EXCEPTIONAL_CLOSURE, SCHEDULE_NOT_CONFIGURED]
      description: |
        Motivo único por orden de evaluación. `INACTIVE` solo lo produce el puerto interno (HTTP público => 404).
        No existen `ORDER_CUTOFF_REACHED` ni `OPERATIONS_PAUSED` (bloqueados: falta política/modelo de negocio).
    BranchAvailability:
      type: object
      required:
        - branchId
        - timezone
        - serverTime
        - isOpenNow
        - isAcceptingOrders
        - reason
        - nextOpensAt
        - nextClosesAt
        - nextTransitionAt
      properties:
        branchId: { type: string, format: uuid }
        timezone: { type: string, example: America/Guatemala }
        serverTime:
          {
            type: string,
            format: date-time,
            description: 'Instante UTC (`...Z`) de la evaluación.',
          }
        isOpenNow: { type: boolean }
        isAcceptingOrders:
          type: boolean
          description: Hoy igual a `isOpenNow`. Siempre implica `isOpenNow`.
        reason: { $ref: '#/components/schemas/BranchAvailabilityReason' }
        nextOpensAt:
          type: string
          format: date-time
          nullable: true
          description: Próxima apertura real (si está cerrada); `null` si abierta o sin apertura en 14 días.
        nextClosesAt:
          type: string
          format: date-time
          nullable: true
          description: Próximo cierre real (si está abierta); `null` si cerrada o sin cierre en 14 días.
        nextTransitionAt:
          type: string
          format: date-time
          nullable: true
          description: El menor no nulo de `nextOpensAt`/`nextClosesAt`. Horizonte máximo 14 días.
