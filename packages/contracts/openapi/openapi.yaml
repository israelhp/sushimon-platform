          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '`MEDIA_IN_USE`: algún producto lo referencia'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: '`MEDIA_STORAGE_UNAVAILABLE` o `MEDIA_BUSY` (reintentable)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
