        F14. Exige `catalog.read` y `aal2`. Devuelve el asset y la lista `usages` (producto y fila de `product_media`). 404 `MEDIA_NOT_FOUND` si no existe. No consulta R2. Respuesta `no-store`.
      tags: [media]
