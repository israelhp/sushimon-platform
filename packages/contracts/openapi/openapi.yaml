        orders: { type: integer }
        cancelled: { type: integer }
        sales: { type: number }
        averageTicket: { type: number }
        deliveryOrders: { type: integer }
    Department:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Guatemala }
    DepartmentListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Department' }
    Municipality:
      type: object
      required: [id, departmentId, name]
      properties:
        id: { type: string, format: uuid }
        departmentId: { type: string, format: uuid }
        name: { type: string, example: Mixco }
    MunicipalityListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Municipality' }
    CurrencyGtq:
      type: string
      enum: [GTQ]
    MoneyGtq:
      type: string
      description: |
        Monto GTQ como string decimal EXACTO con 2 decimales (nunca número flotante). Rango 0.00..99999.99
        (tope técnico anti-error de captura; CHECK en BD).
      pattern: '^(0|[1-9][0-9]{0,4})\.[0-9]{2}$'
      example: '15.00'
    MoneyGtqInput:
      type: string
      description: 'Monto GTQ de entrada, string decimal con 0 a 2 decimales ("15", "15.5", "15.00"). No se acepta número JSON, signo ni notación científica.'
      pattern: '^(0|[1-9][0-9]{0,4})(\.[0-9]{1,2})?$'
      example: '15.00'
    AdminDeliveryZone:
      type: object
      required:
        [
          id,
          branchId,
          municipalityId,
          municipalityName,
          departmentId,
          departmentName,
          zoneLabel,
          baseFee,
          currency,
          active,
          version,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        municipalityId: { type: string, format: uuid }
        municipalityName: { type: string }
        departmentId: { type: string, format: uuid }
        departmentName: { type: string }
        zoneLabel:
          type: string
          nullable: true
          description: Etiqueta legible normalizada (NFC, recortada, espacios colapsados). `null` = cobertura GENERAL del municipio.
        baseFee: { $ref: '#/components/schemas/MoneyGtq' }
        currency: { $ref: '#/components/schemas/CurrencyGtq' }
        active: { type: boolean }
        version:
          type: integer
          minimum: 1
          description: Contador de concurrencia optimista; se reenvía como `expectedVersion` en PATCH.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminDeliveryZonePage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminDeliveryZone' }
        page: { type: integer }
        pageSize: { type: integer }
        total:
          { type: integer, description: 'Total de zonas que cumplen los filtros y el alcance.' }
    CreateDeliveryZoneRequest:
      type: object
      required: [branchId, municipalityId, baseFee]
      additionalProperties: false
      properties:
        branchId: { type: string, format: uuid }
        municipalityId: { type: string, format: uuid }
        zoneLabel:
          type: string
          nullable: true
          maxLength: 60
          description: 'Opcional. Máx. 60 caracteres tras normalizar; sin caracteres de control. `null`, ausente o en blanco = cobertura general del municipio.'
        baseFee: { $ref: '#/components/schemas/MoneyGtqInput' }
        active:
          type: boolean
          default: true
    UpdateDeliveryZoneRequest:
      type: object
      required: [expectedVersion]
      additionalProperties: false
      description: Además de `expectedVersion` debe venir al menos `zoneLabel` o `baseFee` (si no, 400).
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        zoneLabel:
          type: string
          nullable: true
          maxLength: 60
        baseFee: { $ref: '#/components/schemas/MoneyGtqInput' }
    UpdateDeliveryZoneStatusRequest:
      type: object
      required: [active]
      additionalProperties: false
      properties:
        active: { type: boolean }
        reason:
          type: string
          maxLength: 200
          description: Texto libre de operador; se guarda en auditoría. NO debe contener datos personales.
    CourierProvider:
      type: string
      enum: [PEDIDOSYA, OWN]
    ProviderIntegrationStatus:
      type: string
      description: |
        Estado de la integración del proveedor en este servidor. `BLOCKED_EXTERNAL`: sin documentación/credenciales
        (valor por defecto y el único posible en producción hoy). `MOCK`: adaptador simulado (solo desarrollo/pruebas).
        `LIVE`: reservado para F29; F09 nunca lo produce. Los clientes deben tolerar valores futuros.
      enum: [BLOCKED_EXTERNAL, MOCK, LIVE]
    CoverageReason:
      type: string
      description: Motivo estable de un estado no determinante. Los clientes deben tolerar valores futuros.
      enum:
        - PROVIDER_DISABLED
        - INTEGRATION_NOT_CONFIGURED
        - PROVIDER_TIMEOUT
        - PROVIDER_ERROR
        - INVALID_REQUEST
        - PROVIDER_UNDETERMINED
        - NO_ZONE_COVERAGE
    BranchDeliverySettings:
      type: object
      required:
        [
          branchId,
          ownDeliveryZonesEnabled,
          pedidosyaEnabled,
          pedidosyaIntegrationStatus,
          isDefault,
          updatedAt,
        ]
      properties:
        branchId: { type: string, format: uuid }
        ownDeliveryZonesEnabled:
          type: boolean
          description: Entrega con repartidores propios y zonas del restaurante. Por defecto false.
        pedidosyaEnabled:
          type: boolean
          description: Indicador ADMINISTRATIVO. No equivale a integración operativa ni habilita llamadas reales. Por defecto true.
        pedidosyaIntegrationStatus: { $ref: '#/components/schemas/ProviderIntegrationStatus' }
        isDefault:
          type: boolean
          description: true si la sucursal aún no tiene fila (valores por defecto).
        updatedAt: { type: string, format: date-time, nullable: true }
    UpdateBranchDeliverySettingsRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        ownDeliveryZonesEnabled: { type: boolean }
        pedidosyaEnabled: { type: boolean }
    DeliveryCoverageCheckRequest:
      type: object
      required: [branchId, municipalityId]
      additionalProperties: false
      properties:
        branchId: { type: string, format: uuid }
        municipalityId: { type: string, format: uuid }
        zone:
          type: string
          nullable: true
          maxLength: 60
          description: Zona opcional (texto libre; se normaliza igual que `zoneLabel`). Sin zona solo puede aplicar la cobertura general del municipio.
    PedidosYaCoverage:
      type: object
      required: [enabled, coverageStatus, integrationStatus, quoteStatus]
      properties:
        enabled: { type: boolean }
        coverageStatus:
          type: string
          enum: [AVAILABLE, UNAVAILABLE, UNKNOWN]
          description: Solo significativo si `enabled=true`. UNKNOWN = no verificable (no es UNAVAILABLE).
        integrationStatus: { $ref: '#/components/schemas/ProviderIntegrationStatus' }
        quoteStatus:
          type: string
          enum: [NOT_AVAILABLE]
          description: F09 no cotiza (la cobertura y la cotización son conceptos separados). Puede ampliarse en F29.
        reason: { $ref: '#/components/schemas/CoverageReason' }
    OwnCoverage:
      type: object
      required: [enabled, coverageStatus, deliveryZoneId, baseFee, currency, matchedBy]
      properties:
        enabled: { type: boolean }
        coverageStatus:
          type: string
          enum: [AVAILABLE, UNAVAILABLE]
          description: Solo significativo si `enabled=true` (deshabilitado => UNAVAILABLE sin evaluar zonas).
        deliveryZoneId: { type: string, format: uuid, nullable: true }
        baseFee:
          allOf:
            - $ref: '#/components/schemas/MoneyGtq'
          nullable: true
        currency: { $ref: '#/components/schemas/CurrencyGtq' }
        matchedBy:
          type: string
          nullable: true
          enum: [ZONE, MUNICIPALITY]
          description: ZONE = zona específica; MUNICIPALITY = cobertura general; null = sin cobertura.
        reason: { $ref: '#/components/schemas/CoverageReason' }
    DeliveryEligibility:
      type: object
      description: |
        Resumen derivado en servidor. `confirmedProviders`: proveedores habilitados con cobertura AVAILABLE.
        `pendingProviders`: habilitados con UNKNOWN (no confirmado). `status`: CONFIRMED si hay algún confirmado; PENDING
        si no hay confirmados pero sí pendientes; NONE si no hay ninguno. `simulated=true` si algún dato proviene del
        mock: nunca autoriza operaciones reales.
      required: [status, confirmedProviders, pendingProviders, simulated]
      properties:
        status:
          type: string
          enum: [CONFIRMED, PENDING, NONE]
        confirmedProviders:
          type: array
          items: { $ref: '#/components/schemas/CourierProvider' }
        pendingProviders:
          type: array
          items: { $ref: '#/components/schemas/CourierProvider' }
        simulated: { type: boolean }
    DeliveryCoverageCheckResponse:
      type: object
      required: [branchId, municipalityId, zone, checkedAt, providers, eligibility]
      properties:
        branchId: { type: string, format: uuid }
        municipalityId: { type: string, format: uuid }
        zone:
          type: string
          nullable: true
          description: Zona normalizada (o null).
        checkedAt:
          type: string
          format: date-time
          description: Reloj del servidor, ISO 8601 UTC con milisegundos.
        providers:
          type: object
          required: [PEDIDOSYA, OWN]
          properties:
            PEDIDOSYA: { $ref: '#/components/schemas/PedidosYaCoverage' }
            OWN: { $ref: '#/components/schemas/OwnCoverage' }
        eligibility: { $ref: '#/components/schemas/DeliveryEligibility' }
    PublicCategory:
      type: object
      description: Categoría visible del menú (F10). Sin campos internos; `children` ya viene ordenado y solo con hijas visibles.
      required: [id, slug, name, description, children]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, maxLength: 80, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, nullable: true, maxLength: 500 }
        children:
          type: array
          description: 'Hijas visibles (vacío en hojas). Profundidad máxima del árbol: 3 niveles.'
          items: { $ref: '#/components/schemas/PublicCategory' }
    PublicCategoryTree:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Categorías raíz visibles, ordenadas por `sortOrder`, `name`, `id`.
          items: { $ref: '#/components/schemas/PublicCategory' }
    AdminCategory:
      type: object
      required:
        [
          id,
          parentId,
          slug,
          name,
          description,
          sortOrder,
          active,
          effectivelyVisible,
          depth,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        parentId: { type: string, format: uuid, nullable: true, description: '`null` = raíz.' }
        slug: { type: string, maxLength: 80, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, nullable: true, maxLength: 500 }
        sortOrder: { type: integer, minimum: 0, description: 'Posición entre hermanos (base 0).' }
        active: { type: boolean, description: Estado propio (administrativo). }
        effectivelyVisible:
          type: boolean
          description: '`true` solo si la categoría y TODOS sus ancestros están activos (lo que ve el público).'
        depth:
          { type: integer, minimum: 1, maximum: 3, description: 'Nivel en el árbol (raíz = 1).' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminCategoryList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/AdminCategory' }
        total:
          { type: integer, minimum: 0, description: 'Número de elementos devueltos (tope 500).' }
    CreateCategoryRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        slug:
          type: string
          maxLength: 80
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: Opcional. Si falta se genera desde `name` y se desambigua; si se envía y existe => 409 `CATEGORY_SLUG_TAKEN`.
        description: { type: string, nullable: true, maxLength: 500 }
        parentId:
          { type: string, format: uuid, nullable: true, description: '`null` o ausente = raíz.' }
        active: { type: boolean, description: 'Opcional; por defecto `true` en el servidor.' }
    UpdateCategoryRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        slug: { type: string, maxLength: 80, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
        description: { type: string, nullable: true, maxLength: 500 }
        parentId:
          { type: string, format: uuid, nullable: true, description: '`null` = mover a la raíz.' }
        active: { type: boolean }
    ReorderCategoriesRequest:
      type: object
      required: [parentId, orderedIds]
      additionalProperties: false
      properties:
        parentId:
          { type: string, format: uuid, nullable: true, description: '`null` = categorías raíz.' }
        orderedIds:
          type: array
          maxItems: 500
          description: Todos los hermanos actuales del padre, en el orden deseado, sin duplicados.
          items: { type: string, format: uuid }
    ProductPrice:
      type: string
      pattern: '^[0-9]{1,6}\.[0-9]{2}$'
      example: '85.00'
      description: Importe decimal en GTQ como CADENA con 2 decimales (nunca `number`; evita errores de coma flotante). > 0 y <= 999999.99.
    PublicProductCategoryRef:
      type: object
      required: [id, slug, name]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, maxLength: 80, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
        name: { type: string, minLength: 1, maxLength: 80 }
    PublicProductMedia:
      type: object
      required: [url, altText]
      properties:
        url:
          {
            type: string,
            format: uri,
            maxLength: 2048,
            description: 'URL https estable (R2 detrás del dominio configurado en F14, o una URL externa previa).',
          }
        altText: { type: string, nullable: true, maxLength: 200 }
    PublicProduct:
      type: object
      description: Producto visible del menú (F11). Sin SKU ni campos internos. `media` ordenada (vacía = la web muestra un placeholder).
      required: [id, slug, name, description, basePrice, category, media]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, maxLength: 80, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, nullable: true, maxLength: 2000, description: Texto plano. }
        basePrice: { $ref: '#/components/schemas/ProductPrice' }
        category: { $ref: '#/components/schemas/PublicProductCategoryRef' }
        media:
          type: array
          maxItems: 8
          items: { $ref: '#/components/schemas/PublicProductMedia' }
    StoreProductOffer:
      type: object
      description: 'Precio EFECTIVO y disponibilidad de UNA sucursal para la ficha (F13). Informativo.'
      required: [branchId, price, available]
      properties:
        branchId: { type: string, format: uuid }
        price: { $ref: '#/components/schemas/ProductPrice' }
        available: { type: boolean }
    PublicProductDetail:
      description: 'Ficha pública, igual que `PublicProduct` más los ancestros visibles de la categoría para el breadcrumb y los grupos de modificadores ofrecibles (F12).'
      allOf:
        - $ref: '#/components/schemas/PublicProduct'
        - type: object
          required: [categoryAncestors, modifierGroups]
          properties:
            offer:
              allOf:
                - $ref: '#/components/schemas/StoreProductOffer'
              description: 'F17. Solo con `branchId`: precio EFECTIVO y disponibilidad de esa sucursal (F13). Se omite sin `branchId`.'
            promotions:
              type: array
              maxItems: 3
              description: 'F17. Solo con `branchId`: promociones públicas indicativas vigentes que aplican al producto (F15; nunca cupones ni códigos), la de mayor ahorro primero. Se omite sin `branchId`.'
              items: { $ref: '#/components/schemas/StoreProductPromo' }
            generatedAt:
              type: string
              format: date-time
              description: 'F17. Solo con `branchId`: hora del servidor al generar la respuesta.'
            nextChangeAt:
              type: string
              format: date-time
              nullable: true
              description: 'F17. Solo con `branchId`: próximo cambio por tiempo de las promociones (14 días); `null` si no hay. Acota `s-maxage`.'
            modifierGroups:
              type: array
              maxItems: 10
              description: |
                F12. Solo grupos ACTIVOS asociados al producto que se pueden ofrecer (con al menos `max(minSelect, 1)` opciones activas), en el orden
                de asociación, con SOLO sus opciones activas (orden de `sortOrder`). Vacío si no hay. Los precios extra son INFORMATIVOS: el servidor
                recalcula y valida la selección al cotizar (F19) y nunca confía en el cliente. No existe en la lista pública (`PublicProduct`).
              items: { $ref: '#/components/schemas/PublicModifierGroup' }
            categoryAncestors:
              type: array
              maxItems: 2
              description: Ancestros de `category`, de la raíz al padre (vacío si es raíz).
              items: { $ref: '#/components/schemas/PublicProductCategoryRef' }
    PublicProductPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PublicProduct' }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          {
            type: integer,
            minimum: 0,
            description: Total de productos que cumplen el filtro (todas las páginas).,
          }
    AdminProductCategory:
      type: object
      required: [id, slug, name, active, effectivelyVisible]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, maxLength: 80 }
        name: { type: string, maxLength: 80 }
        active: { type: boolean }
        effectivelyVisible:
          { type: boolean, description: 'Categoría y todos sus ancestros activos (F10).' }
    AdminProductMedia:
      type: object
      required: [id, url, altText, sortOrder]
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri, maxLength: 2048 }
        altText: { type: string, nullable: true, maxLength: 200 }
        sortOrder: { type: integer, minimum: 0, maximum: 7 }
        assetId:
          type: string
          format: uuid
          nullable: true
          description: 'F14. Asset de `media_assets` del que proviene la imagen; `null` = URL externa previa a F14 (o referenciada con el PATCH `media` de F11 sin asset).'
    AdminProduct:
      type: object
      required:
        [
          id,
          sku,
          slug,
          name,
          description,
          basePrice,
          categoryId,
          category,
          active,
          publiclyVisible,
          media,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        sku: { type: string, nullable: true, maxLength: 40, pattern: '^[A-Z0-9][A-Z0-9._-]*$' }
        slug: { type: string, maxLength: 80, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, nullable: true, maxLength: 2000 }
        basePrice: { $ref: '#/components/schemas/ProductPrice' }
        categoryId: { type: string, format: uuid }
        category: { $ref: '#/components/schemas/AdminProductCategory' }
        active: { type: boolean, description: Estado propio (administrativo). }
        publiclyVisible:
          {
            type: boolean,
            description: '`active` Y categoría efectivamente visible: lo que ve el público.',
          }
        media:
          type: array
          maxItems: 8
          items: { $ref: '#/components/schemas/AdminProductMedia' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminProductPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminProduct' }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
    ProductMediaInput:
      type: object
      required: [url]
      additionalProperties: false
      properties:
        url:
          type: string
          description: 'URL `https` absoluta, <= 2048 caracteres. Otro esquema (http, data, javascript…), longitud, IP literal, `localhost`, host sin punto o host fuera de la lista `PRODUCT_MEDIA_ALLOWED_HOSTS` (si está definida) => 422 `PRODUCT_MEDIA_INVALID` (no 400).'
        altText:
          {
            type: string,
            nullable: true,
            description: '<= 200 caracteres; si no => 422 `PRODUCT_MEDIA_INVALID` (no 400).',
          }
    CreateProductRequest:
      type: object
      required: [name, basePrice, categoryId]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        slug:
          type: string
          maxLength: 80
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: Opcional. Si falta se genera desde `name` y se desambigua; si se envía y existe => 409 `PRODUCT_SLUG_TAKEN`.
        sku:
          {
            type: string,
            nullable: true,
            minLength: 1,
            maxLength: 40,
            pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$',
            description: 'Opcional, único; se guarda en mayúsculas. Repetido => 409 `PRODUCT_SKU_TAKEN`.',
          }
        description: { type: string, nullable: true, maxLength: 2000 }
        basePrice: { $ref: '#/components/schemas/ProductPrice' }
        categoryId:
          {
            type: string,
            format: uuid,
            description: 'Categoría existente y activa; si no => 422 `PRODUCT_CATEGORY_INVALID`.',
          }
        active: { type: boolean, description: 'Opcional; por defecto `true` en el servidor.' }
        media:
          type: array
          description: 'Opcional, máx. 8 (más => 422 `PRODUCT_MEDIA_INVALID`). El orden define `sortOrder`.'
          items: { $ref: '#/components/schemas/ProductMediaInput' }
    UpdateProductRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        slug: { type: string, maxLength: 80, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
        sku:
          {
            type: string,
            nullable: true,
            minLength: 1,
            maxLength: 40,
            pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$',
            description: '`null` borra el SKU.',
          }
        description: { type: string, nullable: true, maxLength: 2000 }
        basePrice: { $ref: '#/components/schemas/ProductPrice' }
        categoryId:
          {
            type: string,
            format: uuid,
            description: 'Si cambia, la nueva debe existir y estar activa => 422 `PRODUCT_CATEGORY_INVALID`.',
          }
        active: { type: boolean }
        media:
          type: array
          description: 'REEMPLAZA la lista completa (`[]` la vacía); omitir = no tocar. Máx. 8 (más => 422 `PRODUCT_MEDIA_INVALID`).'
          items: { $ref: '#/components/schemas/ProductMediaInput' }
    ModifierExtraPrice:
      type: string
      pattern: '^[0-9]{1,4}\.[0-9]{2}$'
      example: '5.00'
      description: Importe extra decimal en GTQ como CADENA con 2 decimales (nunca `number`). `0.00` permitido; <= 9999.99.
    PublicModifierOption:
      type: object
      required: [id, name, extraPrice]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 80 }
        extraPrice: { $ref: '#/components/schemas/ModifierExtraPrice' }
    PublicModifierGroup:
      type: object
      description: Grupo ofrecible de una ficha (F12). Cada opción se elige 0 o 1 vez; se debe elegir entre `minSelect` y `maxSelect` opciones del grupo.
      required: [id, name, minSelect, maxSelect, required, options]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 80 }
        minSelect: { type: integer, minimum: 0, maximum: 20 }
        maxSelect: { type: integer, minimum: 1, maximum: 20 }
        required: { type: boolean, description: 'Derivado: `minSelect >= 1`.' }
        options:
          type: array
          minItems: 1
          maxItems: 30
          items: { $ref: '#/components/schemas/PublicModifierOption' }
    CartQuoteSelectionInput:
      type: object
      description: |
        F18 (spec 019, ADR-0024). Una opción de modificador elegida en una línea del carrito. SOLO ids: nunca nombres ni precios (el servidor los resuelve y recalcula).
        `quantity` es la cantidad de ESA opción por unidad de la línea; en la v1 de F12 cada opción se elige 0 o 1 vez, por eso `maximum: 1` (el campo existe para no
        romper el contrato si negocio admite «doble porción»; subirlo exigirá F12 + F19).
      required: [groupId, optionId, quantity]
      additionalProperties: false
      properties:
        groupId: { type: string, format: uuid }
        optionId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 1 }
    CartQuoteLineInput:
      type: object
      description: |
        F18 (spec 019). Línea de carrito en el formato de entrada de la cotización de checkout (F19). SIN precios, nombres, imágenes ni notas: la API recalcula todo.
        Una configuración idéntica (producto + selecciones) aparece UNA sola vez con la cantidad sumada. `selections` ordenadas por `groupId` y luego `optionId`.
      required: [productId, quantity, selections]
      additionalProperties: false
      properties:
        productId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 99 }
        selections:
          type: array
          maxItems: 30
          items: { $ref: '#/components/schemas/CartQuoteSelectionInput' }
    CartQuoteInput:
      type: object
      description: |
        F18 (spec 019, ADR-0024). Entrada reutilizable que `POST /v1/checkout/quote` (F19, `CheckoutQuoteRequest.cart`) compone sin cambios. Una sola sucursal por carrito.
        Lo produce la función pura `toQuoteInput(cart)` de la web; las líneas van en orden determinista (`productId`, luego clave canónica de selecciones). F19 amplía el
        cuerpo (modalidad, dirección, cupón) en `CheckoutQuoteRequest`, que lo COMPONE sin cambiar sus campos.
      required: [branchId, lines]
      additionalProperties: false
      properties:
        branchId: { type: string, format: uuid }
        lines:
          type: array
          minItems: 1
          maxItems: 30
          items: { $ref: '#/components/schemas/CartQuoteLineInput' }
    CheckoutMoney:
      type: string
      pattern: '^[0-9]{1,9}\.[0-9]{2}$'
      example: '85.00'
      description: Importe en GTQ como CADENA decimal de 2 posiciones (nunca `number`). Calculado con centavos enteros.
    CheckoutLineStatus:
      type: string
      description: |
        Estado de una línea cotizada, alineado con los estados de F18 (`cart-rules.ts`). `OK` y `PRICE_CHANGED` son comprables;
        el resto bloquea. `NOT_FOUND`: el producto no existe; `INACTIVE`: existe pero no es ordenable (inactivo o categoría
        oculta); `UNAVAILABLE`: agotado en la sucursal; `MODIFIER_INVALID`: selección de extras inválida (grupo, mínimo,
        máximo, obligatorio); `OPTION_UNAVAILABLE`: una opción elegida ya no existe o está inactiva. `BRANCH_MISMATCH` es
        solo del cliente. Precedencia: NOT_FOUND > INACTIVE > UNAVAILABLE > OPTION_UNAVAILABLE > MODIFIER_INVALID > PRICE_CHANGED > OK.
        Los clientes deben tolerar valores futuros.
      enum:
        [OK, PRICE_CHANGED, UNAVAILABLE, INACTIVE, NOT_FOUND, MODIFIER_INVALID, OPTION_UNAVAILABLE]
    CheckoutFulfillmentInput:
      type: object
      description: |
        Modalidad. `PICKUP`: no admite ningún otro campo. `DELIVERY`: exactamente UNO de `customerAddressId` (dirección
        guardada, exige sesión de cliente y propiedad) o `municipalityId` (+ `zone` opcional; invitado o dirección nueva).
        En el municipio de la ciudad de Guatemala la zona es obligatoria con formato «Zona N» (decisión C2 de F05); si falta
        => blocker `ADDRESS_INCOMPLETE`. No hay texto libre de dirección: la cotización solo necesita municipio y zona.
        `deliveryProvider` es una preferencia explícita (no se sustituye en silencio). Combinaciones incoherentes => 400.
      required: [type]
      additionalProperties: false
      properties:
        type: { type: string, enum: [PICKUP, DELIVERY] }
        customerAddressId: { type: string, format: uuid }
        municipalityId: { type: string, format: uuid }
        zone: { type: string, nullable: true, maxLength: 60 }
        deliveryProvider: { $ref: '#/components/schemas/CourierProvider' }
    CheckoutClientLineView:
      type: object
      description: Precio unitario de producto (sin extras ni descuento) que el cliente VIO para la línea `index` de `cart.lines`. Pista no autoritativa.
      required: [index, unitPrice]
      additionalProperties: false
      properties:
        index: { type: integer, minimum: 0, maximum: 29 }
        unitPrice: { $ref: '#/components/schemas/CheckoutMoney' }
    CheckoutClientView:
      type: object
      description: |
        Lo que el cliente ya vio. SOLO sirve para avisar (`PRICE_CHANGED`, `TOTAL_CHANGED`); el servidor no lo usa para calcular,
        validar ni cobrar. No es un importe de entrada.
      additionalProperties: false
      properties:
        lines:
          type: array
          maxItems: 30
          items: { $ref: '#/components/schemas/CheckoutClientLineView' }
        total: { $ref: '#/components/schemas/CheckoutMoney' }
    CheckoutQuoteRequest:
      type: object
      description: |
        Cuerpo de `POST /v1/checkout/quote`. COMPONE `CartQuoteInput` (F18) sin cambiar sus campos: `toQuoteInput(cart)` va
        tal cual en `cart`. Topes adicionales: ≤ 200 unidades y ≤ 300 selecciones en total (si no, 400 `QUOTE_LIMITS_EXCEEDED`);
        cuerpo ≤ 64 KB.
      required: [cart, fulfillment]
      additionalProperties: false
      properties:
        cart: { $ref: '#/components/schemas/CartQuoteInput' }
        fulfillment: { $ref: '#/components/schemas/CheckoutFulfillmentInput' }
        couponCode:
          type: string
          maxLength: 64
          description: 'Cupón opcional (sin patrón, para que un formato inválido no se distinga de uno inexistente). Se normaliza en el servidor. Nunca se registra en logs.'
        clientView: { $ref: '#/components/schemas/CheckoutClientView' }
    CheckoutQuoteMeta:
      type: object
      required: [generatedAt, expiresAt, token]
      properties:
        generatedAt: { type: string, format: date-time }
        expiresAt:
          {
            type: string,
            format: date-time,
            description: 'Vigencia fija (10 min). No reserva inventario ni precio.',
          }
        token:
          type: string
          nullable: true
          maxLength: 1024
          description: |
            Firma sin estado (HMAC-SHA256, secreto de servidor) de {sucursal, modalidad, proveedor, totales, huella de la entrada,
            sujeto, vigencia}. Opaco para el cliente. `null` si el servidor no tiene secreto configurado (F20 debe rechazarlo).
            Solo `canProceed=true` emite token.
    CheckoutBranchState:
      type: object
      description: Horario de la sucursal (F08, America/Guatemala). Es DISTINTO de la disponibilidad logística del proveedor de entrega.
      required: [id, isAcceptingOrders, reason, nextOpensAt]
      properties:
        id: { type: string, format: uuid }
        isAcceptingOrders: { type: boolean }
        reason: { $ref: '#/components/schemas/BranchAvailabilityReason' }
        nextOpensAt: { type: string, format: date-time, nullable: true }
    CheckoutModifierLine:
      type: object
      required: [groupId, optionId, extraPrice]
      properties:
        groupId: { type: string, format: uuid }
        optionId: { type: string, format: uuid }
        extraPrice: { $ref: '#/components/schemas/CheckoutMoney' }
    CheckoutQuoteLine:
      type: object
      description: |
        Una línea por cada elemento de `cart.lines`, en el mismo orden (`index`). En una línea no comprable los importes son `null`.
        `lineSubtotal = (unitPrice + extrasPerUnit) × quantity`; `lineTotal = lineSubtotal − discount`.
      required:
        [
          index,
          productId,
          quantity,
          status,
          unitPrice,
          modifiers,
          extrasPerUnit,
          lineSubtotal,
          discount,
          promotionId,
          lineTotal,
          previousUnitPrice,
        ]
      properties:
        index: { type: integer, minimum: 0 }
        productId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 99 }
        status: { $ref: '#/components/schemas/CheckoutLineStatus' }
        unitPrice:
          allOf: [{ $ref: '#/components/schemas/CheckoutMoney' }]
          nullable: true
          description: Precio EFECTIVO de la sucursal (F13), nunca `basePrice`.
        modifiers:
          type: array
          maxItems: 30
          items: { $ref: '#/components/schemas/CheckoutModifierLine' }
        extrasPerUnit:
          allOf: [{ $ref: '#/components/schemas/CheckoutMoney' }]
          nullable: true
        lineSubtotal:
          allOf: [{ $ref: '#/components/schemas/CheckoutMoney' }]
          nullable: true
        discount:
          allOf: [{ $ref: '#/components/schemas/CheckoutMoney' }]
          nullable: true
        promotionId: { type: string, format: uuid, nullable: true }
        lineTotal:
          allOf: [{ $ref: '#/components/schemas/CheckoutMoney' }]
          nullable: true
        previousUnitPrice:
          allOf: [{ $ref: '#/components/schemas/CheckoutMoney' }]
          nullable: true
          description: Eco de `clientView` solo si el precio cambió (`status=PRICE_CHANGED`); informativo.
    CheckoutDeliveryOption:
      type: object
      description: |
        Evaluación independiente de un proveedor para la dirección dada. `customerFee` es lo que se cobraría AL CLIENTE; el
        costo interno del proveedor jamás se expone. `selectable=false` => `unavailableReason` presente.
      required: [provider, enabled, coverageStatus, simulated, customerFee, selectable]
      properties:
        provider: { $ref: '#/components/schemas/CourierProvider' }
        enabled: { type: boolean }
        coverageStatus: { type: string, enum: [AVAILABLE, UNAVAILABLE, UNKNOWN] }
        integrationStatus:
          allOf: [{ $ref: '#/components/schemas/ProviderIntegrationStatus' }]
          description: Solo PEDIDOSYA.
        simulated:
          {
            type: boolean,
            description: 'true si el resultado viene de un adaptador simulado (solo desarrollo/pruebas).',
          }
        customerFee:
          allOf: [{ $ref: '#/components/schemas/CheckoutMoney' }]
          nullable: true
        selectable: { type: boolean }
        unavailableReason:
          type: string
          description: |
            `PROVIDER_DISABLED`, `NO_ZONE_COVERAGE`, `COVERAGE_UNKNOWN`, `SIMULATED`, `CUSTOMER_FEE_UNDEFINED` o un `CoverageReason`
            de F09. Los clientes deben tolerar valores futuros.
    CheckoutDelivery:
      type: object
      required: [selectedProvider, options]
      properties:
        selectedProvider:
          allOf: [{ $ref: '#/components/schemas/CourierProvider' }]
          nullable: true
        options:
          type: array
          maxItems: 2
          items: { $ref: '#/components/schemas/CheckoutDeliveryOption' }
    CheckoutBlocker:
      type: object
      description: |
        Motivo que impide continuar. `code` estable (los clientes ramifican por él): por línea (`scope=LINE`, `lineIndex`):
        `UNAVAILABLE`, `INACTIVE`, `NOT_FOUND`, `MODIFIER_INVALID`, `OPTION_UNAVAILABLE`; sucursal (`BRANCH`): `BRANCH_CLOSED`;
        modalidad (`FULFILLMENT`): `ADDRESS_INCOMPLETE`, `DELIVERY_UNAVAILABLE` (ningún proveedor cubre), `DELIVERY_UNVERIFIED`
        (no se pudo verificar cobertura), `DELIVERY_PROVIDER_NOT_SELECTABLE` (el proveedor pedido no es seleccionable).
        Valores futuros posibles.
      required: [code, scope]
      properties:
        code: { type: string }
        scope: { type: string, enum: [LINE, BRANCH, FULFILLMENT] }
        lineIndex: { type: integer, minimum: 0 }
    CheckoutNotice:
      type: object
      description: 'Aviso que NO bloquea: `PRICE_CHANGED` (línea), `TOTAL_CHANGED`, `PROMOTIONS_TRUNCATED` (había más de 200 promociones candidatas; no es «cupón inválido»).'
      required: [code]
      properties:
        code: { type: string }
        lineIndex: { type: integer, minimum: 0 }
    CheckoutCoupon:
      type: object
      description: 'Vista del cliente: solo `APPLIED` o `NOT_APPLIED`, sin motivo (un cupón inexistente, vencido, de otra sucursal o sin ahorro responden igual).'
      required: [status]
      properties:
        status: { type: string, enum: [APPLIED, NOT_APPLIED] }
    CheckoutQuote:
      type: object
      required:
        [
          quote,
          currency,
          branch,
          fulfillment,
          lines,
          subtotal,
          extrasTotal,
          discountTotal,
          deliveryFee,
          total,
          coupon,
          canProceed,
          blockers,
          notices,
        ]
      properties:
        quote: { $ref: '#/components/schemas/CheckoutQuoteMeta' }
        currency: { type: string, enum: [GTQ] }
        branch: { $ref: '#/components/schemas/CheckoutBranchState' }
        fulfillment:
          type: object
          required: [type, delivery]
          properties:
            type: { type: string, enum: [PICKUP, DELIVERY] }
            delivery:
              allOf: [{ $ref: '#/components/schemas/CheckoutDelivery' }]
              nullable: true
        lines:
          type: array
          maxItems: 30
          items: { $ref: '#/components/schemas/CheckoutQuoteLine' }
        subtotal: { $ref: '#/components/schemas/CheckoutMoney' }
        extrasTotal: { $ref: '#/components/schemas/CheckoutMoney' }
        discountTotal: { $ref: '#/components/schemas/CheckoutMoney' }
        deliveryFee:
          allOf: [{ $ref: '#/components/schemas/CheckoutMoney' }]
          nullable: true
          description: '`0.00` en PICKUP; `null` si a domicilio no hay tarifa verificable.'
        total:
          allOf: [{ $ref: '#/components/schemas/CheckoutMoney' }]
          nullable: true
        coupon:
          allOf: [{ $ref: '#/components/schemas/CheckoutCoupon' }]
          nullable: true
        canProceed: { type: boolean }
        blockers:
          type: array
          maxItems: 60
          items: { $ref: '#/components/schemas/CheckoutBlocker' }
        notices:
          type: array
          maxItems: 60
          items: { $ref: '#/components/schemas/CheckoutNotice' }
    OrderLifecycleStatus:
      type: string
      description: |
        Catálogo OFICIAL de estados del pedido (F20 define; F22 gobierna las transiciones). F20 solo escribe `pending`. F21 los presenta como `OrderPublicStatus`.
        `pending` recibido; `accepted` aceptado por la sucursal; `preparing` en cocina; `ready` listo; `on_the_way` en camino
        (solo DELIVERY); `delivered` entregado al cliente (DELIVERY); `picked_up` recogido (PICKUP); `rejected` rechazado por
        la sucursal; `cancelled` cancelado. Es INDEPENDIENTE del pago (F24) y de la entrega (F28/F29). Los clientes deben
        tolerar valores futuros. Reemplaza al `OrderStatus` borrador (`received` => `pending`).
      enum:
        [pending, accepted, preparing, ready, on_the_way, delivered, picked_up, rejected, cancelled]
    OrderPaymentPreference:
      type: string
      description: |
        SOLO una preferencia declarada por el cliente (no es un pago). F20 admite `cash` y `bank_transfer`; `card` (F25,
        `BLOCKED_EXTERNAL`) => 422 `PAYMENT_METHOD_UNAVAILABLE`.
      enum: [cash, bank_transfer]
    OrderContactInput:
      type: object
      description: |
        Datos de contacto. Invitado: `fullName` y `phone` obligatorios. Autenticado: opcional (se completa con el perfil; si
        falta el teléfono en ambos => 422 `CONTACT_INCOMPLETE`). Teléfono de Guatemala (8 dígitos, `+502` opcional); se
        normaliza a `+502XXXXXXXX`. Correo opcional con formato válido.
      required: []
      additionalProperties: false
      properties:
        fullName: { type: string, minLength: 2, maxLength: 120 }
        phone: { type: string, maxLength: 20, example: '+502 5555 1234' }
        email: { type: string, format: email, maxLength: 254 }
    OrderDeliveryAddressInput:
      type: object
      description: |
        Texto de la dirección de entrega. Obligatorio con `fulfillment.type=DELIVERY` y `municipalityId` (dirección nueva o
        invitado); PROHIBIDO con `customerAddressId` (se copia la dirección guardada) y con PICKUP (=> 400). No afecta al precio
        ni a la huella del token (la cobertura sigue siendo municipio + zona).
      required: [addressLine]
      additionalProperties: false
      properties:
        addressLine: { type: string, minLength: 5, maxLength: 200 }
        referenceNote: { type: string, maxLength: 200 }
    OrderCreateRequest:
      type: object
      description: |
        Cuerpo de `POST /v1/orders` (≤ 64 KB). `cart`, `fulfillment` y `couponCode` son EXACTAMENTE los de
        `CheckoutQuoteRequest` (se recotizan en el servidor). Sin `clientView`, sin importes.
      required: [cart, fulfillment, quoteToken]
      additionalProperties: false
      properties:
        cart: { $ref: '#/components/schemas/CartQuoteInput' }
        fulfillment: { $ref: '#/components/schemas/CheckoutFulfillmentInput' }
        couponCode: { type: string, maxLength: 64 }
        quoteToken:
          type: string
          minLength: 1
          maxLength: 1024
          description: '`quote.token` de la cotización que el cliente aceptó.'
        contact: { $ref: '#/components/schemas/OrderContactInput' }
        deliveryAddress: { $ref: '#/components/schemas/OrderDeliveryAddressInput' }
        notes:
          type: string
          maxLength: 280
          description: Nota general del pedido (sin datos personales sensibles).
        paymentMethodPreference: { $ref: '#/components/schemas/OrderPaymentPreference' }
    OrderDetailModifier:
      type: object
      required: [name, extraPrice]
      properties:
        name: { type: string }
        extraPrice: { $ref: '#/components/schemas/CheckoutMoney' }
    OrderDetailLine:
      type: object
      description: Snapshot de la línea al crear el pedido (inmutable).
      required:
        [
          productName,
          quantity,
          unitPrice,
          modifiers,
          extrasPerUnit,
          lineSubtotal,
          discount,
          lineTotal,
          notes,
        ]
      properties:
        productName: { type: string }
        quantity: { type: integer, minimum: 1, maximum: 99 }
        unitPrice: { $ref: '#/components/schemas/CheckoutMoney' }
        modifiers:
          type: array
          maxItems: 30
          items: { $ref: '#/components/schemas/OrderDetailModifier' }
        extrasPerUnit: { $ref: '#/components/schemas/CheckoutMoney' }
        lineSubtotal: { $ref: '#/components/schemas/CheckoutMoney' }
        discount: { $ref: '#/components/schemas/CheckoutMoney' }
        lineTotal: { $ref: '#/components/schemas/CheckoutMoney' }
        notes: { type: string, nullable: true }
    OrderDetailPromotion:
      type: object
      required: [name, amount]
      properties:
        name: { type: string }
        amount: { $ref: '#/components/schemas/CheckoutMoney' }
    OrderDetailAddress:
      type: object
      description: Snapshot de la dirección (sin coordenadas).
      required: [municipalityName, zone, addressLine, referenceNote]
      properties:
        municipalityName: { type: string }
        zone: { type: string, nullable: true }
        addressLine: { type: string }
        referenceNote: { type: string, nullable: true }
    OrderDetailContact:
      type: object
      description: 'Minimización de PII: teléfono enmascarado y sin correo.'
      required: [fullName, phoneMasked]
      properties:
        fullName: { type: string }
        phoneMasked: { type: string, example: '****1234' }
    OrderDetailPayment:
      type: object
      description: |
        Estado de cobro. En F20 SIEMPRE `NOT_STARTED` (no hay cobro ni registro de pago); F24/F25 amplían el enum y
        el significado. `methodPreference` es solo lo que el cliente declaró.
      required: [methodPreference, status]
      properties:
        methodPreference:
          allOf: [{ $ref: '#/components/schemas/OrderPaymentPreference' }]
          nullable: true
        status:
          {
            type: string,
            enum: [NOT_STARTED],
            description: 'Los clientes deben tolerar valores futuros (F24).',
          }
    OrderDetail:
      type: object
      description: |
        Pedido persistido (reemplaza al `Order` borrador para `http`). NO lleva línea de tiempo ni entrega: eso es
        `OrderTracking` (F21, `getOrderTracking`). Importes en cadenas decimales GTQ; `total = subtotal − discountTotal + deliveryFee`.
      required:
        [
          id,
          orderNumber,
          displayNumber,
          status,
          branchId,
          fulfillmentType,
          deliveryProvider,
          currency,
          lines,
          promotions,
          address,
          contact,
          notes,
          subtotal,
          extrasTotal,
          discountTotal,
          deliveryFee,
          total,
          payment,
          placedAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        orderNumber:
          {
            type: integer,
            format: int64,
            description: 'Secuencia de PostgreSQL: creciente, única, NO contigua. Nunca es una credencial.',
          }
        displayNumber: { type: string, example: 'MON-001042' }
        status: { $ref: '#/components/schemas/OrderLifecycleStatus' }
        branchId: { type: string, format: uuid }
        fulfillmentType: { type: string, enum: [PICKUP, DELIVERY] }
        deliveryProvider:
          allOf: [{ $ref: '#/components/schemas/CourierProvider' }]
          nullable: true
          description: '`OWN` en entrega propia, `null` en PICKUP. `PEDIDOSYA` no es creable en F20.'
        currency: { type: string, enum: [GTQ] }
        lines:
          type: array
          maxItems: 30
          items: { $ref: '#/components/schemas/OrderDetailLine' }
        promotions:
          type: array
          maxItems: 30
          items: { $ref: '#/components/schemas/OrderDetailPromotion' }
        address:
          allOf: [{ $ref: '#/components/schemas/OrderDetailAddress' }]
          nullable: true
        contact: { $ref: '#/components/schemas/OrderDetailContact' }
        notes: { type: string, nullable: true }
        subtotal: { $ref: '#/components/schemas/CheckoutMoney' }
        extrasTotal: { $ref: '#/components/schemas/CheckoutMoney' }
        discountTotal: { $ref: '#/components/schemas/CheckoutMoney' }
        deliveryFee: { $ref: '#/components/schemas/CheckoutMoney' }
        total: { $ref: '#/components/schemas/CheckoutMoney' }
        payment: { $ref: '#/components/schemas/OrderDetailPayment' }
        placedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OrderGuestAccess:
      type: object
      description: |
        Credencial de invitado, mostrada SOLO en la creación (o en una repetición idempotente, que revoca la anterior). El
        servidor guarda únicamente su sha256. Guardar en `sessionStorage`; nunca en la URL ni en logs.
      required: [guestToken, expiresAt]
      properties:
        guestToken: { type: string, pattern: '^smo_[A-Za-z0-9_-]{43}$' }
        expiresAt: { type: string, format: date-time }
    OrderCreated:
      type: object
      required: [order, access]
      properties:
        order: { $ref: '#/components/schemas/OrderDetail' }
        access:
          allOf: [{ $ref: '#/components/schemas/OrderGuestAccess' }]
          nullable: true
          description: '`null` si el pedido es de un cliente autenticado (accede con su sesión).'
    OrderPublicStatus:
      type: string
      description: |
        Fase PÚBLICA normalizada del pedido (F21, spec 022 §3). El servidor entrega CÓDIGOS estables; las etiquetas y
        descripciones (es/en) las pone la web. Mapeo desde `OrderLifecycleStatus`: `pending`=>`received`, `accepted`=>`accepted`,
        `preparing`=>`preparing`, `ready`=>`ready`, `on_the_way`=>`on_the_way`, `delivered`|`picked_up`=>`completed` (la web
        distingue entrega/retiro con `fulfillmentType`), `rejected`=>`rejected`, `cancelled`=>`cancelled`. No existe fase de
        «incidencia» ni de «pendiente de pago» (no son estados del pedido). Los clientes deben tolerar valores futuros.
      enum: [received, accepted, preparing, ready, on_the_way, completed, rejected, cancelled]
    OrderTrackingStep:
      type: object
      description: |
        Una fase del recorrido esperado. `reachedAt` = `changed_at` del PRIMER evento registrado cuya fase pública es esta;
        `null` = no ocurrida o sin registro (nunca una hora estimada). Una fase anterior a la actual con `reachedAt: null`
        indica un salto de estados en el historial (se muestra como superada, sin hora).
      required: [phase, reachedAt]
      properties:
        phase: { $ref: '#/components/schemas/OrderPublicStatus' }
        reachedAt: { type: string, format: date-time, nullable: true }
    OrderTrackingEvent:
      type: object
      description: |
        Una fila de `order_status_history` tal como está registrada. Sin `changed_by`, sin `reason` y sin identificadores
        internos. `seq` es la posición (desde 1) en el orden `changed_at, id` y solo sirve como clave estable de lista.
      required: [seq, status, publicStatus, occurredAt]
      properties:
        seq: { type: integer, minimum: 1, maximum: 50 }
        status: { $ref: '#/components/schemas/OrderLifecycleStatus' }
        publicStatus: { $ref: '#/components/schemas/OrderPublicStatus' }
        occurredAt:
          {
            type: string,
            format: date-time,
            description: 'ISO-8601 UTC; la web formatea en America/Guatemala.',
          }
    OrderTrackingDelivery:
      type: object
      description: |
        Solo en pedidos DELIVERY. Hoy NO existe fuente de entregas (`deliveries`: F28/F29), por lo que únicamente se informa el
        proveedor del pedido y `status` es SIEMPRE `null`. Nunca incluye repartidor, teléfono, ubicación, GPS ni ETA. Con
        `PEDIDOSYA` (`BLOCKED_EXTERNAL`, F29) la web no muestra seguimiento externo.
      required: [provider, status]
      properties:
        provider: { $ref: '#/components/schemas/CourierProvider' }
        status:
          type: string
          nullable: true
          description: |
            RESERVADO para F28/F29 (estado de la entrega). Siempre `null` en F21; su enum se definirá con la fuente real
            (ADR propio). Los clientes deben ignorar valores desconocidos.
    OrderTracking:
      type: object
      description: |
        Seguimiento ligero para polling (ver `getOrderTracking`). Sin importes, líneas, contacto ni dirección.
      required:
        [
          orderId,
          displayNumber,
          branchId,
          fulfillmentType,
          status,
          publicStatus,
          terminal,
          placedAt,
          updatedAt,
          generatedAt,
          steps,
          events,
          eventsTruncated,
          delivery,
          pollAfterSeconds,
        ]
      properties:
        orderId: { type: string, format: uuid }
        displayNumber: { type: string, example: 'MON-001042' }
        branchId: { type: string, format: uuid }
        fulfillmentType: { type: string, enum: [PICKUP, DELIVERY] }
        status: { $ref: '#/components/schemas/OrderLifecycleStatus' }
        publicStatus: { $ref: '#/components/schemas/OrderPublicStatus' }
        terminal:
          type: boolean
          description: '`true` si `status` es `delivered`, `picked_up`, `rejected` o `cancelled`: no habrá más cambios que consultar.'
        placedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        generatedAt:
          { type: string, format: date-time, description: Hora del servidor al responder. }
        steps:
          type: array
          maxItems: 8
          items: { $ref: '#/components/schemas/OrderTrackingStep' }
        events:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/OrderTrackingEvent' }
        eventsTruncated:
          type: boolean
          description: '`true` si el historial tiene más de 50 eventos (se devuelven los 50 más recientes, en orden cronológico; faltan los más antiguos).'
        delivery:
          allOf: [{ $ref: '#/components/schemas/OrderTrackingDelivery' }]
          nullable: true
          description: '`null` en PICKUP.'
        pollAfterSeconds:
          type: integer
          minimum: 5
          maximum: 300
          nullable: true
          description: 'Sugerencia de espera antes del siguiente refresco; `null` si `terminal`.'
    OrderQuoteChange:
      type: object
      required: [field]
      properties:
        field:
          { type: string, enum: [provider, subtotal, discountTotal, deliveryFee, total, lines] }
        previous:
          {
            type: string,
            nullable: true,
            description: 'Valor cotizado antes (importe o proveedor; `null` en `lines`).',
          }
        current: { type: string, nullable: true }
    OrderQuoteConflict:
      description: 'Conflicto 409 `QUOTE_CHANGED` / `QUOTE_EXPIRED`. Hereda `ErrorResponse` y añade la cotización vigente para re-aceptar.'
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          required: [quote, changes]
          properties:
            changes:
              type: array
              maxItems: 10
              items: { $ref: '#/components/schemas/OrderQuoteChange' }
            quote:
              $ref: '#/components/schemas/CheckoutQuote'
    OrderBlocked:
      description: 422 `CHECKOUT_BLOCKED`. Hereda `ErrorResponse` y añade los bloqueos de la recotización.
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          required: [blockers]
          properties:
            blockers:
              type: array
              maxItems: 60
              items: { $ref: '#/components/schemas/CheckoutBlocker' }
    AdminModifier:
      type: object
      required: [id, groupId, name, extraPrice, active, sortOrder, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        groupId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 80 }
        extraPrice: { $ref: '#/components/schemas/ModifierExtraPrice' }
        active: { type: boolean }
        sortOrder: { type: integer, minimum: 0, maximum: 29 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminModifierList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 30
          items: { $ref: '#/components/schemas/AdminModifier' }
    AdminModifierGroupSummary:
      type: object
      required:
        [
          id,
          name,
          minSelect,
          maxSelect,
          required,
          active,
          optionCount,
          activeOptionCount,
          productCount,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 80 }
        minSelect: { type: integer, minimum: 0, maximum: 20 }
        maxSelect: { type: integer, minimum: 1, maximum: 20 }
        required: { type: boolean, description: 'Derivado: `minSelect >= 1` (no se almacena).' }
        active: { type: boolean }
        optionCount:
          {
            type: integer,
            minimum: 0,
            maximum: 30,
            description: Opciones totales (activas e inactivas).,
          }
        activeOptionCount: { type: integer, minimum: 0, maximum: 30 }
        productCount: { type: integer, minimum: 0, description: Productos a los que está asociado. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminModifierGroup:
      description: Grupo con todas sus opciones (activas e inactivas) ordenadas por `sortOrder`.
      allOf:
        - $ref: '#/components/schemas/AdminModifierGroupSummary'
        - type: object
          required: [options]
          properties:
            options:
              type: array
              maxItems: 30
              items: { $ref: '#/components/schemas/AdminModifier' }
    AdminModifierGroupPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminModifierGroupSummary' }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
    AdminProductModifiers:
      type: object
      required: [productId, groups]
      properties:
        productId: { type: string, format: uuid }
        groups:
          type: array
          maxItems: 10
          description: Grupos asociados (activos e inactivos) en el orden de asociación, con todas sus opciones.
          items: { $ref: '#/components/schemas/AdminModifierGroup' }
    ModifierOptionInput:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        extraPrice:
          allOf:
            - $ref: '#/components/schemas/ModifierExtraPrice'
          description: Opcional; por defecto `"0.00"`.
    CreateModifierGroupRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        minSelect:
          type: integer
          description: 'Opcional, por defecto 0. Rango y relación (0 <= min <= max) => 422 `MODIFIER_LIMITS_INVALID` (no 400).'
        maxSelect:
          type: integer
          description: 'Opcional, por defecto 1. Debe estar en 1-20 => 422 `MODIFIER_LIMITS_INVALID` (no 400).'
        active: { type: boolean, description: 'Opcional; por defecto `true`.' }
        options:
          type: array
          maxItems: 100
          description: 'Opcional. Máx. 30 (31-100 => 422 `MODIFIER_LIMIT_REACHED`). El orden define `sortOrder`.'
          items: { $ref: '#/components/schemas/ModifierOptionInput' }
    UpdateModifierGroupRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        minSelect:
          { type: integer, description: 'Rango y relación => 422 `MODIFIER_LIMITS_INVALID`.' }
        maxSelect: { type: integer, description: '1-20 => si no, 422 `MODIFIER_LIMITS_INVALID`.' }
        active: { type: boolean }
    CreateModifierRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        extraPrice:
          allOf:
            - $ref: '#/components/schemas/ModifierExtraPrice'
          description: Opcional; por defecto `"0.00"`.
        active: { type: boolean, description: 'Opcional; por defecto `true`.' }
    UpdateModifierRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        extraPrice: { $ref: '#/components/schemas/ModifierExtraPrice' }
        active: { type: boolean }
    ReorderModifiersRequest:
      type: object
      required: [orderedIds]
      additionalProperties: false
      properties:
        orderedIds:
          type: array
          maxItems: 30
          description: TODAS las opciones actuales del grupo, en el orden deseado, sin duplicados ni ajenas (si no => 422 `MODIFIER_REORDER_MISMATCH`).
          items: { type: string, format: uuid }
    ReplaceProductModifierGroupsRequest:
      type: object
      required: [groupIds]
      additionalProperties: false
      properties:
        groupIds:
          type: array
          maxItems: 50
          description: 'Lista completa y ordenada (`[]` quita todos). Máx. 10 (11-50 => 422 `MODIFIER_LIMIT_REACHED`); duplicados/inexistentes/inactivos nuevos => 422 `MODIFIER_GROUP_INVALID`.'
          items: { type: string, format: uuid }
    StoreProductPromo:
      type: object
      description: 'Promoción pública INDICATIVA vigente que aplica a un producto en una sucursal (F15; cantidad 1, precio de la sucursal, esa promoción por sí sola). NO es una cotización y nunca revela un cupón ni su código.'
      required: [promotionId, name, isHappyHour, dineInOnly, regularPrice, promoPrice]
      properties:
        promotionId: { type: string, format: uuid }
        name: { type: string }
        isHappyHour: { type: boolean }
        dineInOnly:
          type: boolean
          description: 'Solo consumo en el local; nunca aplica a recojo ni entrega.'
        regularPrice: { $ref: '#/components/schemas/ProductPrice' }
        promoPrice: { $ref: '#/components/schemas/ProductPrice' }
    StoreBranchMenuItem:
      type: object
      description: |
        Tarjeta de un producto visible (F13, ampliada en F17). Los 4 primeros campos son los de F13 y no cambian de significado; los demás son aditivos y el servidor siempre los envía.
        Sin precio base ni indicio de override, sin stock, sin SKU, sin modificadores ni galería.
      required: [productId, slug, price, available]
      properties:
        productId: { type: string, format: uuid }
        slug: { type: string, maxLength: 80, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
        price:
          allOf:
            - $ref: '#/components/schemas/ProductPrice'
          description: Precio EFECTIVO en esa sucursal (override o base); el base si no se envió `branchId`. Informativo; el servidor recalcula al cotizar (F19).
        available:
          type: boolean
          nullable: true
          description: '`false` = agotado/no disponible en esa sucursal (sin cantidades). `null` = no se envió `branchId` (se desconoce). La web lo muestra deshabilitado y no lo permite añadir al carrito.'
        name: { type: string, minLength: 1, maxLength: 120 }
        summary:
          type: string
          nullable: true
          maxLength: 160
          description: 'Descripción corta derivada de la descripción del producto (texto plano, recortada sin partir palabras); `null` si no hay descripción.'
        image:
          allOf:
            - $ref: '#/components/schemas/PublicProductMedia'
          nullable: true
          description: 'Imagen principal (la de menor `sortOrder`); `null` = la web muestra un placeholder.'
        category: { $ref: '#/components/schemas/PublicProductCategoryRef' }
        promo:
          allOf:
            - $ref: '#/components/schemas/StoreProductPromo'
          nullable: true
          description: 'La promoción indicativa vigente de mayor ahorro (desempate como ADR-0021); `null` sin sucursal o sin promoción aplicable.'
    StoreBranchMenu:
      type: object
      required: [branchId, items]
      properties:
        branchId:
          {
            type: string,
            format: uuid,
            nullable: true,
            description: '`null` = no se envió `branchId`.',
          }
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/StoreBranchMenuItem' }
        page: { type: integer, minimum: 1, description: 'Siempre presente desde F17.' }
        pageSize:
          { type: integer, minimum: 1, maximum: 100, description: 'Siempre presente desde F17.' }
        total:
          type: integer
          minimum: 0
          description: 'Productos que cumplen el filtro (todas las páginas). Siempre presente desde F17.'
        generatedAt:
          type: string
          format: date-time
          description: 'Hora del servidor al generar la respuesta (puede estar en caché hasta 15 s). Siempre presente desde F17.'
        nextChangeAt:
          type: string
          format: date-time
          nullable: true
          description: 'Próximo instante (en 14 días) en que cambia por tiempo la info promocional de esta página; `null` si no hay. Acota `s-maxage`. Siempre presente desde F17.'
    StoreSearchPage:
      type: object
      required: [branchId, items, page, pageSize, total, generatedAt, nextChangeAt]
      properties:
        branchId: { type: string, format: uuid, nullable: true }
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/StoreBranchMenuItem' }
        page: { type: integer, minimum: 1, maximum: 20 }
        pageSize: { type: integer, minimum: 1, maximum: 50 }
        total:
          {
            type: integer,
            minimum: 0,
            description: 'Productos que cumplen la búsqueda (todas las páginas).',
          }
        generatedAt: { type: string, format: date-time }
        nextChangeAt:
          type: string
          format: date-time
          nullable: true
          description: 'Próximo cambio por tiempo de la info promocional de esta página; `null` si no hay. Acota `s-maxage`.'
    StoreBootstrapCategory:
      type: object
      description: 'Categoría raíz visible (F10), sin hijas; el árbol completo es `listStoreCategories`.'
      required: [id, slug, name, description, hasChildren]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, maxLength: 80, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, nullable: true, maxLength: 500 }
        hasChildren: { type: boolean, description: 'Tiene al menos una hija visible.' }
    StoreBootstrapSection:
      type: string
      enum: [availability, featured, promotions, banners]
      description: 'Secciones NO críticas del agregado: si fallan, la respuesta sigue siendo 200 con la sección vacía o `null` y su nombre en `degraded`.'
    StoreBootstrap:
      type: object
      required:
        - generatedAt
        - nextChangeAt
        - locale
        - branchId
        - branch
        - availability
        - categories
        - featured
        - promotions
        - banners
        - productCount
        - degraded
      properties:
        generatedAt:
          type: string
          format: date-time
          description: 'Hora del servidor al generar la respuesta (puede estar en caché hasta 15 s).'
        nextChangeAt:
          type: string
          format: date-time
          nullable: true
          description: 'El MENOR no nulo entre `promotions` (cambio de vigencia), `banners` (inicio/fin) y `availability.nextTransitionAt`, con horizonte de 14 días; `null` si no hay. Acota `max-age`/`s-maxage`.'
        locale: { $ref: '#/components/schemas/BannerLocale' }
        branchId: { type: string, format: uuid, nullable: true }
        branch:
          allOf:
            - $ref: '#/components/schemas/PublicBranch'
          nullable: true
          description: '`null` sin `branchId`.'
        availability:
          allOf:
            - $ref: '#/components/schemas/BranchAvailability'
          nullable: true
          description: '`null` sin `branchId` o si la sección falló (`degraded`).'
        categories:
          type: array
          maxItems: 30
          description: Categorías raíz visibles, ordenadas por `sortOrder`, `name`, `id`.
          items: { $ref: '#/components/schemas/StoreBootstrapCategory' }
        featured:
          type: array
          maxItems: 8
          description: 'Productos destacados visibles (tarjeta de `getStoreBranchMenu`). Vacío si ninguno está destacado (criterio P23) o la sección falló.'
          items: { $ref: '#/components/schemas/StoreBranchMenuItem' }
        promotions:
          type: array
          maxItems: 5
          description: 'Promociones y cupones VIGENTES ahora (forma pública de `listStorePromotions`, nunca `code`), SIN `items`. Vacío sin sucursal, sin vigentes o si la sección falló.'
          items: { $ref: '#/components/schemas/StorePromotion' }
        banners:
          type: array
          maxItems: 10
          description: 'Banners elegibles ahora (forma de `listStoreBanners`), ya ordenados. Vacío si ninguno aplica o la sección falló.'
          items: { $ref: '#/components/schemas/StoreBanner' }
        productCount:
          type: integer
          minimum: 0
          description: 'Productos visibles del menú (disponibles o no) para el pie del Inicio.'
        degraded:
          type: array
          description: 'Secciones no críticas que fallaron en esta respuesta. Si no está vacío, la respuesta lleva `Cache-Control: no-store`.'
          items: { $ref: '#/components/schemas/StoreBootstrapSection' }
    AdminBranchProductState:
      type: object
      description: Estado de un producto en una sucursal (F13). Sin fila en `branch_products` => `priceOverride=null`, `available=true`, `updatedAt=null`.
      required:
        [
          branchId,
          productId,
          basePrice,
          priceOverride,
          effectivePrice,
          available,
          offered,
          updatedAt,
        ]
      properties:
        branchId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        basePrice: { $ref: '#/components/schemas/ProductPrice' }
        priceOverride:
          type: string
          nullable: true
          pattern: '^[0-9]{1,6}\.[0-9]{2}$'
          description: Precio de la sucursal (`null` = usa el precio base).
        effectivePrice: { $ref: '#/components/schemas/ProductPrice' }
        available: { type: boolean }
        offered:
          type: boolean
          description: 'El público ve y puede pedir el producto en esa sucursal: producto visible (F11) Y `available`.'
        updatedAt:
          {
            type: string,
            format: date-time,
            nullable: true,
            description: Última escritura de la fila (`null` si no existe fila).,
          }
    AdminBranchProductRow:
      description: Fila de la matriz por sucursal (`listAdminBranchProducts`).
      allOf:
        - $ref: '#/components/schemas/AdminBranchProductState'
        - type: object
          required: [sku, slug, name, category, active, publiclyVisible]
          properties:
            sku: { type: string, nullable: true, maxLength: 40 }
            slug: { type: string, maxLength: 80 }
            name: { type: string, maxLength: 120 }
            category: { $ref: '#/components/schemas/AdminProductCategory' }
            active: { type: boolean, description: Estado propio del producto (F11). }
            publiclyVisible:
              { type: boolean, description: '`active` Y categoría efectivamente visible.' }
    AdminBranchProductPage:
      type: object
      required: [branchId, items, page, pageSize, total]
      properties:
        branchId: { type: string, format: uuid }
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminBranchProductRow' }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
    AdminProductBranchRow:
      description: Fila de la matriz por producto (`listAdminProductBranches`).
      allOf:
        - $ref: '#/components/schemas/AdminBranchProductState'
        - type: object
          required: [branchCode, branchName, branchActive]
          properties:
            branchCode: { type: string }
            branchName: { type: string }
            branchActive: { type: boolean }
    AdminProductBranches:
      type: object
      required: [productId, basePrice, active, publiclyVisible, items]
      properties:
        productId: { type: string, format: uuid }
        basePrice: { $ref: '#/components/schemas/ProductPrice' }
        active: { type: boolean }
        publiclyVisible: { type: boolean }
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminProductBranchRow' }
    SetBranchProductPricingRequest:
      type: object
      required: [priceOverride]
      additionalProperties: false
      properties:
        priceOverride:
          type: string
          nullable: true
          pattern: '^[0-9]{1,6}\.[0-9]{2}$'
          description: 'Cadena decimal GTQ (`"85.00"`; nunca `number`) o `null` para eliminar el override. Forma inválida => 400; `"0.00"` => 422 `BRANCH_PRICE_INVALID`.'
    SetProductAvailabilityRequest:
      type: object
      required: [branchId, available]
      additionalProperties: false
      properties:
        branchId: { type: string, format: uuid }
        available: { type: boolean }
    MediaKind:
      type: string
      enum: [PRODUCT_IMAGE, BANNER_IMAGE]
      description: 'Tipo de medio. `PRODUCT_IMAGE` (F14; clave `products/<yyyy>/<uuid>.<ext>`, <= 5 MiB) y `BANNER_IMAGE` (F16; clave `banners/<yyyy>/<uuid>.<ext>`, <= 1 MiB; solo la sube y la usa un banner). Ampliar de nuevo exige migración y ADR.'
    MediaStatus:
      type: string
      enum: [PENDING, READY]
      description: '`PENDING` = intent emitido, objeto sin confirmar (caduca); `READY` = objeto verificado en R2 y publicable.'
    MediaStorageMode:
      type: string
      enum: [R2, MOCK]
      description: '`R2` = adaptador real S3 de Cloudflare; `MOCK` = en memoria, solo desarrollo/pruebas (nunca prueba una integración real). Sin almacenamiento configurado las operaciones de subida responden 503.'
    CreateMediaUploadIntentRequest:
      type: object
      required: [kind, mimeType, sizeBytes, checksumSha256]
      additionalProperties: false
      properties:
        kind: { $ref: '#/components/schemas/MediaKind' }
        mimeType:
          type: string
          maxLength: 100
          description: '`image/jpeg`, `image/png`, `image/webp` o `image/avif`. Cualquier otro valor => 422 `MEDIA_TYPE_NOT_ALLOWED` (no 400). La extensión del objeto se deriva de este MIME, no de un nombre de archivo.'
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          description: 'Bytes exactos del archivo. Más de `MEDIA_MAX_BYTES` (5 MiB por defecto) => 422 `MEDIA_TOO_LARGE` (no 400).'
        checksumSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 del archivo en hexadecimal minúsculas. Se firma como `x-amz-checksum-sha256` (base64) para que R2 lo verifique al recibir los bytes.
    AdminMediaAsset:
      type: object
      required:
        [
          id,
          kind,
          status,
          url,
          mimeType,
          sizeBytes,
          checksumSha256,
          createdAt,
          confirmedAt,
          expiresAt,
          usageCount,
          storageMode,
        ]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/MediaKind' }
        status: { $ref: '#/components/schemas/MediaStatus' }
        url:
          type: string
          format: uri
          nullable: true
          maxLength: 2048
          description: URL pública HTTPS estable (`R2_PUBLIC_BASE_URL` + clave de objeto). `null` mientras el asset está PENDING. NUNCA es una URL firmada.
        mimeType: { type: string }
        sizeBytes: { type: integer, format: int64, minimum: 1 }
        checksumSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        createdAt: { type: string, format: date-time }
        confirmedAt: { type: string, format: date-time, nullable: true }
        expiresAt:
          {
            type: string,
            format: date-time,
            nullable: true,
            description: 'Solo PENDING: caducidad del intent.',
          }
        usageCount:
          {
            type: integer,
            minimum: 0,
            description: 'Filas de `product_media` MÁS banners (`banners.image_asset_id`) que lo referencian (F16).',
          }
        storageMode: { $ref: '#/components/schemas/MediaStorageMode' }
    AdminMediaUsage:
      type: object
      required: [productId, productName, productMediaId]
      properties:
        productId: { type: string, format: uuid }
        productName: { type: string }
        productMediaId: { type: string, format: uuid }
    AdminMediaBannerUsage:
      type: object
      required: [bannerId, bannerCode]
      properties:
        bannerId: { type: string, format: uuid }
        bannerCode: { type: string }
    AdminMediaAssetDetail:
      allOf:
        - $ref: '#/components/schemas/AdminMediaAsset'
        - type: object
          required: [usages]
          properties:
            usages:
              type: array
              items: { $ref: '#/components/schemas/AdminMediaUsage' }
            bannerUsages:
              type: array
              description: 'F16 (aditivo, opcional): banners que usan el asset. Un asset de banner referenciado no se puede borrar (409 `MEDIA_IN_USE`).'
              items: { $ref: '#/components/schemas/AdminMediaBannerUsage' }
    AdminMediaAssetPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminMediaAsset' }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
    AdminMediaUploadIntent:
      type: object
      description: Resultado de `createAdminMediaUpload`. Con `deduplicated=true` no hay subida (`uploadUrl`, `headers` y `expiresAt` son `null`).
      required: [assetId, deduplicated, uploadUrl, headers, expiresAt, storageMode, asset]
      properties:
        assetId: { type: string, format: uuid }
        deduplicated: { type: boolean }
        uploadUrl:
          type: string
          format: uri
          nullable: true
          description: 'URL PUT firmada (SigV4) contra el endpoint S3 de R2. Secreto de corta vida: solo existe en esta respuesta; no guardarla, registrarla ni cachearla.'
        headers:
          type: object
          nullable: true
          additionalProperties: { type: string }
          description: 'Cabeceras firmadas del PUT: `Content-Type`, `Cache-Control` y `x-amz-checksum-sha256` se envían EXACTAMENTE; `Content-Length` (= `sizeBytes`, también firmado) lo fija el navegador solo al enviar el cuerpo: NO se envía manualmente (con XHR no llamar a `setRequestHeader` para él). El cuerpo debe ser exactamente el archivo declarado.'
        expiresAt: { type: string, format: date-time, nullable: true }
        storageMode: { $ref: '#/components/schemas/MediaStorageMode' }
        asset: { $ref: '#/components/schemas/AdminMediaAsset' }
    CompleteMediaUploadRequest:
      type: object
      required: [assetId]
      additionalProperties: false
      properties:
        assetId: { type: string, format: uuid }
    AttachProductMediaRequest:
      type: object
      required: [assetId]
      additionalProperties: false
      properties:
        assetId: { type: string, format: uuid }
        altText:
          {
            type: string,
            nullable: true,
            description: '<= 200 caracteres; si no => 422 `PRODUCT_MEDIA_INVALID` (no 400).',
          }
    UpdateProductMediaRequest:
      type: object
      required: [altText]
      additionalProperties: false
      properties:
        altText:
          {
            type: string,
            nullable: true,
            description: '`null` o vacío lo borra; <= 200 caracteres; si no => 422 `PRODUCT_MEDIA_INVALID`.',
          }
    ReorderProductMediaRequest:
      type: object
      required: [orderedIds]
      additionalProperties: false
      properties:
        orderedIds:
          type: array
          maxItems: 8
          items: { type: string, format: uuid }
          description: Ids de `product_media` (no de assets), exactamente todos los del producto.
    AdminProductMediaList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminProductMedia' }
    PromotionKind:
      type: string
      enum: [PERCENT, FIXED_AMOUNT]
      description: |
        `PERCENT`: porcentaje de descuento sobre el precio de la línea (`value` 0 < v <= 100). `FIXED_AMOUNT`: monto fijo en GTQ descontado POR UNIDAD (`value` > 0), sin superar nunca el precio
        de la unidad. Las modalidades `2x1` y «precio especial» del prototipo NO existen en F15 (decisión de negocio P15).
    PromotionScope:
      type: string
      enum: [ALL, SELECTED]
    PromotionDecimal:
      type: string
      pattern: '^[0-9]{1,6}\.[0-9]{2}$'
      example: '15.00'
      description: 'Número decimal como CADENA con 2 decimales (porcentaje o importe en GTQ según `kind`); nunca `number`.'
    PromotionScheduleSlot:
      type: object
      required: [weekday, startsAt, endsAt]
      additionalProperties: false
      properties:
        weekday:
          type: integer
          minimum: 1
          maximum: 7
          description: 'Día ISO (1 = lunes … 7 = domingo). Nunca `Date.getDay()`. Es el día de la hora LOCAL de `America/Guatemala`.'
        startsAt:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: '15:00'
          description: 'Hora local `HH:mm`, inclusiva.'
        endsAt:
          type: string
          pattern: '^(([01][0-9]|2[0-3]):[0-5][0-9]|24:00)$'
          example: '18:00'
          description: 'Hora local `HH:mm` o `24:00`, exclusiva; debe ser mayor que `startsAt` (no se cruza la medianoche: parte el tramo en dos días).'
    StorePromotionItem:
      type: object
      required: [productId, regularPrice, promoPrice]
      properties:
        productId: { type: string, format: uuid }
        regularPrice: { $ref: '#/components/schemas/ProductPrice' }
        promoPrice:
          $ref: '#/components/schemas/ProductPrice'
    StorePromotion:
      type: object
      required:
        - id
        - name
        - description
        - requiresCode
        - isHappyHour
        - dineInOnly
        - state
        - validFrom
        - validUntil
        - schedule
        - productScope
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        requiresCode:
          type: boolean
          description: '`true` = cupón: nunca se devuelve el código ni el descuento.'
        isHappyHour:
          type: boolean
          description: 'Promoción automática con horario semanal (derivado de `schedule`).'
        dineInOnly:
          type: boolean
          description: 'Solo consumo en el local; nunca aplica a recojo ni entrega.'
        state:
          type: string
          enum: [live, upcoming]
        kind:
          allOf:
            - $ref: '#/components/schemas/PromotionKind'
          description: 'Ausente si `requiresCode`.'
        value:
          allOf:
            - $ref: '#/components/schemas/PromotionDecimal'
          description: 'Ausente si `requiresCode`.'
        validFrom:
          {
            type: string,
            format: date-time,
            description: 'Inicio de vigencia (inclusivo), instante con zona.',
          }
        validUntil:
          {
            type: string,
            format: date-time,
            description: 'Fin de vigencia (EXCLUSIVO), instante con zona.',
          }
        schedule:
          type: array
          description: 'Tramos semanales locales; vacío = todos los días y todo el día dentro de la vigencia.'
          items: { $ref: '#/components/schemas/PromotionScheduleSlot' }
        nextStartsAt:
          type: string
          format: date-time
          nullable: true
          description: 'Próximo instante en que pasa a regir (si `upcoming`) o vuelve a regir tras terminar el tramo actual; `null` si no hay en 14 días.'
        nextEndsAt:
          type: string
          format: date-time
          nullable: true
          description: 'Próximo instante en que deja de regir (si `live`; tramos contiguos fusionados); `null` si no hay.'
        productScope: { $ref: '#/components/schemas/PromotionScope' }
        productIds:
          type: array
          maxItems: 200
          items: { type: string, format: uuid }
          description: 'Solo si `productScope=SELECTED` y no `requiresCode`.'
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/StorePromotionItem' }
          description: 'Precios INDICATIVOS calculados por el servidor (ver la operación). Solo promociones automáticas con productos seleccionados.'
    StorePromotionList:
      type: object
      required: [branchId, generatedAt, nextChangeAt, truncated, items]
      properties:
        branchId: { type: string, format: uuid }
        generatedAt:
          {
            type: string,
            format: date-time,
            description: 'Hora del servidor al generar la respuesta (puede estar en caché hasta 30 s). ',
          }
        nextChangeAt:
          type: string
          format: date-time
          nullable: true
          description: 'Próximo instante (en 14 días) en que cambia el conjunto de promociones vigentes de la sucursal; `null` si no hay. Acota `max-age`.'
        truncated: { type: boolean }
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/StorePromotion' }
    AdminPromotionBranchRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    AdminPromotionProductRef:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
    AdminPromotionSummary:
      type: object
      required:
        - id
        - code
        - name
        - description
        - kind
        - value
        - startsAt
        - endsAt
        - dineInOnly
        - active
        - lifecycle
        - liveNow
        - branchScope
        - branches
        - productScope
        - productCount
        - scheduleCount
        - editable
        - version
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        code:
          type: string
          nullable: true
          description: 'Código del cupón en mayúsculas; `null` = promoción automática.'
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, nullable: true, maxLength: 500 }
        kind: { $ref: '#/components/schemas/PromotionKind' }
        value: { $ref: '#/components/schemas/PromotionDecimal' }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time, description: 'Exclusivo. ' }
        dineInOnly: { type: boolean }
        active: { type: boolean }
        lifecycle:
          type: string
          enum: [INACTIVE, SCHEDULED, RUNNING, EXPIRED]
          description: 'Precedencia INACTIVE > EXPIRED > SCHEDULED > RUNNING (solo vigencia; el horario semanal está en `liveNow`).'
        liveNow:
          {
            type: boolean,
            description: '`RUNNING` Y dentro de un tramo semanal (o sin tramos) en este instante.',
          }
        branchScope: { $ref: '#/components/schemas/PromotionScope' }
        branches:
          type: array
          description: 'Sucursales seleccionadas, recortadas al alcance del actor; vacío si `branchScope=ALL`.'
          items: { $ref: '#/components/schemas/AdminPromotionBranchRef' }
        productScope: { $ref: '#/components/schemas/PromotionScope' }
        productCount: { type: integer, minimum: 0 }
        scheduleCount: { type: integer, minimum: 0 }
        editable:
          type: boolean
          description: 'El actor cubre TODAS las sucursales de la promoción con `promotions.update`.'
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminPromotion:
      allOf:
        - $ref: '#/components/schemas/AdminPromotionSummary'
        - type: object
          required: [products, schedule]
          properties:
            products:
              type: array
              maxItems: 200
              description: 'Productos seleccionados (vacío si `productScope=ALL`), orden `name`, `id`.'
              items: { $ref: '#/components/schemas/AdminPromotionProductRef' }
            schedule:
              type: array
              maxItems: 42
              description: 'Orden `weekday`, `startsAt`.'
              items: { $ref: '#/components/schemas/PromotionScheduleSlot' }
    AdminPromotionPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminPromotionSummary' }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
    CreatePromotionRequest:
      type: object
      required: [name, kind, value, startsAt, endsAt, branchScope, productScope]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, nullable: true, maxLength: 500 }
        code:
          type: string
          nullable: true
          minLength: 3
          maxLength: 32
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{2,31}$'
          description: '`null` u omitido = automática. Se guarda en mayúsculas; único sin distinguir mayúsculas (409 `PROMOTION_CODE_TAKEN`).'
        kind: { $ref: '#/components/schemas/PromotionKind' }
        value: { $ref: '#/components/schemas/PromotionDecimal' }
        startsAt:
          {
            type: string,
            format: date-time,
            description: 'Instante con zona (`Z` u offset); sin zona => 400. ',
          }
        endsAt:
          {
            type: string,
            format: date-time,
            description: 'Exclusivo; debe ser mayor que `startsAt` (422 `PROMOTION_PERIOD_INVALID`). ',
          }
        dineInOnly: { type: boolean, default: false }
        active: { type: boolean, default: true }
        branchScope: { $ref: '#/components/schemas/PromotionScope' }
        branchIds:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { type: string, format: uuid }
          description: 'Obligatorio y no vacío si `SELECTED`; omitido o vacío si `ALL` (si no, 400).'
        productScope: { $ref: '#/components/schemas/PromotionScope' }
        productIds:
          type: array
          maxItems: 200
          uniqueItems: true
          items: { type: string, format: uuid }
          description: 'Obligatorio y no vacío si `SELECTED` (si no, 422 `PROMOTION_SCOPE_INVALID`); omitido o vacío si `ALL` (si no, 400).'
        schedule:
          type: array
          maxItems: 42
          items: { $ref: '#/components/schemas/PromotionScheduleSlot' }
    UpdatePromotionRequest:
      type: object
      required: [expectedVersion]
      additionalProperties: false
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, nullable: true, maxLength: 500 }
        code:
          type: string
          nullable: true
          minLength: 3
          maxLength: 32
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{2,31}$'
        kind: { $ref: '#/components/schemas/PromotionKind' }
        value: { $ref: '#/components/schemas/PromotionDecimal' }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        dineInOnly: { type: boolean }
        branchScope: { $ref: '#/components/schemas/PromotionScope' }
        branchIds:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { type: string, format: uuid }
        productScope: { $ref: '#/components/schemas/PromotionScope' }
        productIds:
          type: array
          maxItems: 200
          uniqueItems: true
          items: { type: string, format: uuid }
        schedule:
          type: array
          maxItems: 42
          items: { $ref: '#/components/schemas/PromotionScheduleSlot' }
    UpdatePromotionStatusRequest:
      type: object
      required: [active]
      additionalProperties: false
      properties:
        active: { type: boolean }
        reason: { type: string, maxLength: 200, description: 'Opcional; sin datos personales. ' }
    BannerLocale:
      type: string
      enum: [es, en]
      default: es
      description: Idioma de los textos. `es` es el idioma de respaldo y el único obligatorio al crear.
    BannerLifecycle:
      type: string
      enum: [INACTIVE, SCHEDULED, PUBLISHED, EXPIRED]
      description: 'Estado derivado (no es columna). Precedencia INACTIVE > EXPIRED > SCHEDULED > PUBLISHED; solo mira `active` y la vigencia `[startsAt, endsAt)`. Que además se muestre depende de `visibleNow`.'
    BannerHiddenReason:
      type: string
      enum: [PROMOTION_NOT_LIVE, CTA_TARGET_INACTIVE, IMAGE_UNAVAILABLE]
      description: 'Precedencia cuando hay varios motivos: `PROMOTION_NOT_LIVE` > `CTA_TARGET_INACTIVE` > `IMAGE_UNAVAILABLE`. Por qué un banner `PUBLISHED` no se muestra ahora: su promoción vinculada no está vigente o no aplica a su alcance, su producto/categoría destino está inactivo, o la imagen no tiene URL pública. `null` si se muestra o si no está `PUBLISHED`.'
    BannerCtaType:
      type: string
      enum: [NONE, MENU, PROMOTIONS, CATEGORY, PRODUCT, PAGE]
      description: 'Destino estructurado. Los enlaces externos (`EXTERNAL`) NO existen en v1: incorporarlos exige migración, ADR y decisión P19.'
    BannerPage:
      type: string
      enum: [CAREERS, TRACK_ORDER, INCIDENTS]
      description: 'Lista blanca de páginas públicas de la tienda (`/trabaja-con-nosotros`, `/consultar`, `/incidencias`); la ruta la resuelve la web, nunca se guarda texto libre.'
    BannerCtaInput:
      type: object
      required: [type]
      additionalProperties: false
      description: 'Solo el campo que corresponde al tipo: `CATEGORY` => `categoryId`; `PRODUCT` => `productId`; `PAGE` => `page`; el resto sin campos. Otra combinación => 422 `BANNER_CTA_INVALID`.'
      properties:
        type: { $ref: '#/components/schemas/BannerCtaType' }
        categoryId: { type: string, format: uuid, nullable: true }
        productId: { type: string, format: uuid, nullable: true }
        page:
          type: string
          nullable: true
          maxLength: 40
          description: 'Solo con `type=PAGE`. Valores permitidos: `CAREERS`, `TRACK_ORDER`, `INCIDENTS` (ver `BannerPage`). Se declara `string` a propósito: cualquier otro valor es una regla de negocio y responde 422 `BANNER_CTA_INVALID` (violation `TARGET_UNKNOWN`), no 400. Nunca se guardan rutas ni URL de texto libre.'
    BannerTranslationInput:
      type: object
      additionalProperties: false
      description: 'Textos de un idioma. Cadenas recortadas; en blanco = ausente. Longitudes en caracteres.'
      properties:
        title: { type: string, nullable: true, maxLength: 80 }
        subtitle: { type: string, nullable: true, maxLength: 160 }
        ctaLabel:
          {
            type: string,
            nullable: true,
            maxLength: 40,
            description: 'Texto del botón; ausente => la web usa su etiqueta genérica localizada.',
          }
        imageAlt:
          {
            type: string,
            nullable: true,
            maxLength: 200,
            description: 'Texto alternativo de la imagen en este idioma.',
          }
    BannerTranslationsInput:
      type: object
      required: [es]
      additionalProperties: false
      properties:
        es: { $ref: '#/components/schemas/BannerTranslationInput' }
        en: { allOf: [{ $ref: '#/components/schemas/BannerTranslationInput' }], nullable: true }
    BannerTranslationsPatch:
      type: object
      additionalProperties: false
      properties:
        es: { $ref: '#/components/schemas/BannerTranslationInput' }
        en:
          {
            allOf: [{ $ref: '#/components/schemas/BannerTranslationInput' }],
            nullable: true,
            description: '`null` elimina la traducción al inglés.',
          }
    BannerTranslationsView:
      type: object
      required: [es, en]
      properties:
        es: { $ref: '#/components/schemas/BannerTranslationInput' }
        en: { allOf: [{ $ref: '#/components/schemas/BannerTranslationInput' }], nullable: true }
    StoreBannerImage:
      type: object
      required: [url, mimeType]
      properties:
        url:
          {
            type: string,
            format: uri,
            maxLength: 2048,
            description: 'URL pública HTTPS permanente (`MediaUrlService`); nunca firmada.',
          }
        mimeType: { type: string }
      description: 'Imagen principal (escritorio). Ampliable con una imagen móvil sin romper clientes (campo opcional nuevo); no existe en v1.'
    StoreBannerCta:
      type: object
      required: [type]
      properties:
        type: { $ref: '#/components/schemas/BannerCtaType' }
        categorySlug: { type: string, nullable: true, description: 'Solo `CATEGORY`.' }
        productId: { type: string, format: uuid, nullable: true, description: 'Solo `PRODUCT`.' }
        page: { allOf: [{ $ref: '#/components/schemas/BannerPage' }], nullable: true }
    StoreBanner:
      type: object
      required: [id, title, subtitle, ctaLabel, imageAlt, image, cta, fallbackFields]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 80 }
        subtitle: { type: string, nullable: true, maxLength: 160 }
        ctaLabel: { type: string, nullable: true, maxLength: 40 }
        imageAlt: { type: string, minLength: 1, maxLength: 200 }
        image: { $ref: '#/components/schemas/StoreBannerImage' }
        cta: { $ref: '#/components/schemas/StoreBannerCta' }
        fallbackFields:
          type: array
          description: 'Campos cuyo texto vino en español porque faltaba en el idioma pedido.'
          items: { type: string, enum: [title, subtitle, ctaLabel, imageAlt] }
    StoreBannerList:
      type: object
      required: [branchId, locale, generatedAt, nextChangeAt, items]
      properties:
        branchId: { type: string, format: uuid, nullable: true }
        locale: { $ref: '#/components/schemas/BannerLocale' }
        generatedAt:
          {
            type: string,
            format: date-time,
            description: 'Hora del servidor al generar la respuesta (puede estar en caché hasta 30 s).',
          }
        nextChangeAt:
          type: string
          format: date-time
          nullable: true
          description: 'Próximo instante (en 14 días) en que puede cambiar el conjunto publicado por tiempo; `null` si no hay. Acota `max-age`.'
        items:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/StoreBanner' }
    AdminBannerBranchRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    AdminBannerPromotionRef:
      type: object
      required: [id, name, lifecycle]
      description: 'Referencia mínima; NUNCA incluye el código ni el descuento de un cupón.'
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        lifecycle:
          type: string
          enum: [INACTIVE, SCHEDULED, RUNNING, EXPIRED]
    AdminBannerImage:
      type: object
      required: [assetId, url, mimeType, sizeBytes]
      properties:
        assetId: { type: string, format: uuid }
        url: { type: string, format: uri, nullable: true, maxLength: 2048 }
        mimeType: { type: string }
        sizeBytes: { type: integer, format: int64, minimum: 1 }
    AdminBannerCta:
      type: object
      required: [type, categoryId, productId, page, targetLabel, targetActive]
      properties:
        type: { $ref: '#/components/schemas/BannerCtaType' }
        categoryId: { type: string, format: uuid, nullable: true }
        productId: { type: string, format: uuid, nullable: true }
        page: { allOf: [{ $ref: '#/components/schemas/BannerPage' }], nullable: true }
        targetLabel:
          {
            type: string,
            nullable: true,
            description: 'Nombre de la categoría o del producto destino (solo lectura).',
          }
        targetActive:
          {
            type: boolean,
            nullable: true,
            description: '`null` si el tipo no tiene destino de catálogo.',
          }
    AdminBannerSummary:
      type: object
      required:
        - id
        - code
        - title
        - image
        - cta
        - branchScope
        - branches
        - promotion
        - startsAt
        - endsAt
        - active
        - sortOrder
        - lifecycle
        - visibleNow
        - hiddenReason
        - hasEnglish
        - editable
        - version
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        code:
          {
            type: string,
            pattern: '^[a-z0-9][a-z0-9-]{2,63}$',
            description: 'Identificador estable, único e inmutable.',
          }
        title: { type: string, description: 'Título en español (idioma de respaldo).' }
        image: { $ref: '#/components/schemas/AdminBannerImage' }
        cta: { $ref: '#/components/schemas/AdminBannerCta' }
        branchScope: { $ref: '#/components/schemas/PromotionScope' }
        branches:
          type: array
          description: 'Sucursales seleccionadas, recortadas al alcance del actor; vacío si `branchScope=ALL`.'
          items: { $ref: '#/components/schemas/AdminBannerBranchRef' }
        promotion:
          allOf: [{ $ref: '#/components/schemas/AdminBannerPromotionRef' }]
          nullable: true
        startsAt:
          {
            type: string,
            format: date-time,
            nullable: true,
            description: 'Inclusivo; `null` = ya vigente.',
          }
        endsAt:
          {
            type: string,
            format: date-time,
            nullable: true,
            description: 'Exclusivo; `null` = sin fin.',
          }
        active: { type: boolean }
        sortOrder:
          {
            type: integer,
            minimum: 0,
            maximum: 9999,
            description: 'Prioridad: menor sale primero; no es única (empate por `createdAt`, `id`).',
          }
        lifecycle: { $ref: '#/components/schemas/BannerLifecycle' }
        visibleNow:
          {
            type: boolean,
            description: '`PUBLISHED` Y sin motivo para ocultarse (ver `hiddenReason`) con el reloj del servidor.',
          }
        hiddenReason:
          allOf: [{ $ref: '#/components/schemas/BannerHiddenReason' }]
          nullable: true
        hasEnglish: { type: boolean, description: 'Existe una traducción al inglés con título.' }
        editable:
          {
            type: boolean,
            description: 'El actor cubre TODAS las sucursales del banner con `banners.update`.',
          }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminBanner:
      allOf:
        - $ref: '#/components/schemas/AdminBannerSummary'
        - type: object
          required: [translations]
          properties:
            translations: { $ref: '#/components/schemas/BannerTranslationsView' }
    AdminBannerPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminBannerSummary' }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
    CreateBannerRequest:
      type: object
      required: [code, imageAssetId, translations, cta, branchScope]
      additionalProperties: false
      properties:
        code:
          { type: string, minLength: 3, maxLength: 64, pattern: '^[A-Za-z0-9][A-Za-z0-9-]{2,63}$' }
        imageAssetId: { type: string, format: uuid }
        translations: { $ref: '#/components/schemas/BannerTranslationsInput' }
        cta: { $ref: '#/components/schemas/BannerCtaInput' }
        branchScope: { $ref: '#/components/schemas/PromotionScope' }
        branchIds:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { type: string, format: uuid }
        promotionId: { type: string, format: uuid, nullable: true }
        startsAt: { type: string, format: date-time, nullable: true }
        endsAt: { type: string, format: date-time, nullable: true }
        sortOrder: { type: integer, minimum: 0, maximum: 9999 }
        active: { type: boolean, default: true }
    UpdateBannerRequest:
      type: object
      required: [expectedVersion]
      additionalProperties: false
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        imageAssetId: { type: string, format: uuid }
        translations: { $ref: '#/components/schemas/BannerTranslationsPatch' }
        cta: { $ref: '#/components/schemas/BannerCtaInput' }
        branchScope: { $ref: '#/components/schemas/PromotionScope' }
        branchIds:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { type: string, format: uuid }
        promotionId: { type: string, format: uuid, nullable: true }
        startsAt: { type: string, format: date-time, nullable: true }
        endsAt: { type: string, format: date-time, nullable: true }
        sortOrder: { type: integer, minimum: 0, maximum: 9999 }
    UpdateBannerStatusRequest:
      type: object
      required: [active]
      additionalProperties: false
      properties:
        active: { type: boolean }
        reason: { type: string, maxLength: 200, description: 'Opcional; sin datos personales.' }
    ReorderBannersRequest:
      type: object
      required: [orderedIds]
      additionalProperties: false
      properties:
        orderedIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
    AdminBannerOrderItem:
      type: object
      required: [id, sortOrder, version]
      properties:
        id: { type: string, format: uuid }
        sortOrder: { type: integer, minimum: 0 }
        version: { type: integer, minimum: 1 }
    AdminBannerOrder:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/AdminBannerOrderItem' }
    AdminOrderAction:
      type: string
      description: |
        Acciones que el backoffice puede ofrecer sobre un pedido. `accept|reject|start_preparing|mark_ready|complete|cancel` se ejecutan con las operaciones `…AdminOrder` de F22; `dispatch`
        es RESERVADA (F28 entrega propia; F29 PedidosYa) y NUNCA está habilitada en F22: se informa deshabilitada para que la web diferencie reparto propio y externo sin inventar capacidades.
        Los clientes deben tolerar valores futuros.
      enum: [accept, reject, start_preparing, mark_ready, complete, cancel, dispatch]
    AdminOrderActionState:
      type: object
      description: |
        Estado de una acción para ESTE personal y ESTE pedido. `enabled=false` con `NO_PERMISSION`: la web la OCULTA; con `DISPATCH_NOT_AVAILABLE` (entrega propia: llega con F28) o
        `PROVIDER_BLOCKED_EXTERNAL` (PedidosYa: integración pendiente de documentación/credenciales) la muestra DESHABILITADA con el motivo. Solo se listan las acciones que existen para el estado y la
        modalidad del pedido (un terminal no lista ninguna).
      required: [action, enabled, disabledReason]
      properties:
        action: { $ref: '#/components/schemas/AdminOrderAction' }
        enabled: { type: boolean }
        disabledReason:
          type: string
          nullable: true
          enum: [NO_PERMISSION, DISPATCH_NOT_AVAILABLE, PROVIDER_BLOCKED_EXTERNAL]
          description: '`null` si `enabled`. Los clientes deben tolerar valores futuros.'
    AdminOrderSummary:
      type: object
      description: |
        Fila ligera para tablero y listado (sin líneas, dirección, teléfono ni correo). `itemCount` = unidades (suma de cantidades). Importes como cadenas decimales GTQ.
      required:
        [
          id,
          orderNumber,
          displayNumber,
          status,
          branchId,
          branchName,
          fulfillmentType,
          deliveryProvider,
          customerName,
          itemCount,
          total,
          paymentMethodPreference,
          scheduledFor,
          placedAt,
          updatedAt,
          availableActions,
        ]
      properties:
        id: { type: string, format: uuid }
        orderNumber: { type: integer, format: int64 }
        displayNumber: { type: string, example: 'MON-001042' }
        status: { $ref: '#/components/schemas/OrderLifecycleStatus' }
        branchId: { type: string, format: uuid }
        branchName: { type: string }
        fulfillmentType: { type: string, enum: [PICKUP, DELIVERY] }
        deliveryProvider:
          allOf: [{ $ref: '#/components/schemas/CourierProvider' }]
          nullable: true
          description: '`null` en PICKUP.'
        customerName: { type: string }
        itemCount: { type: integer, minimum: 1 }
        total: { $ref: '#/components/schemas/CheckoutMoney' }
        paymentMethodPreference:
          allOf: [{ $ref: '#/components/schemas/OrderPaymentPreference' }]
          nullable: true
          description: 'Solo la preferencia declarada; NO es un pago (F24).'
        scheduledFor:
          type: string
          format: date-time
          nullable: true
          description: 'Pedido programado (P42: hoy siempre `null`; la programación es `MOCK_ONLY`).'
        placedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        availableActions:
          type: array
          maxItems: 8
          items: { $ref: '#/components/schemas/AdminOrderActionState' }
    AdminOrderPage:
      type: object
      required: [items, nextCursor, generatedAt]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/AdminOrderSummary' }
        nextCursor:
          type: string
          nullable: true
          maxLength: 200
          description: 'Cursor opaco de la página siguiente; `null` = no hay más.'
        generatedAt: { type: string, format: date-time }
    AdminOrderBoardSummary:
      type: object
      required: [pending, active, oldestPendingAt]
      properties:
        pending:
          type: integer
          minimum: 0
          description: 'Pedidos `pending` dentro del alcance (conteo real, no solo las tarjetas mostradas).'
        active:
          type: integer
          minimum: 0
          description: 'Pedidos en `pending`, `accepted`, `preparing`, `ready` u `on_the_way`.'
        oldestPendingAt:
          type: string
          format: date-time
          nullable: true
          description: '`placedAt` del `pending` más antiguo (`null` si no hay); sirve para resaltar la espera sin inventar un SLA.'
    AdminOrderBoardColumn:
      type: object
      required: [status, count, hasMore, items]
      properties:
        status: { $ref: '#/components/schemas/OrderLifecycleStatus' }
        count:
          type: integer
          minimum: 0
          description: 'Conteo real de la columna (activas: todos; terminales: dentro de `terminalWindowHours`).'
        hasMore: { type: boolean }
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/AdminOrderSummary' }
    AdminOrderBoard:
      type: object
      description: 'Tablero agregado. `columns` siempre trae los 9 estados del catálogo en este orden fijo.'
      required: [generatedAt, branchId, terminalWindowHours, pollAfterSeconds, summary, columns]
      properties:
        generatedAt: { type: string, format: date-time }
        branchId:
          type: string
          format: uuid
          nullable: true
          description: 'La sucursal pedida; `null` = todas las del alcance.'
        terminalWindowHours: { type: integer, enum: [24] }
        pollAfterSeconds: { type: integer, minimum: 5, maximum: 300 }
        summary: { $ref: '#/components/schemas/AdminOrderBoardSummary' }
        columns:
          type: array
          minItems: 9
          maxItems: 9
          items: { $ref: '#/components/schemas/AdminOrderBoardColumn' }
    AdminOrderHistoryEntry:
      type: object
      description: |
        Una fila de `order_status_history` para el PERSONAL. `actorName` = nombre del empleado que actuó (`null` si fue el cliente/sistema, p. ej. la creación, o si el empleado ya no existe);
        nunca el identificador ni el correo. `reason` es texto interno y solo lo ve el personal con `orders.read`.
      required: [seq, status, previousStatus, at, actorName, reason]
      properties:
        seq: { type: integer, minimum: 1, maximum: 50 }
        status: { $ref: '#/components/schemas/OrderLifecycleStatus' }
        previousStatus:
          allOf: [{ $ref: '#/components/schemas/OrderLifecycleStatus' }]
          nullable: true
        at: { type: string, format: date-time }
        actorName: { type: string, nullable: true }
        reason: { type: string, nullable: true, maxLength: 500 }
    AdminOrderContact:
      type: object
      description: 'Datos de contacto para atender el pedido. Sin correo. No se registran en logs ni en auditoría.'
      required: [fullName, phone]
      properties:
        fullName: { type: string }
        phone: { type: string, example: '+50255551234' }
    AdminOrderDetail:
      description: |
        Detalle para el personal: todo `AdminOrderSummary` más líneas/promociones/dirección (snapshots de F20), contacto, notas del cliente, desglose de importes, pago honesto e historial.
      allOf:
        - $ref: '#/components/schemas/AdminOrderSummary'
        - type: object
          required:
            [
              currency,
              lines,
              promotions,
              address,
              contact,
              notes,
              subtotal,
              extrasTotal,
              discountTotal,
              deliveryFee,
              payment,
              history,
              historyTruncated,
            ]
          properties:
            currency: { type: string, enum: [GTQ] }
            lines:
              type: array
              maxItems: 30
              items: { $ref: '#/components/schemas/OrderDetailLine' }
            promotions:
              type: array
              maxItems: 30
              items: { $ref: '#/components/schemas/OrderDetailPromotion' }
            address:
              allOf: [{ $ref: '#/components/schemas/OrderDetailAddress' }]
              nullable: true
              description: '`null` en PICKUP.'
            contact: { $ref: '#/components/schemas/AdminOrderContact' }
            notes: { type: string, nullable: true }
            subtotal: { $ref: '#/components/schemas/CheckoutMoney' }
            extrasTotal: { $ref: '#/components/schemas/CheckoutMoney' }
            discountTotal: { $ref: '#/components/schemas/CheckoutMoney' }
            deliveryFee: { $ref: '#/components/schemas/CheckoutMoney' }
            payment: { $ref: '#/components/schemas/OrderDetailPayment' }
            history:
              type: array
              maxItems: 50
              items: { $ref: '#/components/schemas/AdminOrderHistoryEntry' }
            historyTruncated:
              type: boolean
              description: '`true` si hay más de 50 eventos (se devuelven los 50 más recientes; faltan los más antiguos).'
    AdminOrderCommandRequest:
      type: object
      additionalProperties: false
      required: [expectedStatus]
      properties:
        expectedStatus:
          allOf: [{ $ref: '#/components/schemas/OrderLifecycleStatus' }]
          description: 'Estado que la persona vio al decidir. Debe ser un origen válido del comando; si el pedido ya cambió => 409.'
      example: { expectedStatus: pending }
    AdminOrderReasonRequest:
      type: object
      additionalProperties: false
      required: [expectedStatus, reason]
      properties:
        expectedStatus: { $ref: '#/components/schemas/OrderLifecycleStatus' }
        reason:
          type: string
          minLength: 3
          maxLength: 280
          description: 'Motivo INTERNO (recortado; sin caracteres de control). Se guarda en el historial y la auditoría; nunca se muestra al cliente (P64). No escribir datos personales.'
      example: { expectedStatus: pending, reason: 'Sin existencias de salmón' }
    AdminOrderTransition:
      type: object
      required: [from, to, at, replayed, appliedByMe]
      properties:
        from: { $ref: '#/components/schemas/OrderLifecycleStatus' }
        to: { $ref: '#/components/schemas/OrderLifecycleStatus' }
        at:
          type: string
          format: date-time
          description: 'Momento REAL en que se aplicó la transición (en una repetición, el de la original).'
        replayed:
          type: boolean
          description: '`true` = el pedido ya estaba en el destino por esta misma transición; no se escribió nada nuevo.'
        appliedByMe:
          type: boolean
          description: 'Quién la aplicó fue la misma persona que llama (útil para distinguir un doble clic de otra persona).'
    AdminOrderPendingAction:
      type: string
      description: |
        Revisión que queda PENDIENTE para otra feature tras cancelar/rechazar; informativa, jamás se ejecuta aquí. `payment_review`: la preferencia es transferencia bancaria y puede haber un pago por
        conciliar o devolver (F24/F26; hoy es una regla provisional por la preferencia, no un hecho de pago). `delivery_cancellation`: existe una entrega activa por cancelar (solo la reporta el puerto
        `OrderFulfillmentPort` de F28/F29; en F22 nunca aparece). Los clientes deben tolerar valores futuros.
      enum: [payment_review, delivery_cancellation]
    AdminOrderTransitionResult:
      type: object
      required: [order, transition, pendingActions]
      properties:
        order: { $ref: '#/components/schemas/AdminOrderSummary' }
        transition: { $ref: '#/components/schemas/AdminOrderTransition' }
        pendingActions:
          type: array
          maxItems: 4
          items: { $ref: '#/components/schemas/AdminOrderPendingAction' }
      example:
        order:
          id: '7b7c3d52-6a0f-4a8e-9a53-0f3a1e0b9c11'
          orderNumber: 1042
          displayNumber: 'MON-001042'
          status: cancelled
          branchId: '0b6f6a52-1c55-4c0e-8f3a-3a5d6a3c2b10'
          branchName: 'Sushi Mon Zona 10'
          fulfillmentType: PICKUP
          deliveryProvider: null
          customerName: 'Ana López'
          itemCount: 3
          total: '185.00'
          paymentMethodPreference: bank_transfer
          scheduledFor: null
          placedAt: '2026-11-18T18:02:11.000Z'
          updatedAt: '2026-11-18T18:20:41.512Z'
          availableActions: []
        transition:
          from: accepted
          to: cancelled
          at: '2026-11-18T18:20:41.512Z'
          replayed: false
          appliedByMe: true
        pendingActions: [payment_review]
    AdminOrderStateSnapshot:
      type: object
      required: [status, updatedAt]
      properties:
        status: { $ref: '#/components/schemas/OrderLifecycleStatus' }
        updatedAt: { type: string, format: date-time }
    AdminOrderStateError:
      description: |
        409 `ORDER_STATE_CONFLICT` (el pedido ya no está en `expectedStatus`) y 422 `ORDER_TRANSITION_INVALID` (transición imposible). Hereda `ErrorResponse` y añade el estado ACTUAL para que la web
        refresque sin otra consulta. En el 422, `violations[].code` ∈ `ORDER_TERMINAL`, `ORDER_FULFILLMENT_MISMATCH`, `ORDER_SOURCE_INVALID`, `ORDER_DISPATCH_NOT_AVAILABLE`, `ORDER_PROVIDER_BLOCKED_EXTERNAL`,
        `ORDER_CANCEL_NOT_ALLOWED`.
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          required: [current]
          properties:
            current: { $ref: '#/components/schemas/AdminOrderStateSnapshot' }
      example:
        statusCode: 409
        error: CONFLICT
        message: 'El pedido cambió mientras lo veías'
        code: ORDER_STATE_CONFLICT
        current: { status: rejected, updatedAt: '2026-11-18T18:20:41.512Z' }
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    health-token:
      type: apiKey
      in: header
      name: x-health-token
