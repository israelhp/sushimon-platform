# Contrato HTTP canónico de Sushi Mon (Contract First).
# Se diseña ANTES de implementar cada slice y se verifica contra NestJS con `pnpm contracts:check`.
# Estado: F00 (health y readiness) + F01 (identidad: /v1/auth/context, /v1/me) + F02 (MFA aal2: /v1/admin/me/context). No se agregan endpoints ficticios.
# Seguridad por defecto: Bearer JWT de Supabase Auth en todo salvo operaciones con `security: []` (health).
# Transversal a TODAS las respuestas: cabecera `X-Request-Id`; errores con `ErrorResponse`; 429 cuando
# se excede el rate limit global (no se repite por operación).
openapi: 3.0.3
info:
  title: Sushi Mon API
  version: 0.0.0
  description: Contrato canónico. Los cambios requieren PR con revisión (ver docs/contracts/README.md).
servers:
  - url: http://localhost:3001
    description: Desarrollo local
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Liveness probe
      tags: [health]
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1/health/ready:
    get:
      operationId: getReadiness
      summary: Readiness probe (interno, protegido con x-health-token)
      description: Verifica la conexión a PostgreSQL y que exista el esquema `app`.
      tags: [health]
      security:
        - health-token: []
      responses:
        '200':
          description: Dependencias disponibles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '401':
          description: Token de salud ausente o inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Base de datos o esquema `app` no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/auth/context:
    get:
      operationId: getAuthContext
      summary: Contexto de identidad y autorización del token actual
      description: |
        AUTENTICACIÓN ≠ AUTORIZACIÓN. Verifica el JWT de Supabase Auth (firma, emisor, audiencia,
        expiración y sujeto) y devuelve lo que el SERVIDOR sabe de esa identidad: si es personal activo y si
        su sesión ya cumple MFA (`aal2`, leído del JWT verificado). Funciona con sesión `aal1` (es el punto
        de entrada para configurar/verificar el segundo factor) pero NO devuelve roles, permisos ni
        sucursales hasta `aal2` (`access = GRANTED`). La web lo usa solo para mostrar/ocultar UI; cada
        endpoint vuelve a autorizar. En el primer acceso de un empleado preregistrado (`staff_users` sin
        `auth_user_id`) vincula la identidad por correo verificado con Google.
      tags: [auth]
      security:
        - bearer: []
      responses:
        '200':
          description: Contexto de la identidad
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthContextResponse'
        '401':
          description: Token ausente, inválido, expirado o con emisor/audiencia incorrectos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/admin/me/context:
    get:
      operationId: getAdminContext
      summary: Contexto administrativo del empleado (requiere aal2)
      description: |
        Primer endpoint del backoffice. Exige, en este orden: JWT válido → personal activo con asignación
        → sesión `aal2` (segundo factor TOTP verificado por Supabase Auth). Devuelve perfil básico, roles,
        sucursales y permisos efectivos calculados en el servidor. Convención: TODA ruta administrativa
        futura usa `@RequireStaff(...)` y hereda el mismo requisito `aal2`.
      tags: [admin]
      security:
        - bearer: []
      responses:
        '200':
          description: Contexto administrativo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminContextResponse'
        '401':
          description: Token ausente, inválido, expirado o con emisor/audiencia incorrectos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            No es personal activo, falta un permiso, o es personal con sesión `aal1` (mensaje `MFA_REQUIRED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/me:
    get:
      operationId: getMe
      summary: Perfil del cliente autenticado
      description: |
        Devuelve el perfil de cliente (`app.customers`) del `auth.users.id` del token. Si todavía no existe
        lo crea de forma idempotente a partir de las claims (el mismo UUID puede ser también empleado).
      tags: [me]
      security:
        - bearer: []
      responses:
        '200':
          description: Perfil del cliente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Token ausente, inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    AuthStaffAssignment:
      type: object
      required: [role, branchId]
      properties:
        role: { $ref: '#/components/schemas/StaffRole' }
        branchId:
          type: string
          format: uuid
          nullable: true
          description: null = todas las sucursales.
    AuthStaffContext:
      type: object
      required: [staffId, fullName, assignments, permissions, allBranches, branchIds]
      properties:
        staffId: { type: string, format: uuid }
        fullName: { type: string }
        assignments:
          type: array
          items: { $ref: '#/components/schemas/AuthStaffAssignment' }
        permissions:
          type: array
          description: Unión de permisos de los roles con asignación activa.
          items: { $ref: '#/components/schemas/StaffPermission' }
        allBranches:
          type: boolean
          description: true si alguna asignación activa no está limitada a una sucursal.
        branchIds:
          type: array
          items: { type: string, format: uuid }
    AuthContextResponse:
      type: object
      required:
        [
          authUserId,
          email,
          provider,
          isCustomer,
          aal,
          staffAuthorized,
          mfaRequired,
          access,
          staff,
          backofficeAccess,
        ]
      properties:
        authUserId: { type: string, format: uuid, description: 'auth.users.id (claim sub).' }
        email: { type: string, nullable: true }
        provider:
          { type: string, nullable: true, description: 'Proveedor de identidad (p. ej. google).' }
        isCustomer:
          type: boolean
          description: Existe un perfil de cliente para esta identidad.
        aal:
          type: string
          enum: [aal1, aal2]
          description: Nivel de aseguramiento de ESTA sesión, leído del JWT verificado (aal2 = TOTP verificado).
        staffAuthorized:
          type: boolean
          description: Personal activo con asignación activa (independiente del nivel MFA).
        mfaRequired:
          type: boolean
          description: Personal autorizado cuya sesión aún no es aal2 (debe configurar o verificar TOTP).
        access:
          type: string
          enum: [NOT_STAFF, MFA_REQUIRED, GRANTED]
          description: |
            NOT_STAFF = sin autorización administrativa; MFA_REQUIRED = personal activo en aal1;
            GRANTED = personal activo en aal2.
        staff:
          allOf:
            - $ref: '#/components/schemas/AuthStaffContext'
          nullable: true
          description: Solo con `access = GRANTED`; null en cualquier otro caso (nada administrativo antes de aal2).
        backofficeAccess:
          type: boolean
          description: Igual a `access = GRANTED`. Indicador para la UI; el acceso real lo decide cada endpoint.
    AdminContextResponse:
      type: object
      required: [authUserId, email, aal, staff]
      properties:
        authUserId: { type: string, format: uuid }
        email: { type: string, nullable: true }
        aal: { type: string, enum: [aal2] }
        staff: { $ref: '#/components/schemas/AuthStaffContext' }
    CustomerProfile:
      type: object
      required: [id, fullName, email, phone, createdAt]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    MeResponse:
      type: object
      required: [authUserId, email, customer, isStaff]
      properties:
        authUserId: { type: string, format: uuid }
        email: { type: string, nullable: true }
        customer: { $ref: '#/components/schemas/CustomerProfile' }
        isStaff: { type: boolean }
    ReadyResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok]
        checks:
          type: object
          required: [database, schemaApp]
          properties:
            database:
              type: string
              enum: [up]
            schemaApp:
              type: string
              enum: [present]
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    ErrorResponse:
      type: object
      required: [statusCode, error, message]
      properties:
        statusCode: { type: integer }
        error: { type: string }
        message: { type: string }
        requestId:
          type: string
          description: Identificador de la solicitud (igual a la cabecera X-Request-Id).
        details:
          type: array
          description: Mensajes de validación por campo (solo en 400).
          items: { type: string }
    # ─────────────────────────────────────────────────────────────────────────────────────────
    # Esquemas DRAFT (x-status: draft) — Etapa 1 UI First. Los consume sushimon-web (adaptador
    # mock) y se referenciarán desde `paths` slice a slice cuando la API los implemente.
    # Rutas previstas: docs/contracts/planned-endpoints.md. Montos en GTQ. Fechas ISO 8601 (UTC).
    # ─────────────────────────────────────────────────────────────────────────────────────────
    LocalizedText:
      x-status: draft
      type: object
      required: [es]
      properties:
        es: { type: string }
        en: { type: string }
    BranchHours:
      x-status: draft
      description: Horario de un día (0 = domingo … 6 = sábado), hora local de Guatemala.
      type: object
      required: [day, open, close, closed]
      properties:
        day: { type: integer, minimum: 0, maximum: 6 }
        open: { type: string, example: '12:00' }
        close: { type: string, example: '22:00' }
        closed: { type: boolean }
    DeliveryTierId:
      x-status: draft
      type: string
      enum: [near, mid, extended, far]
    DeliveryTier:
      x-status: draft
      type: object
      required: [id, fee, etaMinMinutes, etaMaxMinutes]
      properties:
        id: { $ref: '#/components/schemas/DeliveryTierId' }
        fee: { type: number }
        etaMinMinutes: { type: integer }
        etaMaxMinutes: { type: integer }
    CoverageRule:
      x-status: draft
      description: Nivel de envío de una sucursal para un municipio (zone null = todo el municipio).
      type: object
      required: [department, municipality, zone, tier]
      properties:
        department: { type: string }
        municipality: { type: string }
        zone: { type: string, nullable: true }
        tier: { $ref: '#/components/schemas/DeliveryTierId' }
    Municipality:
      x-status: draft
      type: object
      required: [name, zones]
      properties:
        name: { type: string }
        zones: { type: integer, description: Número de zonas (0 = el municipio no usa zonas). }
    Department:
      x-status: draft
      type: object
      required: [department, municipalities]
      properties:
        department: { type: string }
        municipalities:
          type: array
          items: { $ref: '#/components/schemas/Municipality' }
    StoreConfig:
      x-status: draft
      type: object
      required:
        - name
        - tagline
        - currency
        - timezone
        - serverTime
        - whatsappOrdersNumber
        - phoneDisplay
        - phoneHref
        - instagramHandle
        - instagramUrl
        - locationLabel
        - mapsUrl
        - wazeUrl
        - openingHours
        - weeklyHours
        - schedule
        - deliveryTiers
        - departments
        - nonexistentZones
      properties:
        name: { type: string }
        tagline: { type: string }
        currency: { type: string, enum: [GTQ] }
        timezone: { type: string, example: America/Guatemala }
        serverTime:
          type: string
          format: date-time
          description: Hora del servidor (en el mock, el reloj de la demo). La UI calcula horarios con ella.
        whatsappOrdersNumber: { type: string }
        phoneDisplay: { type: string }
        phoneHref: { type: string }
        instagramHandle: { type: string }
        instagramUrl: { type: string }
        locationLabel: { type: string }
        mapsUrl: { type: string }
        wazeUrl: { type: string }
        openingHours:
          type: array
          items:
            type: object
            required: [key, open, close]
            properties:
              key: { type: string, enum: [monThu, friSat, sun] }
              open: { type: string }
              close: { type: string }
        weeklyHours:
          type: array
          items: { $ref: '#/components/schemas/BranchHours' }
        schedule:
          type: object
          required: [stepMinutes, lastOrderBeforeClose, minLeadMinutes, days]
          properties:
            stepMinutes: { type: integer }
            lastOrderBeforeClose: { type: integer }
            minLeadMinutes: { type: integer }
            days: { type: integer }
        deliveryTiers:
          type: array
          items: { $ref: '#/components/schemas/DeliveryTier' }
        departments:
          type: array
          items: { $ref: '#/components/schemas/Department' }
        nonexistentZones:
          type: array
          description: Zonas de la Ciudad de Guatemala que no existen (20, 22, 23).
          items: { type: integer }
    Branch:
      x-status: draft
      type: object
      required:
        - id
        - name
        - area
        - zoneLabel
        - address
        - phone
        - hoursLabel
        - hours
        - radiusKm
        - status
        - isOpen
        - openNow
        - coverage
        - coverageLabels
      properties:
        id: { type: string }
        name: { type: string }
        area: { $ref: '#/components/schemas/LocalizedText' }
        zoneLabel: { type: string, example: 'Zona 4 · Cuatro Grados Norte' }
        address: { type: string }
        phone: { type: string }
        hoursLabel: { type: string }
        hours:
          type: array
          items: { $ref: '#/components/schemas/BranchHours' }
        radiusKm: { type: number }
        status: { type: string, enum: [active, coming_soon] }
        isOpen: { type: boolean, description: Interruptor abierta/cerrada del backoffice. }
        openNow: { type: boolean, description: isOpen y dentro del horario a la hora del servidor. }
        coverage:
          type: array
          items: { $ref: '#/components/schemas/CoverageRule' }
        coverageLabels:
          type: array
          items: { type: string }
    DeliveryQuote:
      x-status: draft
      type: object
      required:
        [
          covered,
          reason,
          quoteId,
          branchId,
          tier,
          fee,
          currency,
          etaMinMinutes,
          etaMaxMinutes,
          simulated,
          createdAt,
        ]
      properties:
        covered: { type: boolean }
        reason: { type: string, nullable: true, enum: [not_covered, branch_not_covered] }
        quoteId: { type: string, nullable: true }
        branchId: { type: string, nullable: true }
        tier:
          allOf: [{ $ref: '#/components/schemas/DeliveryTierId' }]
          nullable: true
        fee: { type: number, nullable: true }
        currency: { type: string, enum: [GTQ] }
        etaMinMinutes: { type: integer, nullable: true }
        etaMaxMinutes: { type: integer, nullable: true }
        simulated: { type: boolean }
        createdAt: { type: string, format: date-time }
    Category:
      x-status: draft
      type: object
      required: [id, name, sortOrder, visible, kind]
      properties:
        id: { type: string }
        name: { type: string }
        nameEn: { type: string }
        sortOrder: { type: integer }
        visible: { type: boolean }
        kind:
          type: string
          enum: [products, happy_hour]
          description: happy_hour es un acceso a la promoción; no agrupa productos.
        illustration: { type: string }
        jpLabel: { type: string }
    BranchAvailability:
      x-status: draft
      type: object
      required: [branchId, available]
      properties:
        branchId: { type: string }
        available: { type: boolean }
    Product:
      x-status: draft
      type: object
      required:
        [
          id,
          name,
          description,
          price,
          categoryId,
          illustration,
          featured,
          food,
          available,
          availability,
        ]
      properties:
        id: { type: string }
        name: { type: string }
        nameEn: { type: string }
        description: { type: string }
        descriptionEn: { type: string }
        price: { type: number }
        categoryId: { type: string }
        illustration: { type: string }
        featured: { type: boolean }
        food: { type: boolean }
        available:
          type: boolean
          description: Disponible en la sucursal pedida (o en alguna sucursal activa si no se indica).
        availability:
          type: array
          items: { $ref: '#/components/schemas/BranchAvailability' }
    HappyHourItem:
      x-status: draft
      type: object
      required: [id, name, priceLabel, group, illustration]
      properties:
        id: { type: string }
        name: { type: string }
        nameEn: { type: string }
        priceLabel: { type: string }
        group: { type: string }
        illustration: { type: string }
    Promotion:
      x-status: draft
      type: object
      required:
        - id
        - name
        - description
        - kind
        - value
        - daysOfWeek
        - startTime
        - endTime
        - validFrom
        - validTo
        - active
        - status
        - dineInOnly
        - items
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        kind: { type: string, enum: [2x1, percent, fixed_price] }
        value: { type: number, description: 0 para 2x1; porcentaje; o precio especial en GTQ. }
        daysOfWeek:
          type: array
          description: Días ISO (1 = lunes … 7 = domingo).
          items: { type: integer, minimum: 1, maximum: 7 }
        startTime: { type: string, example: '15:00' }
        endTime: { type: string, example: '18:00' }
        validFrom: { type: string, format: date }
        validTo: { type: string, format: date }
        active: { type: boolean }
        status:
          type: string
          enum: [current, scheduled, expired, inactive]
          description: Calculado con la fecha del servidor.
        dineInOnly: { type: boolean }
        subtitle: { $ref: '#/components/schemas/LocalizedText' }
        conditions: { $ref: '#/components/schemas/LocalizedText' }
        items:
          type: array
          items: { $ref: '#/components/schemas/HappyHourItem' }
    PromotionInput:
      x-status: draft
      type: object
      required: [name, kind, value, daysOfWeek, startTime, endTime, validFrom, validTo]
      properties:
        name: { type: string }
        description: { type: string }
        kind: { type: string, enum: [2x1, percent, fixed_price] }
        value: { type: number }
        daysOfWeek: { type: array, items: { type: integer } }
        startTime: { type: string }
        endTime: { type: string }
        validFrom: { type: string, format: date }
        validTo: { type: string, format: date }
        active: { type: boolean }
    OrderStatus:
      x-status: draft
      type: string
      enum: [received, accepted, preparing, ready, on_the_way, delivered, rejected, cancelled]
    PaymentStatus:
      x-status: draft
      type: string
      enum: [pending, approved, declined, review]
    PaymentMethod:
      x-status: draft
      type: string
      enum: [cash, card]
    DeliveryProvider:
      x-status: draft
      type: string
      enum: [pedidosya, own]
    DeliveryStatus:
      x-status: draft
      type: string
      description: >-
        PedidosYa: searching → assigned → picking_up → picked_up → on_the_way → delivered.
        Propio: assigned → on_the_way → delivered. failed = el proveedor no encontró repartidor.
      enum: [searching, assigned, picking_up, picked_up, on_the_way, delivered, failed]
    FulfillmentType:
      x-status: draft
      type: string
      enum: [pickup, delivery]
    OrderSchedule:
      x-status: draft
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [now, scheduled] }
        date:
          { type: string, format: date, description: Fecha local (YYYY-MM-DD) si es programado. }
        time: { type: string, example: '19:30', description: Hora local (HH:mm) si es programado. }
    OrderAddress:
      x-status: draft
      type: object
      required: [department, municipality, zone, line, references]
      properties:
        department: { type: string }
        municipality: { type: string }
        zone: { type: string, description: Vacío si el municipio no usa zonas. }
        line: { type: string }
        references: { type: string }
    OrderCustomer:
      x-status: draft
      type: object
      required: [name, phone, email]
      properties:
        name: { type: string }
        phone: { type: string }
        email: { type: string }
    OrderLine:
      x-status: draft
      type: object
      required: [productId, name, quantity, note, unitPrice, subtotal]
      properties:
        productId: { type: string }
        name: { type: string }
        quantity: { type: integer, minimum: 1, maximum: 99 }
        note: { type: string }
        unitPrice: { type: number, description: Precio al momento del pedido. }
        subtotal: { type: number }
    OrderStatusEvent:
      x-status: draft
      type: object
      required: [at, kind, status, reason, detail]
      properties:
        at: { type: string, format: date-time }
        kind: { type: string, enum: [order, payment, delivery] }
        status:
          type: string
          description: 'Valor de OrderStatus, PaymentStatus o DeliveryStatus según kind.'
        reason: { type: string, nullable: true }
        detail:
          type: string
          nullable: true
          description: 'Repartidor, referencia o proveedor.'
    Payment:
      x-status: draft
      type: object
      required: [method, status, amount, reference, cardBrand, cardLast4, simulated, processedAt]
      properties:
        method: { $ref: '#/components/schemas/PaymentMethod' }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        amount: { type: number }
        reference: { type: string, nullable: true }
        cardBrand: { type: string, nullable: true }
        cardLast4:
          type: string
          nullable: true
          description: Único dato de tarjeta que se conserva (nunca PAN completo, CVV ni PIN).
        simulated: { type: boolean }
        processedAt: { type: string, format: date-time, nullable: true }
    Delivery:
      x-status: draft
      type: object
      required:
        [
          provider,
          status,
          riderId,
          riderName,
          reference,
          cost,
          requestedAt,
          etaAt,
          deliveredAt,
          simulated,
        ]
      properties:
        provider: { $ref: '#/components/schemas/DeliveryProvider' }
        status: { $ref: '#/components/schemas/DeliveryStatus' }
        riderId: { type: string, nullable: true }
        riderName: { type: string, nullable: true }
        reference: { type: string, nullable: true }
        cost:
          {
            type: number,
            nullable: true,
            description: Costo del courier (null para repartidor propio).,
          }
        requestedAt: { type: string, format: date-time }
        etaAt: { type: string, format: date-time, nullable: true }
        deliveredAt: { type: string, format: date-time, nullable: true }
        simulated: { type: boolean }
    Order:
      x-status: draft
      type: object
      required:
        - id
        - createdAt
        - updatedAt
        - branchId
        - fulfillment
        - schedule
        - customer
        - address
        - lines
        - subtotal
        - deliveryFee
        - discount
        - total
        - currency
        - note
        - deliveryTier
        - status
        - rejectionReason
        - payment
        - delivery
        - history
        - incidents
      properties:
        id: { type: string, example: MON-490217, description: Número público del pedido. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        branchId: { type: string }
