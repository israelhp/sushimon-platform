# Contrato HTTP canónico de Sushi Mon (Contract First).
# Se diseña ANTES de implementar cada slice y se verifica contra NestJS con `pnpm contracts:check`.
# Estado: F17 (agregados públicos y búsqueda: /v1/store/bootstrap, /v1/store/search; ampliaciones ADITIVAS de /v1/store/menu y /v1/store/products/{slug}; CONTRACT_DEFINED, API pendiente) + F16 (banners: /v1/store/banners, /v1/admin/banners) + F15 (promociones: /v1/store/promotions, /v1/admin/promotions) + F14 (medios en Cloudflare R2: /v1/admin/media, /v1/admin/media/upload-intents|complete, /v1/admin/products/{id}/media[/order|/{mediaId}]) + F13 (precio y disponibilidad por sucursal: /v1/store/menu, /v1/admin/branches/{id}/products[/{productId}/pricing], /v1/admin/products/{id}/branches|availability) + F12 (modificadores de producto: /v1/admin/modifier-groups, /v1/admin/modifiers, /v1/admin/products/{id}/modifiers|modifier-groups; modifierGroups en la ficha pública) + F11 (productos y fichas de catálogo: /v1/store/products, /v1/admin/products) + F10 (categorías y jerarquía del menú: /v1/store/categories, /v1/admin/categories, /v1/admin/categories/reorder) + F09 (geografía, cobertura y zonas propias: /v1/locations/*, /v1/admin/delivery-zones, /v1/admin/branches/{id}/delivery-settings, /v1/delivery-coverage/check) + F08 (horarios, cierres y disponibilidad: /v1/branches/{id}/hours|availability, /v1/admin/branches/{id}/hours|closures) + F03 (RBAC granular y gestión de empleados: /v1/admin/staff, /v1/admin/roles, /v1/admin/permissions) + F00 (health y readiness) + F01 (identidad: /v1/auth/context, /v1/me) + F02 (MFA aal2: /v1/admin/me/context). No se agregan endpoints ficticios.
# Seguridad por defecto: Bearer JWT de Supabase Auth en todo salvo operaciones con `security: []` (health).
# Transversal a TODAS las respuestas: cabecera `X-Request-Id`; errores con `ErrorResponse`; 429 cuando
# se excede el rate limit global (no se repite por operación).
openapi: 3.0.3
info:
  title: Sushi Mon API
  version: 0.0.0
  description: Contrato canónico. Los cambios requieren PR con revisión (ver docs/contracts/README.md).
servers:
  - url: http://localhost:3001
    description: Desarrollo local
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Liveness probe
      tags: [health]
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1/health/ready:
    get:
      operationId: getReadiness
      summary: Readiness probe (interno, protegido con x-health-token)
      description: Verifica la conexión a PostgreSQL y que exista el esquema `app`.
      tags: [health]
      security:
        - health-token: []
      responses:
        '200':
          description: Dependencias disponibles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '401':
          description: Token de salud ausente o inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Base de datos o esquema `app` no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/auth/context:
    get:
      operationId: getAuthContext
      summary: Contexto de identidad y autorización del token actual
      description: |
        AUTENTICACIÓN ≠ AUTORIZACIÓN. Verifica el JWT de Supabase Auth (firma, emisor, audiencia,
        expiración y sujeto) y devuelve lo que el SERVIDOR sabe de esa identidad: si es personal activo y si
        su sesión ya cumple MFA (`aal2`, leído del JWT verificado). Funciona con sesión `aal1` (es el punto
        de entrada para configurar/verificar el segundo factor) pero NO devuelve roles, permisos ni
        sucursales hasta `aal2` (`access = GRANTED`). La web lo usa solo para mostrar/ocultar UI; cada
        endpoint vuelve a autorizar. En el primer acceso de un empleado preregistrado (`staff_users` sin
        `auth_user_id`) vincula la identidad por correo verificado con Google.
      tags: [auth]
      security:
        - bearer: []
      responses:
        '200':
          description: Contexto de la identidad
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthContextResponse'
        '401':
          description: Token ausente, inválido, expirado o con emisor/audiencia incorrectos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/admin/me/context:
    get:
      operationId: getAdminContext
      summary: Contexto administrativo del empleado (requiere aal2)
      description: |
        Primer endpoint del backoffice. Exige, en este orden: JWT válido → personal activo con asignación
        → sesión `aal2` (segundo factor TOTP verificado por Supabase Auth). Devuelve perfil básico, roles,
        sucursales y permisos efectivos calculados en el servidor. Convención: TODA ruta administrativa
        futura usa `@RequireStaff(...)` y hereda el mismo requisito `aal2`.
      tags: [admin]
      security:
        - bearer: []
      responses:
        '200':
          description: Contexto administrativo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminContextResponse'
        '401':
          description: Token ausente, inválido, expirado o con emisor/audiencia incorrectos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            No es personal activo, falta un permiso, o es personal con sesión `aal1` (mensaje `MFA_REQUIRED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/me:
    get:
      operationId: getMe
      summary: Perfil del cliente autenticado
      description: |
        Devuelve el perfil de cliente (`app.customers`) del `auth.users.id` del token. Si todavía no existe
        lo crea de forma idempotente a partir de las claims (el mismo UUID puede ser también empleado).
      tags: [me]
      security:
        - bearer: []
      responses:
        '200':
          description: Perfil del cliente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Token ausente, inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      operationId: updateMe
      summary: Actualiza nombre y teléfono del perfil del cliente autenticado
      description: |
        Actualización parcial: los campos omitidos no cambian. El cliente se identifica solo por el JWT; no
        existe forma de elegir otra identidad. El correo, la identidad, los roles y los permisos NO se pueden
        modificar aquí (400 por campo no permitido).
      tags: [me]
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerProfileRequest'
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '400':
          description: Datos inválidos (formato, longitud o campo no permitido)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token ausente, inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/me/storefront:
    get:
      operationId: getCustomerStorefront
      summary: Contexto agregado de Mi cuenta (una sola solicitud)
      description: |
        Devuelve la identidad (Supabase Auth), el perfil comercial y las secciones de Mi cuenta que aún
        no tienen contrato (`pendingSections`). Nunca representa como `0` datos de F05, F06 o F23 que
        todavía no existen. Crea el perfil de forma idempotente si todavía no existe.
      tags: [me]
      security:
        - bearer: []
      responses:
        '200':
          description: Contexto de cuenta del cliente autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerStorefrontContext'
        '401':
          description: Token ausente, inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/me/favorites:
    get:
      operationId: listMyFavorites
      summary: Favoritos del cliente autenticado (lista paginada + ids completos para los corazones)
      description: |
        F06. El propietario sale SIEMPRE del JWT (no existe `customerId` en la ruta, la consulta ni el cuerpo). Solo requiere
        sesión de cliente: ni rol de personal ni MFA (un empleado usa SUS favoritos como cliente). Sin fila de cliente, la lista
        es vacía y NO se crea el perfil (solo `addMyFavorite` lo crea, idempotente).

        Una sola respuesta sirve a la lista y al estado `isFavorite` de todas las tarjetas: `favoriteProductIds` trae TODOS los
        ids del cliente (acotado por `limit`, 200), más recientes primero, y `items` la página pedida. Con `pageSize=0` no se
        devuelven `items` ni se consulta el catálogo (uso de los corazones: respuesta barata). No hay endpoint por producto.

        `items[].product` es un resumen público mínimo (id, nombre, imagen, categoría) que entrega el catálogo; NUNCA precios ni
        disponibilidad por sucursal (los resuelve el catálogo/F13 del lado del cliente). Un producto retirado, despublicado o
        desconocido NO se borra del favorito: se devuelve con `status` y `product = null` (sin datos internos).

        Degradación honesta: mientras el catálogo real no exista (F11) o falle/expire la consulta, responde 200 con
        `catalogStatus = UNAVAILABLE` y cada item con `status = UNKNOWN` y `product = null`; `productId`, `addedAt`,
        `favoriteProductIds` y `total` siguen siendo reales (vienen de la base de datos). Nunca se inventan datos de producto.

        Orden: `addedAt` descendente, desempate por `productId` ascendente. Respuesta `Cache-Control: private, no-store`
        (datos personales: jamás en CDN ni caché compartida).
      tags: [me]
      security:
        - bearer: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 10000, default: 1 }
        - name: pageSize
          in: query
          description: '0 = solo `favoriteProductIds`/`total` (sin `items` ni consulta al catálogo). Máximo 50.'
          schema: { type: integer, minimum: 0, maximum: 50, default: 20 }
      responses:
        '200':
          description: Favoritos del cliente
          headers:
            Cache-Control:
              description: private, no-store
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerFavorites'
        '400':
          description: Parámetros de consulta inválidos o desconocidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token ausente, inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`RATE_LIMITED`: 120 por minuto por IP en esta ruta. `Cache-Control: no-store` y `Retry-After`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/me/favorites/{productId}:
    put:
      operationId: addMyFavorite
      summary: Marca un producto como favorito (idempotente)
      description: |
        F06. Sin cuerpo; el propietario sale del JWT. Idempotente: marcar dos veces (o dos clics/solicitudes simultáneas) es
        éxito igual, sin 409; `addedAt` no cambia si ya era favorito. Éxito = `204` siempre (creado o ya existente).
        El producto se valida contra el catálogo ANTES de guardar: un id no validado nunca se persiste. Producto inexistente,
        despublicado o retirado => `404 PRODUCT_NOT_FOUND` (no se distingue). Catálogo no disponible (hoy y hasta F11, o
        fallo/timeout) => `503 CATALOG_UNAVAILABLE`, sin escribir. Tope de favoritos por cliente (`limit` = 200): al
        alcanzarlo, un producto NUEVO => `422 FAVORITES_LIMIT_REACHED` (ya favorito => 204). El tope es exacto bajo
        concurrencia (se serializa por cliente; si el candado o el tiempo se agotan => `503 FAVORITES_BUSY`, reintentable). Crea el
        perfil de cliente si no existe (idempotente). Sin auditoría por clic. `Cache-Control: private, no-store`.
      tags: [me]
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/FavoriteProductId'
      responses:
        '204':
          description: El producto es favorito del cliente (recién marcado o ya lo era). Sin cuerpo.
          headers:
            Cache-Control:
              description: private, no-store
              schema: { type: string }
        '400':
          description: '`productId` no es un UUID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token ausente, inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`PRODUCT_NOT_FOUND`: el producto no existe o no está publicado'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`FAVORITES_LIMIT_REACHED`: el cliente ya tiene el máximo de favoritos'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`RATE_LIMITED`: 60 por minuto por IP en esta ruta. `Cache-Control: no-store` y `Retry-After`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: |
            `CATALOG_UNAVAILABLE`: no se puede validar el producto (catálogo sin implementar, caído o con timeout).
            No se guardó nada; reintentar más tarde. También `FAVORITES_BUSY` (candado o tiempo de la transacción agotados;
            reintentable). Son los únicos 5xx que exponen `code`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: removeMyFavorite
      summary: Quita un producto de los favoritos (idempotente)
      description: |
        F06. Sin cuerpo; el propietario sale del JWT, así que solo se puede borrar un favorito propio. Idempotente: si el
        producto no era favorito (o ya no existe en el catálogo) también es éxito `204`. No consulta el catálogo: funciona
        aunque no esté disponible. No crea el perfil de cliente (sin fila => 204). Sin auditoría por clic. `Cache-Control: private, no-store`.
      tags: [me]
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/FavoriteProductId'
      responses:
        '204':
          description: El producto ya no es favorito del cliente (lo fuera o no antes). Sin cuerpo.
          headers:
            Cache-Control:
              description: private, no-store
              schema: { type: string }
        '400':
          description: '`productId` no es un UUID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token ausente, inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`RATE_LIMITED`: 60 por minuto por IP en esta ruta. `Cache-Control: no-store` y `Retry-After`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/me/addresses:
    get:
      operationId: listMyAddresses
      summary: Lista las direcciones del cliente autenticado
      description: |
        Solo las direcciones del cliente del JWT. Orden estable: predeterminada primero, luego por fecha de
        creación ascendente. Sin direcciones devuelve `items: []` (nunca una dirección de ejemplo).
      tags: [me]
      security:
        - bearer: []
      responses:
        '200':
          description: Direcciones del cliente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAddressList'
        '401':
          description: Token ausente, inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createMyAddress
      summary: Crea una dirección del cliente autenticado
      description: |
        Valida el municipio contra el catálogo de F09 y normaliza los textos. Límite: 10 direcciones por
        cliente (409 `ADDRESS_LIMIT_REACHED`). Duplicado = misma línea normalizada, municipio y zona (409
        `ADDRESS_DUPLICATE`); la referencia no interviene. Guardar una dirección NO valida cobertura ni tarifa.

        Zona (ADR-0014): en la ciudad de Guatemala (municipio «Guatemala» del departamento «Guatemala», comparados por nombre
        sin tildes ni mayúsculas) la zona es OBLIGATORIA con formato «Zona N», N entero de 1 a 25; se normaliza (`zona 10`,
        ` Zona  10 ` -> `Zona 10`) y es la misma etiqueta que usa la cobertura (F09 `zoneLabel`). Faltante o vacía => 400
        `ZONE_REQUIRED`; fuera de formato o de rango => 400 `ZONE_INVALID` (ambos con `violations[0].path = zone`). En los
        demás municipios la zona es opcional y de texto libre (máx. 60).
      tags: [me]
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerAddressRequest'
      responses:
        '201':
          description: Dirección creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAddress'
        '400':
          description: Datos inválidos (`ADDRESS_INVALID`), municipio inexistente (`MUNICIPALITY_NOT_FOUND`) o zona de la ciudad de Guatemala ausente (`ZONE_REQUIRED`) o inválida (`ZONE_INVALID`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token ausente, inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Límite de direcciones alcanzado (ADDRESS_LIMIT_REACHED) o duplicado (ADDRESS_DUPLICATE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/me/addresses/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getMyAddress
      summary: Detalle de una dirección del cliente autenticado
      description: Solo si la dirección pertenece al cliente del JWT. Ajena o inexistente = 404 (sin enumeración).
      tags: [me]
      security:
        - bearer: []
      responses:
        '200':
          description: Dirección
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAddress'
        '400':
          description: Identificador inválido (no es UUID)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token ausente, inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No existe o no pertenece al cliente (ADDRESS_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      operationId: updateMyAddress
      summary: Edita una dirección del cliente autenticado
      description: |
        Actualización parcial con las mismas reglas de creación (duplicado excluyendo esta dirección).
        No cambia el propietario ni la predeterminada. No modifica pedidos históricos (F20 guarda su snapshot).
        La regla de zona (`ZONE_REQUIRED`/`ZONE_INVALID`) se evalúa sobre el resultado fusionado: una dirección antigua de la
        ciudad de Guatemala sin zona (guardada antes de la regla; no se migra) debe incluir `zone` al editarse.
      tags: [me]
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerAddressRequest'
      responses:
        '200':
          description: Dirección actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAddress'
        '400':
          description: Datos inválidos, campo no permitido, municipio inexistente o zona de la ciudad de Guatemala ausente (`ZONE_REQUIRED`) o inválida (`ZONE_INVALID`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token ausente, inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No existe o no pertenece al cliente (ADDRESS_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Duplicado (ADDRESS_DUPLICATE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteMyAddress
      summary: Elimina una dirección del cliente autenticado
      description: |
        Borrado físico de la dirección guardada. Si era la predeterminada, la reasigna de forma determinista
        (la más antigua restante, por `createdAt` e `id`); si no quedan, no hay predeterminada. Los pedidos
        confirmados conservan su snapshot (F20).
      tags: [me]
      security:
        - bearer: []
      responses:
        '204':
          description: Dirección eliminada
        '400':
          description: Identificador inválido (no es UUID)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token ausente, inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No existe o no pertenece al cliente (ADDRESS_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/me/addresses/{id}/default:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: setDefaultMyAddress
      summary: Marca una dirección como predeterminada
      description: |
        Operación explícita y transaccional: quita la predeterminada anterior y marca esta. Idempotente. Un
        índice único parcial en PostgreSQL impide dos predeterminadas aunque haya solicitudes concurrentes.
      tags: [me]
      security:
        - bearer: []
      responses:
        '200':
          description: Dirección predeterminada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAddress'
        '400':
          description: Identificador inválido (no es UUID)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token ausente, inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No existe o no pertenece al cliente (ADDRESS_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/branches:
    get:
      operationId: listPublicBranches
      summary: Sucursales activas (público)
      description: |
        F07. Solo sucursales con `active = true` y solo campos públicos, ordenadas por nombre y código.
        Sin autenticación. `active` es el estado ADMINISTRATIVO: NO implica que la sucursal esté abierta ahora
        ni que acepte pedidos (horarios y cierres: F08; pausa operativa: ver specs/005-branches-management).
        Lista vacía = ninguna sucursal activa. Caché compartida corta (`Cache-Control: public`).
      tags: [branches]
      security: []
      responses:
        '200':
          description: Sucursales activas
          headers:
            Cache-Control:
