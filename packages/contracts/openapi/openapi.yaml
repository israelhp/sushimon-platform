        phone: { type: string }
        position: { type: string }
        experience: { type: string, enum: [none, lt1, y1to3, gt3] }
        message: { type: string }
        consent: { type: boolean }
        cvFileName: { type: string }
        cvSizeBytes: { type: integer }
    BranchCount:
      x-status: draft
      type: object
      required: [branchId, orders, sales]
