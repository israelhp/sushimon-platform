            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/admin/categories/{id}:
    patch:
      operationId: updateAdminCategory
      summary: Edita una categoría (incluye mover y activar/desactivar)
      description: |
        F10. Exige `catalog.update` con alcance GLOBAL y `aal2`. Acepta `name`, `slug`, `description` (`null` la borra),
        `parentId` (`null` = pasa a raíz) y `active`; al menos un campo (si no, 400); cualquier otro => 400. No existe
