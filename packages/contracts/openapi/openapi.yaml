      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/ProductMediaId'
      responses:
        '204':
          description: 'Imagen desvinculada. Sin cuerpo.'
          headers:
            Cache-Control:
              description: no-store
              schema: { type: string }
        '400':
          description: 'UUID mal formado'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 'Token ausente, inválido o expirado'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'No es personal activo, falta `catalog.update` (con alcance global si es escritura) o la sesión no es aal2'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`PRODUCT_NOT_FOUND` o `PRODUCT_MEDIA_NOT_FOUND`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: '`PRODUCTS_BUSY` (reintentable)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  parameters:
    StaffId:
      name: id
      in: path
      required: true
      description: UUID del empleado (`staff_users.id`).
      schema: { type: string, format: uuid }
    RoleId:
      name: id
      in: path
      required: true
      description: UUID del rol.
      schema: { type: string, format: uuid }
    BranchId:
      name: id
      in: path
      required: true
      description: UUID de la sucursal.
      schema: { type: string, format: uuid }
    ClosureId:
      name: closureId
      in: path
      required: true
      description: UUID del cierre extraordinario (`branch_closures.id`).
      schema: { type: string, format: uuid }
    DeliveryZoneId:
      name: id
      in: path
      required: true
      description: UUID de la zona de entrega (`delivery_zones.id`).
      schema: { type: string, format: uuid }
    FavoriteProductId:
      name: productId
      in: path
      required: true
      description: UUID del producto (`products.id`, catálogo F11).
      schema: { type: string, format: uuid }
    CategoryId:
      name: id
      in: path
      required: true
      description: UUID de la categoría (`categories.id`).
      schema: { type: string, format: uuid }
    ProductId:
      name: id
      in: path
      required: true
      description: UUID del producto (`products.id`).
      schema: { type: string, format: uuid }
    ProductSlug:
      name: slug
      in: path
      required: true
      description: Slug público del producto (`products.slug`).
      schema: { type: string, maxLength: 80, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
    ModifierGroupId:
      name: id
      in: path
      required: true
      description: UUID del grupo de modificadores (`modifier_groups.id`).
      schema: { type: string, format: uuid }
    ModifierId:
      name: id
      in: path
      required: true
      description: UUID de la opción (`modifiers.id`).
      schema: { type: string, format: uuid }
    MediaAssetId:
      name: id
      in: path
      required: true
      description: UUID del asset de medios (`media_assets.id`, F14).
      schema: { type: string, format: uuid }
    ProductMediaId:
      name: mediaId
      in: path
      required: true
      description: UUID de la fila de imagen del producto (`product_media.id`, F14).
      schema: { type: string, format: uuid }
    BranchProductId:
      name: productId
      in: path
      required: true
      description: UUID del producto (`products.id`) cuyo precio de sucursal se gestiona (F13).
      schema: { type: string, format: uuid }
  schemas:
    PublicBranch:
      type: object
      description: Campos públicos de una sucursal activa (nada administrativo).
      required: [id, code, name, address, phone, latitude, longitude]
      properties:
        id: { type: string, format: uuid }
        code:
          { type: string, description: 'Identificador de negocio estable (slug en minúsculas).' }
        name: { type: string }
        address: { type: string }
        phone: { type: string, nullable: true }
        latitude: { type: number, nullable: true, minimum: -90, maximum: 90 }
        longitude: { type: number, nullable: true, minimum: -180, maximum: 180 }
    PublicBranchListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PublicBranch' }
    AdminBranch:
      type: object
      required: [id, code, name, address, phone, latitude, longitude, active, createdAt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        address: { type: string }
        phone: { type: string, nullable: true }
        latitude: { type: number, nullable: true, minimum: -90, maximum: 90 }
        longitude: { type: number, nullable: true, minimum: -180, maximum: 180 }
        active:
          type: boolean
          description: Estado ADMINISTRATIVO. No es "abierta ahora" (F08) ni "acepta pedidos".
        createdAt: { type: string, format: date-time }
    AdminBranchPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminBranch' }
        page: { type: integer }
        pageSize: { type: integer }
        total:
          { type: integer, description: 'Total de sucursales que cumplen el filtro y el alcance.' }
    CreateBranchRequest:
      type: object
      required: [code, name, address]
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 2
          maxLength: 40
          description: 'Se recorta y pasa a minúsculas; luego debe cumplir ^[a-z0-9]+(-[a-z0-9]+)*$.'
        name: { type: string, minLength: 1, maxLength: 100 }
        address: { type: string, minLength: 1, maxLength: 300 }
        phone:
          type: string
          nullable: true
          maxLength: 25
          description: 'Opcional. Dígitos con +, espacios, guiones y paréntesis; 7 a 15 dígitos.'
        latitude: { type: number, nullable: true, minimum: -90, maximum: 90 }
        longitude: { type: number, nullable: true, minimum: -180, maximum: 180 }
        active:
          type: boolean
          default: true
          description: Estado inicial (por defecto activa).
    UpdateBranchRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        address: { type: string, minLength: 1, maxLength: 300 }
        phone: { type: string, nullable: true, maxLength: 25 }
        latitude: { type: number, nullable: true, minimum: -90, maximum: 90 }
        longitude: { type: number, nullable: true, minimum: -180, maximum: 180 }
    UpdateBranchStatusRequest:
      type: object
      required: [active]
      additionalProperties: false
      properties:
        active: { type: boolean }
        reason:
          type: string
          maxLength: 200
          description: Obligatorio al desactivar; opcional al activar.
    BranchRef:
      type: object
      required: [id, name, code]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
    GrantScope:
      type: object
      description: |
        Alcance de UN permiso: `allBranches` (asignación global) o las sucursales ACTIVAS donde lo posee.
        Solo cuentan asignaciones activas de personal activo hacia sucursales activas.
      required: [allBranches, branchIds]
      properties:
        allBranches: { type: boolean }
        branchIds:
          type: array
          items: { type: string, format: uuid }
    StaffIdentityStatus:
      type: string
      description: |
        Derivado de `staff_users.auth_user_id`: PENDING_LINK = preautorizado, aún sin iniciar sesión con Google;
        LINKED = identidad vinculada. Independiente de `active`.
      enum: [PENDING_LINK, LINKED]
    RoleRef:
      type: object
      required: [id, code, name]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
    StaffAssignmentView:
      type: object
      required: [role, branch, effective]
      properties:
        role: { $ref: '#/components/schemas/RoleRef' }
        branch:
          allOf:
            - $ref: '#/components/schemas/BranchRef'
          nullable: true
          description: null = alcance GLOBAL (todas las sucursales; solo el rol admin).
        effective:
          type: boolean
          description: false si la asignación está inactiva o su sucursal está inactiva (no concede acceso operativo).
    StaffRef:
      type: object
      required: [id, fullName]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
    AdminStaff:
      type: object
      description: Nunca incluye `authUserId`.
      required:
        [
          id,
          fullName,
          email,
          active,
          identityStatus,
          linkedAt,
          createdAt,
          createdBy,
          assignments,
          manageable,
        ]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        email: { type: string, description: Minúsculas. }
        active: { type: boolean }
        identityStatus: { $ref: '#/components/schemas/StaffIdentityStatus' }
        linkedAt:
          {
            type: string,
            format: date-time,
            nullable: true,
            description: 'null si PENDING_LINK o vinculado antes de F03.',
          }
        createdAt: { type: string, format: date-time }
        createdBy:
          allOf:
            - $ref: '#/components/schemas/StaffRef'
          nullable: true
          description: null = proceso manual (bootstrap) o anterior a F03.
        assignments:
          type: array
          items: { $ref: '#/components/schemas/StaffAssignmentView' }
        manageable:
          type: boolean
          description: El solicitante puede modificar a este empleado (alcance completo y roles otorgables). Solo orienta la UI.
    AdminStaffPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminStaff' }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer, description: Total que cumple filtros y alcance. }
    StaffAssignmentInput:
      type: object
      required: [roleId, branchId]
      additionalProperties: false
      properties:
        roleId: { type: string, format: uuid }
        branchId:
          type: string
          format: uuid
          nullable: true
          description: null = global (solo con el rol admin y solo otorgable con alcance global).
    CreateStaffRequest:
      type: object
      required: [fullName, email, assignments]
      additionalProperties: false
      properties:
        fullName: { type: string, minLength: 1, maxLength: 120 }
        email:
          { type: string, format: email, maxLength: 254, description: Se normaliza a minúsculas. }
        assignments:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/StaffAssignmentInput' }
    UpdateStaffRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        fullName: { type: string, minLength: 1, maxLength: 120 }
        email:
          { type: string, format: email, maxLength: 254, description: Solo mientras PENDING_LINK. }
    UpdateStaffStatusRequest:
      type: object
      required: [active]
      additionalProperties: false
      properties:
        active: { type: boolean }
        reason: { type: string, maxLength: 200, description: Obligatorio al desactivar. }
    ReplaceStaffAssignmentsRequest:
      type: object
      required: [assignments]
      additionalProperties: false
      properties:
        assignments:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/StaffAssignmentInput' }
    PermissionRef:
      type: object
      required: [code, description, module]
      properties:
        code: { type: string, example: orders.accept }
        description: { type: string }
        module: { type: string, description: 'Prefijo del código (orders, staff...).' }
    AdminRole:
      type: object
      required: [id, code, name, isSystem, permissions, assignedStaffCount]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        isSystem: { type: boolean, description: Solo lectura (no editable por API). }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/PermissionRef' }
        assignedStaffCount:
          { type: integer, description: Empleados activos con una asignación activa de este rol. }
    AdminRoleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminRole' }
    ReplaceRolePermissionsRequest:
      type: object
      required: [permissions]
      additionalProperties: false
      properties:
        permissions:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: string, pattern: '^[a-z_]+\.[a-z_]+$' }
    AdminPermissionModule:
      type: object
      required: [module, permissions]
      properties:
        module: { type: string }
        permissions:
          type: array
          items:
            type: object
            required: [code, description]
            properties:
              code: { type: string }
              description: { type: string }
    AdminPermissionCatalog:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminPermissionModule' }
    AuthStaffAssignment:
      type: object
      required: [role, branchId]
      properties:
        role: { $ref: '#/components/schemas/StaffRole' }
        branchId:
          type: string
          format: uuid
          nullable: true
          description: null = todas las sucursales.
    AuthStaffContext:
      type: object
      required:
        [staffId, fullName, assignments, permissions, allBranches, branchIds, grants, branches]
      properties:
        staffId: { type: string, format: uuid }
        fullName: { type: string }
        assignments:
          type: array
          items: { $ref: '#/components/schemas/AuthStaffAssignment' }
        permissions:
          type: array
          description: Unión de permisos de los roles con asignación activa.
          items: { $ref: '#/components/schemas/StaffPermission' }
        allBranches:
          type: boolean
          deprecated: true
          description: |
            Unión plana de todos los roles (solo orienta la UI; NUNCA autoriza). Usa `grants` para saber dónde aplica
            cada permiso.
        branchIds:
          type: array
          deprecated: true
          items: { type: string, format: uuid }
        grants:
          type: object
          description: |
            F03. Permiso -> alcance (`GrantScope`), calculado en el servidor solo con asignaciones activas de personal
            activo hacia sucursales activas. Sin caché entre solicitudes: la revocación es inmediata.
          additionalProperties:
            $ref: '#/components/schemas/GrantScope'
        branches:
          type: array
          description: Sucursales ACTIVAS sobre las que el empleado tiene algún permiso (todas las activas si tiene alcance global).
          items: { $ref: '#/components/schemas/BranchRef' }
    AuthContextResponse:
      type: object
      required:
        [
          authUserId,
          email,
          provider,
          isCustomer,
          aal,
          staffAuthorized,
          mfaRequired,
          access,
          staff,
          backofficeAccess,
        ]
      properties:
        authUserId: { type: string, format: uuid, description: 'auth.users.id (claim sub).' }
        email: { type: string, nullable: true }
        provider:
          { type: string, nullable: true, description: 'Proveedor de identidad (p. ej. google).' }
        isCustomer:
          type: boolean
          description: Existe un perfil de cliente para esta identidad.
        aal:
          type: string
          enum: [aal1, aal2]
          description: Nivel de aseguramiento de ESTA sesión, leído del JWT verificado (aal2 = TOTP verificado).
        staffAuthorized:
          type: boolean
          description: Personal activo con asignación activa (independiente del nivel MFA).
        mfaRequired:
          type: boolean
          description: Personal autorizado cuya sesión aún no es aal2 (debe configurar o verificar TOTP).
        access:
          type: string
          enum: [NOT_STAFF, MFA_REQUIRED, GRANTED]
          description: |
            NOT_STAFF = sin autorización administrativa; MFA_REQUIRED = personal activo en aal1;
            GRANTED = personal activo en aal2.
        staff:
          allOf:
            - $ref: '#/components/schemas/AuthStaffContext'
          nullable: true
          description: Solo con `access = GRANTED`; null en cualquier otro caso (nada administrativo antes de aal2).
        backofficeAccess:
          type: boolean
          description: Igual a `access = GRANTED`. Indicador para la UI; el acceso real lo decide cada endpoint.
    AdminContextResponse:
      type: object
      required: [authUserId, email, aal, staff]
      properties:
        authUserId: { type: string, format: uuid }
        email: { type: string, nullable: true }
        aal: { type: string, enum: [aal2] }
        staff: { $ref: '#/components/schemas/AuthStaffContext' }
    CustomerProfile:
      type: object
      required: [id, fullName, email, phone, createdAt]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    MeResponse:
      type: object
      required: [authUserId, email, customer, isStaff]
      properties:
        authUserId: { type: string, format: uuid }
        email:
          {
            type: string,
            nullable: true,
            description: 'Correo de la identidad de Supabase Auth (solo lectura).',
          }
        customer: { $ref: '#/components/schemas/CustomerProfile' }
        isStaff: { type: boolean }
    UpdateCustomerProfileRequest:
      type: object
      additionalProperties: false
      description: |
        Campos editables del perfil comercial. Omitido = sin cambios. `phone: null` o cadena vacía borra el teléfono.
        Cualquier otra propiedad (identidad, correo, roles, permisos, `customerId`…) responde 400.
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 120
          description: |
            Se recortan espacios y se colapsan los internos. Solo letras (incluidas tildes y ñ), espacios,
            apóstrofos, guiones y puntos; debe contener al menos una letra. Sin `null`.
        phone:
          type: string
          nullable: true
          maxLength: 20
          description: |
            Guatemala: 8 dígitos locales, con o sin `+502`/`502`; se guarda como `+502XXXXXXXX`.
            Otros países: `+` seguido de 8 a 15 dígitos (E.164), sin prefijo de país asumido.
    CustomerStorefrontContext:
      type: object
      required: [authUserId, email, provider, avatarUrl, customer, isStaff, pendingSections]
      properties:
        authUserId: { type: string, format: uuid }
        email:
          {
            type: string,
            nullable: true,
            description: 'Correo de la identidad (Auth), no editable.',
          }
        provider:
          { type: string, nullable: true, description: 'Proveedor de identidad (p. ej. google).' }
        avatarUrl:
          type: string
          format: uri
          nullable: true
          description: Imagen de la identidad de Google (https, dominio permitido). Null si no existe. No se copia a almacenamiento propio.
        customer: { $ref: '#/components/schemas/CustomerProfile' }
        isStaff: { type: boolean }
        pendingSections:
          type: array
          description: Secciones de Mi cuenta sin contrato implementado todavía. No tienen contadores.
          items:
            type: string
            enum: [favorites, orders]
    FavoriteProductStatus:
      type: string
      description: |
        Estado del producto favorito según el catálogo (enum abierto: tolerar valores futuros). `ACTIVE` = publicado y
        pedible; `UNAVAILABLE` = publicado pero no pedible ahora; `INACTIVE` = despublicado; `REMOVED` = ya no existe;
        `UNKNOWN` = no se pudo consultar el catálogo. Solo `ACTIVE` y `UNAVAILABLE` traen `product`.
      enum: [ACTIVE, INACTIVE, UNAVAILABLE, REMOVED, UNKNOWN]
    FavoriteProductSummary:
      type: object
      description: |
        Resumen público MÍNIMO que entrega el catálogo. Sin precios, sin disponibilidad por sucursal y sin datos internos
        (costos, notas, banderas administrativas). El precio vigente lo resuelve el catálogo de la sucursal elegida.
      required: [id, name, nameEn, imageUrl, categoryId]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        nameEn: { type: string, nullable: true }
        imageUrl: { type: string, format: uri, nullable: true }
        categoryId: { type: string, format: uuid, nullable: true }
    FavoriteItem:
      type: object
      required: [productId, addedAt, status, product]
      properties:
        productId: { type: string, format: uuid }
        addedAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/FavoriteProductStatus' }
        product:
          allOf:
            - $ref: '#/components/schemas/FavoriteProductSummary'
          nullable: true
          description: null cuando `status` no es `ACTIVE`/`UNAVAILABLE` (retirado, despublicado o catálogo no consultable).
    CustomerFavorites:
      type: object
      required: [items, page, pageSize, total, favoriteProductIds, limit, catalogStatus]
      properties:
        items:
          type: array
          description: Página pedida (vacía con `pageSize=0`).
          items: { $ref: '#/components/schemas/FavoriteItem' }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer, description: Cantidad total de favoritos del cliente (≤ `limit`). }
        favoriteProductIds:
          type: array
          description: TODOS los ids favoritos (≤ `limit`), más recientes primero. Fuente del estado `isFavorite` de las tarjetas.
          items: { type: string, format: uuid }
        limit: { type: integer, description: Tope de favoritos por cliente (200). }
        catalogStatus:
          type: string
          description: '`UNAVAILABLE` = el catálogo no pudo consultarse; los items vienen con `status = UNKNOWN` y `product = null`.'
          enum: [AVAILABLE, UNAVAILABLE]
    ReadyResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok]
        checks:
          type: object
          required: [database, schemaApp]
          properties:
            database:
              type: string
              enum: [up]
            schemaApp:
              type: string
              enum: [present]
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    ErrorResponse:
      type: object
      required: [statusCode, error, message]
      properties:
        statusCode: { type: integer }
        error: { type: string }
        message: { type: string }
        requestId:
          type: string
          description: Identificador de la solicitud (igual a la cabecera X-Request-Id).
        details:
          type: array
          description: Mensajes de validación por campo (solo en 400).
          items: { type: string }
        code:
          type: string
          description: |
            Código de negocio estable y legible por máquina (opcional; p. ej. `HOURS_VERSION_CONFLICT`, `CLOSURE_OVERLAP`,
            `SCHEDULE_INVALID`, `BRANCH_SCHEDULE_BUSY`, `CLOSURE_LIMIT_REACHED`; F09: `DELIVERY_ZONE_DUPLICATE`, `DELIVERY_ZONE_VERSION_CONFLICT`, `MUNICIPALITY_NOT_FOUND`, `DEPARTMENT_NOT_FOUND`, `BRANCH_NOT_AVAILABLE`; F10: `CATEGORY_SLUG_TAKEN`, `CATEGORY_CYCLE`, `CATEGORY_DEPTH_EXCEEDED`, `CATEGORY_PARENT_INVALID`, `CATEGORY_REORDER_MISMATCH`, `CATEGORY_LIMIT_REACHED`; F11: `PRODUCT_NOT_FOUND`, `PRODUCT_SLUG_TAKEN`, `PRODUCT_SKU_TAKEN`, `PRODUCT_CATEGORY_INVALID`, `PRODUCT_MEDIA_INVALID`; F12: `MODIFIER_GROUP_NOT_FOUND`, `MODIFIER_NOT_FOUND`, `MODIFIER_GROUP_NAME_TAKEN`, `MODIFIER_NAME_TAKEN`, `MODIFIER_LIMITS_INVALID`, `MODIFIER_GROUP_UNSATISFIABLE`, `MODIFIER_LIMIT_REACHED`, `MODIFIER_REORDER_MISMATCH`, `MODIFIER_GROUP_INVALID`; F13: `BRANCH_NOT_FOUND`, `BRANCH_PRICE_INVALID`, `PRODUCT_NOT_AVAILABLE` (solo servicio, F19), `BRANCH_NOT_AVAILABLE`; 503 reintentable: `CATEGORIES_BUSY`, `PRODUCTS_BUSY`, `MODIFIERS_BUSY`, `BRANCH_PRODUCTS_BUSY`; F14: `MEDIA_NOT_FOUND`, `MEDIA_TYPE_NOT_ALLOWED`, `MEDIA_TOO_LARGE`, `MEDIA_PENDING_LIMIT_REACHED`, `MEDIA_UPLOAD_EXPIRED` (410), `MEDIA_OBJECT_MISSING`, `MEDIA_CONTENT_MISMATCH`, `MEDIA_IN_USE`, `MEDIA_ALREADY_ATTACHED`, `MEDIA_ASSET_NOT_READY`, `MEDIA_REORDER_MISMATCH`, `PRODUCT_MEDIA_NOT_FOUND`, `MEDIA_STORAGE_UNAVAILABLE` (503), `MEDIA_BUSY` (503 reintentable)). Los clientes deben ramificar por `code`, nunca por `message`.
        violations:
          type: array
          description: Violaciones estructuradas de reglas de negocio (422/409 de F08 y F09).
          items: { $ref: '#/components/schemas/ErrorViolation' }
    ErrorViolation:
      type: object
      description: Violación estructurada de una regla de negocio (F08). `path` localiza el elemento; `code` es estable.
      required: [path, code, message]
      properties:
        path:
          type: string
          example: 'days[4].intervals[1]'
          description: 'Ruta en la solicitud (p. ej. `days[4].intervals[1]`, `startsAt`) o, en CLOSURE_OVERLAP, `closures/<id>` del cierre en conflicto.'
        code:
          type: string
          example: INTERVAL_OVERLAP
        message: { type: string }
    BranchHoursInterval:
      type: object
      description: |
        Intervalo semiabierto `[opensAt, closesAt)` en hora LOCAL del restaurante. `opensAt < closesAt` estricto; no
        existe cruce de medianoche (un turno nocturno se divide en dos días). `closesAt` admite `24:00` (fin del día).
      required: [opensAt, closesAt]
      additionalProperties: false
      properties:
        opensAt:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: '11:00'
        closesAt:
          type: string
          pattern: '^(([01][0-9]|2[0-3]):[0-5][0-9]|24:00)$'
          example: '24:00'
    BranchHoursDay:
      type: object
      required: [weekday, intervals]
      additionalProperties: false
      properties:
        weekday:
          type: integer
          enum: [1, 2, 3, 4, 5, 6, 7]
          description: 'ISO 8601: 1 = lunes … 7 = domingo. NO es `Date.getDay()` (0 = domingo).'
        intervals:
          type: array
          maxItems: 6
          description: Ordenados por `opensAt` en las respuestas. Vacío = sin atención ese día.
          items: { $ref: '#/components/schemas/BranchHoursInterval' }
    BranchHours:
      type: object
      description: Horario semanal administrativo con su versión de concurrencia optimista.
      required: [branchId, timezone, version, days]
      properties:
        branchId: { type: string, format: uuid }
        timezone: { type: string, example: America/Guatemala }
        version:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 (hex minúsculas) del horario canónico. Reenviar como `expectedVersion`.
        days:
          type: array
          minItems: 7
          maxItems: 7
          description: Siempre 7 días, `weekday` 1..7 ascendente.
          items: { $ref: '#/components/schemas/BranchHoursDay' }
    PublicClosureWindow:
      type: object
      description: Ventana de cierre sin motivo (el motivo nunca es público).
      required: [startsAt, endsAt]
      properties:
        startsAt: { type: string, format: date-time, description: 'Instante UTC (`...Z`).' }
        endsAt: { type: string, format: date-time, description: 'Instante UTC (`...Z`).' }
    PublicBranchHours:
      type: object
      required: [branchId, timezone, days, upcomingClosures]
      properties:
        branchId: { type: string, format: uuid }
        timezone: { type: string, example: America/Guatemala }
        days:
          type: array
          minItems: 7
          maxItems: 7
          items: { $ref: '#/components/schemas/BranchHoursDay' }
        upcomingClosures:
          type: array
          maxItems: 10
          description: Cierres en curso o que empiezan en los próximos 30 días, por `startsAt`. Sin motivo.
          items: { $ref: '#/components/schemas/PublicClosureWindow' }
    ReplaceBranchHoursRequest:
      type: object
      required: [expectedVersion, days]
      additionalProperties: false
      properties:
        expectedVersion:
          type: string
          pattern: '^[0-9a-f]{64}$'
        days:
          type: array
          minItems: 7
          maxItems: 7
          description: Exactamente los 7 `weekday` 1..7, cada uno una vez, en cualquier orden.
          items: { $ref: '#/components/schemas/BranchHoursDay' }
    BranchClosure:
      type: object
      required: [id, branchId, startsAt, endsAt, reason, status]
      properties:
        id: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        startsAt: { type: string, format: date-time, description: 'Instante UTC (`...Z`).' }
        endsAt:
          { type: string, format: date-time, description: 'Instante UTC (`...Z`), exclusivo.' }
        reason: { type: string, nullable: true, maxLength: 200 }
        status:
          type: string
          enum: [upcoming, active, past]
          description: Calculado con el reloj del servidor al responder.
    CreateBranchClosureRequest:
      type: object
      required: [startsAt, endsAt]
      additionalProperties: false
      properties:
        startsAt:
          type: string
          format: date-time
          description: ISO 8601 CON zona (`Z` u offset como `-06:00`). Sin zona => 400. Se normaliza a UTC, truncado al segundo.
        endsAt:
          type: string
          format: date-time
          description: Igual que `startsAt`; debe ser posterior.
        reason: { type: string, nullable: true, maxLength: 200 }
    UpdateBranchClosureRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        reason: { type: string, nullable: true, maxLength: 200 }
    BranchClosureList:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/BranchClosure' }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    BranchAvailabilityReason:
      type: string
      enum: [OPEN, INACTIVE, OUTSIDE_BUSINESS_HOURS, EXCEPTIONAL_CLOSURE, SCHEDULE_NOT_CONFIGURED]
      description: |
        Motivo único por orden de evaluación. `INACTIVE` solo lo produce el puerto interno (HTTP público => 404).
        No existen `ORDER_CUTOFF_REACHED` ni `OPERATIONS_PAUSED` (bloqueados: falta política/modelo de negocio).
    BranchAvailability:
      type: object
      required:
        - branchId
        - timezone
        - serverTime
        - isOpenNow
        - isAcceptingOrders
        - reason
        - nextOpensAt
        - nextClosesAt
        - nextTransitionAt
      properties:
        branchId: { type: string, format: uuid }
        timezone: { type: string, example: America/Guatemala }
        serverTime:
          {
            type: string,
            format: date-time,
            description: 'Instante UTC (`...Z`) de la evaluación.',
          }
        isOpenNow: { type: boolean }
        isAcceptingOrders:
          type: boolean
          description: Hoy igual a `isOpenNow`. Siempre implica `isOpenNow`.
        reason: { $ref: '#/components/schemas/BranchAvailabilityReason' }
        nextOpensAt:
          type: string
          format: date-time
          nullable: true
          description: Próxima apertura real (si está cerrada); `null` si abierta o sin apertura en 14 días.
        nextClosesAt:
          type: string
          format: date-time
          nullable: true
          description: Próximo cierre real (si está abierta); `null` si cerrada o sin cierre en 14 días.
        nextTransitionAt:
          type: string
          format: date-time
          nullable: true
          description: El menor no nulo de `nextOpensAt`/`nextClosesAt`. Horizonte máximo 14 días.
