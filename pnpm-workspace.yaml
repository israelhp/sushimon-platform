packages:
  - sushimon-api
  - sushimon-web
  - packages/*

# Build scripts permitidos (pnpm 10 bloquea los demás por defecto).
onlyBuiltDependencies:
  - '@nestjs/core'
  - '@swc/core'
  - '@prisma/engines'
  - prisma
  - esbuild
  - sharp
  - unrs-resolver

# openapi-typescript declara peer typescript ^5; funciona con 6.0 (verificado por `pnpm contracts:check`).
peerDependencyRules:
  allowedVersions:
    openapi-typescript>typescript: '6'

# Auditoría (CI: `pnpm audit --prod --audit-level high`). Excepción TEMPORAL y acotada:
# GHSA-fc5q-39xc-vjpf (picomatch <= 4.0.7, ReDoS con extglobs repetidos). Sin versión corregida publicada (4.0.7 es la última).
# Única ruta: next-intl > @parcel/watcher > picomatch (vigilancia de archivos de mensajes en build/dev). El patrón lo fija el
# propio proyecto, no entrada de usuario, y la tienda/API en ejecución no la usan. Además `@parcel/watcher` solo lo usa el
# extractor de next-intl (SourceFileWatcher), que únicamente arranca con `experimental.extract` en createNextIntlPlugin; este
# proyecto NO lo activa (sushimon-web/next.config.ts), así que picomatch no se ejecuta. Si algún día se activa, REVISAR esta
# excepción. Revisar y QUITAR cuando exista picomatch > 4.0.7.
auditConfig:
  ignoreGhsas:
    - GHSA-fc5q-39xc-vjpf
