name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter sushimon-api test:e2e
      - name: Integración con PostgreSQL real
        run: pnpm --filter sushimon-api test:integration
        env:
          # Credencial efímera del servicio de CI (no es un secreto del proyecto).
          DATABASE_URL_TEST: postgresql://postgres:ci-only-password@localhost:5432/postgres
      - run: pnpm contracts:check
      - run: pnpm secrets:scan
      - run: pnpm claude:validate
      - run: pnpm build
      - name: Dependencias (vulnerabilidades altas)
        run: pnpm audit --prod --audit-level high

  web-e2e:
    name: Web E2E + accesibilidad (datos simulados)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Instalar Chromium
        run: pnpm --filter sushimon-web exec playwright install --with-deps chromium
      # Flujos (tienda y backoffice) y axe en claro/oscuro. La comparación visual contra los
      # prototipos (`test:visual`) es un reporte local, no un gate.
      - run: pnpm --filter sushimon-web test:e2e
      - name: Reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: sushimon-web/playwright-report/
          retention-days: 7

  commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
