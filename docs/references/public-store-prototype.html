<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MON SUSHI Demo</title>
<meta name="description" content="Demo interactiva de pedidos de MON SUSHI.">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Dela+Gothic+One&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&display=swap" rel="stylesheet" />
<script>
      /* Aplica tema e idioma antes de pintar (evita el parpadeo del tema incorrecto). */
      (function () {
        try {
          var t = localStorage.getItem('monsushi-theme');
          if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          if (t === 'dark') document.documentElement.classList.add('dark');
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', t === 'dark' ? '#0B0B0F' : '#FAF7F2');
          var l = localStorage.getItem('monsushi-lang');
          if (l === 'en' || l === 'es') document.documentElement.lang = l;
        } catch (e) {}
      })();
    </script>
